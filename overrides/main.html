{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set description = page.meta.description if page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page.title | striptags if page.title else config.site_name }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social-preview/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    // Material renders the site name as plain text; link it home like the logo.
    (function () {
      var logo = document.querySelector(".md-header__button.md-logo");
      var name = document.querySelector(".md-header__topic:first-child .md-ellipsis");
      if (!logo || !name) return;
      var link = document.createElement("a");
      link.href = logo.getAttribute("href");
      link.className = "md-header__home";
      link.textContent = name.textContent.trim();
      name.replaceChildren(link);
    })();
  </script>
{% endblock %}
