<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <!-- GitHub social preview card. 1280x640 is GitHub's canvas, not the 1200x630
       used by blog covers; everything else follows blog/IMAGE-STYLE.md.
       Icons are inlined base64 from homarr-labs/dashboard-icons so the file
       stays self contained. Render with: make social-preview
       Never hand-edit the PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="300" y1="0" x2="300" y2="640"/><line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="500" y1="0" x2="500" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="700" y1="0" x2="700" y2="640"/><line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="900" y1="0" x2="900" y2="640"/><line x1="1000" y1="0" x2="1000" y2="640"/>
    <line x1="1100" y1="0" x2="1100" y2="640"/><line x1="1200" y1="0" x2="1200" y2="640"/>
    <line x1="0" y1="90" x2="1280" y2="90"/><line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/><line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="450" x2="1280" y2="450"/><line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- url, top right -->
  <text x="1200" y="58" text-anchor="end" font-size="22" fill="#8898aa" letter-spacing="0.5">github.com/mortennordbye/homelab</text>

  <!-- compact header -->
  <rect x="80" y="74" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="104" y="104" font-size="20" font-weight="700" fill="#5db7ff" letter-spacing="3">INFRASTRUCTURE AS CODE &#183; GITOPS &#183; SELF HOSTED</text>
  <text x="98" y="152" font-size="46" font-weight="700" fill="#e8eef5">Eden</text>
  <text x="98" y="200" font-size="46" font-weight="700" fill="#e8eef5">Homelab Infrastructure</text>

  <!-- motif: provisioning chain, code to reconciled cluster.
       Tiles 130px (the upper bound in IMAGE-STYLE.md) so the motif carries the
       card. Centres at 220/500/780/1060, spacing 280. -->
  <g transform="translate(0,260)">
    <line x1="220" y1="135" x2="1060" y2="135" stroke="#2a3849" stroke-width="4"/>
    <line x1="220" y1="135" x2="1060" y2="135" stroke="#5db7ff" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="2 18" stroke-linecap="round"/>

    <rect x="155" y="70" width="130" height="130" rx="24" fill="#eef2f7"/>
    <image x="178" y="93" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="220" y="242" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">terraform plan</text>

    <rect x="435" y="70" width="130" height="130" rx="24" fill="#eef2f7"/>
    <image x="458" y="93" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="500" y="242" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">Proxmox VMs</text>

    <rect x="715" y="70" width="130" height="130" rx="24" fill="#eef2f7"/>
    <image x="738" y="93" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="780" y="242" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">Talos cluster</text>

    <rect x="995" y="70" width="130" height="130" rx="24" fill="#eef2f7"/>
    <image x="1018" y="93" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="1060" y="242" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">Argo CD sync</text>
  </g>
</svg>
