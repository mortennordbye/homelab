site_name: Homelab docs
site_description: How the Genesis homelab is built and run
site_url: https://docs.nordbye.it/
repo_url: https://github.com/mortennordbye/homelab
repo_name: mortennordbye/homelab
edit_uri: edit/main/docs/
docs_dir: docs

# The backlog stays in the repo only; links to it are rewritten to GitHub by the hook.
exclude_docs: |
  backlog/

hooks:
  - scripts/docs_site_hooks.py

theme:
  name: material
  # Dark only, like nordbye.it; the colours live in the stylesheet.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Source Serif 4
    code: Fragment Mono
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  logo: assets/logo/logo.png
  favicon: assets/logo/logo.png

extra_css:
  - assets/stylesheets/theme.css

plugins:
  - search
  # docs/ holds no loose files, so the site root redirects to the spec.
  - redirects:
      redirect_maps:
        index.md: architecture/README.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
