# Playwright against the production image: the smoke tests (`make smoke`) and
# the hero poster capture (`make hero-posters`).
services:
  web:
    image: ${IMAGE:-portfolio:dev}

  smoke:
    # Keep the tag equal to @playwright/test in package.json, or the bundled browsers go missing.
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    environment:
      BASE_URL: http://web:3000
      CI: ${CI:-}
    volumes:
      - .:/app
      # Keeps the container's glibc node_modules off the host checkout.
      - /app/node_modules
    depends_on:
      - web

  posters:
    extends:
      service: smoke
    command: sh -c "npm ci --no-audit --no-fund && node scripts/hero-posters.mts"
    profiles:
      - posters
