<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1584" height="396" viewBox="0 0 1584 396" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
    <linearGradient id="name" x1="108" y1="0" x2="762" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="0.40" stop-color="#e8eef5"/>
      <stop offset="0.74" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="396"/><line x1="200" y1="0" x2="200" y2="396"/>
    <line x1="300" y1="0" x2="300" y2="396"/><line x1="400" y1="0" x2="400" y2="396"/>
    <line x1="500" y1="0" x2="500" y2="396"/><line x1="600" y1="0" x2="600" y2="396"/>
    <line x1="700" y1="0" x2="700" y2="396"/><line x1="800" y1="0" x2="800" y2="396"/>
    <line x1="900" y1="0" x2="900" y2="396"/><line x1="1000" y1="0" x2="1000" y2="396"/>
    <line x1="1100" y1="0" x2="1100" y2="396"/><line x1="1200" y1="0" x2="1200" y2="396"/>
    <line x1="1300" y1="0" x2="1300" y2="396"/><line x1="1400" y1="0" x2="1400" y2="396"/>
    <line x1="1500" y1="0" x2="1500" y2="396"/>
    <line x1="0" y1="90" x2="1584" y2="90"/><line x1="0" y1="180" x2="1584" y2="180"/>
    <line x1="0" y1="270" x2="1584" y2="270"/><line x1="0" y1="360" x2="1584" y2="360"/>
  </g>

  <!-- accent bar + identity (top-left, clear of the profile avatar that overlaps the lower-left) -->
  <rect x="80" y="38" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="108" y="58" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#5db7ff" letter-spacing="3">KUBERNETES &#183; AZURE &#183; GITOPS &#183; TERRAFORM</text>
  <text x="106" y="114" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="52" font-weight="700" fill="url(#name)" letter-spacing="-1">Morten Victor Nordbye</text>
  <text x="110" y="148" font-size="26" font-weight="400" fill="#b0bccb" letter-spacing="0.3">Cloud Engineer &amp; Architect</text>

  <!-- urls, bottom right (away from the top-right edit pencil and clear of the avatar) -->
  <text x="1498" y="362" text-anchor="end" xml:space="preserve" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="0.3"><tspan fill="#5db7ff" letter-spacing="1">PORTFOLIO</tspan><tspan fill="#8898aa"> &#183; </tspan><tspan fill="#e8eef5">nordbye.it</tspan><tspan fill="#5a6878">     |     </tspan><tspan fill="#5db7ff" letter-spacing="1">TECH BLOG</tspan><tspan fill="#8898aa"> &#183; </tspan><tspan fill="#e8eef5">blog.nordbye.it</tspan></text>

  <!-- tech stack tiles, right (5, right-aligned under the urls) -->
  <g>
    <rect x="982" y="52" width="84" height="84" rx="16" fill="#eef2f7"/>
    <image x="997" y="67" width="54" height="54" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

    <rect x="1090" y="52" width="84" height="84" rx="16" fill="#eef2f7"/>
    <image x="1105" y="67" width="54" height="54" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

    <rect x="1198" y="52" width="84" height="84" rx="16" fill="#eef2f7"/>
    <image x="1213" y="67" width="54" height="54" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

    <rect x="1306" y="52" width="84" height="84" rx="16" fill="#eef2f7"/>
    <image x="1321" y="67" width="54" height="54" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

    <rect x="1414" y="52" width="84" height="84" rx="16" fill="#eef2f7"/>
    <image x="1429" y="67" width="54" height="54" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
