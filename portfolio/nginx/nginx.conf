worker_processes  auto;
# /var/cache/nginx is mounted as a tmpfs emptyDir in the k8s deployment,
# so it's the one path guaranteed writable under readOnlyRootFilesystem.
# Both the pid file and all nginx temp paths live there.
pid /var/cache/nginx/nginx.pid;

error_log  /dev/stderr notice;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    keepalive_requests 1000;

    # All temp paths live under /var/cache/nginx which is the deployment's
    # tmpfs emptyDir. We don't expect bodies large enough to spill to disk
    # (static site, GET/HEAD only) — these just keep nginx from failing at
    # startup under readOnlyRootFilesystem.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Cache stat() results so repeat hits for the same static files skip
    # the filesystem lookup. Static export means most paths are stable
    # within a deploy.
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Serve pre-built .gz siblings (produced in the Dockerfile build stage)
    # instead of re-compressing every request. brotli_static would go here
    # too but the alpine apk brotli module is ABI-mismatched with the
    # nginxinc image — see BACKLOG.
    gzip_static on;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: tell browsers to lock to HTTPS for a year. Cloudflare also adds
    # this at the edge, but having it at origin means it stays correct if
    # the CDN is ever bypassed.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/*.conf;
}
