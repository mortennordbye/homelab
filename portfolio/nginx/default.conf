# Redirect www -> apex
server {
    listen 8080;
    server_name www.nordbye.it;
    return 301 http://nordbye.it$request_uri;
}

server {
    listen 8080 default_server;
    http2 on;
    server_name nordbye.it stage.nordbye.it _;

    root   /usr/share/nginx/html/nordbye.it;
    index  index.html;

    # Long-cache hashed Next.js build artifacts
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-cache other static assets shipped by the build
    location ~* \.(?:webp|avif|png|svg|woff2|woff|ico|pdf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Medium-cache the metadata files. Rarely change, but not hashed —
    # 1 day is a safe ceiling. (Without this they fall through to `/` and
    # inherit the must-revalidate HTML policy, which PSI flags as too short.)
    location ~* \.(?:xml|txt|webmanifest|json)$ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # trailingSlash: true → URL `/foo/` should map to `/foo/index.html`
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/index.html $uri.html =404;
        # Let Cloudflare edge-cache HTML safely: instant invalidation on
        # deploy because the browser must revalidate, but the CDN can hold
        # a cached copy and serve it without round-tripping to origin.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /500.html;
    location = /500.html { internal; }
}
