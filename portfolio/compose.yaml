services:
  # One-shot: copies the cv-bundle stage's merged public/ + CV artifacts into
  # the named volume, then exits; dev waits on it.
  cv-bundle:
    build:
      context: .
      target: cv-bundle
    container_name: portfolio-cv-bundle
    volumes:
      - cv-bundle:/dest
    # Wipe first so stale variants never linger across rebuilds.
    command: sh -c "rm -rf /dest/* /dest/.[!.]* 2>/dev/null; cp -a /staging/. /dest/"
    labels:
      env: dev
      app: portfolio

  dev:
    image: node:24-alpine
    container_name: portfolio-dev
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Overlays the bind mount: host public/ never gains the cv-*.pdf files.
      - cv-bundle:/app/public:ro
      - node_modules:/app/node_modules
      # Keep Turbopack's persistence cache (~1 GB after a while) off the
      # host filesystem. Reset with `docker volume rm portfolio_next-cache`
      # if the dev container OOMs on cache load.
      - next-cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Local fixture standing in for the ConfigMap at /config/status.json;
      # without it /api/v1/infra has almost nothing to show the fun room.
      STATUS_FILE: "/app/dev/status.json"
    depends_on:
      cv-bundle:
        condition: service_completed_successfully
    labels:
      env: dev
      app: portfolio

volumes:
  node_modules:
  cv-bundle:
  next-cache:
