# Requires SLSA provenance signed by the repo's build workflow. Each check takes seconds.
# Weigh the cold-start cost before a switch to Deny: docs/platform/policy/README.md.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-first-party-images
  annotations:
    policies.kyverno.io/title: Verify first-party images
    policies.kyverno.io/description: >-
      First-party images carry SLSA provenance from their build workflow, signed through
      Sigstore's public instance.
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - portfolio
            - stage-portfolio
            - blog
            - stage-blog
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchImageReferences:
    - glob: ghcr.io/mortennordbye/homelab/portfolio*
    - glob: ghcr.io/mortennordbye/homelab/blog*
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  attestors:
    - name: github
      cosign:
        keyless:
          # One identity only: Kyverno rejects a list with "multiple identities are not supported".
          identities:
            - subjectRegExp: ^https://github\.com/mortennordbye/homelab/\.github/workflows/build-(portfolio|blog)\.yaml@refs/heads/main$
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.slsa, [attestors.github])).all(e, e > 0)
      message: No verified SLSA provenance from the expected workflow.
