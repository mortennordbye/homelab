apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-mutable-image-tags
  annotations:
    # No ReplicaSets: their Pods and Deployment are checked already, and old revisions
    # would keep reporting a config that no longer runs.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Disallow mutable image tags
    policies.kyverno.io/description: >-
      Images must name a version tag or a digest. No tag, latest, or a branch-style
      tag lets a restart pull different code than Git describes.
spec:
  # Kyverno fills in these defaults; spelled out so Argo CD sees no drift.
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Enforce
  rules:
    - name: pinned-image
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        allowExistingViolations: true
        message: "Every image needs a version tag or a digest, not latest or a branch name."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^([^@]*/)?[^:@/]+$', '{{ element.image }}') }}"
                    operator: Equals
                    value: true
                  - key: "{{ regex_match(':(latest|develop|dev|main|master|nightly|edge|stable)$', '{{ element.image }}') }}"
                    operator: Equals
                    value: true
