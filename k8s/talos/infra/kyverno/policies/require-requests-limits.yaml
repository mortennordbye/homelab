apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    # No ReplicaSets: their Pods and Deployment are checked already, and old revisions
    # would keep reporting a config that no longer runs.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Require requests and a memory limit
    policies.kyverno.io/description: >-
      Every container sets CPU and memory requests so the scheduler can place it, and
      a memory limit so one leak cannot take the node.
spec:
  # Kyverno fills in these defaults; spelled out so Argo CD sees no drift.
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  rules:
    - name: requests-and-memory-limit
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: "Set resources.requests.cpu, resources.requests.memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
