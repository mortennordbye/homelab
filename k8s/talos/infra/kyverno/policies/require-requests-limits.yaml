apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require requests and a memory limit
    policies.kyverno.io/description: >-
      Every container sets CPU and memory requests so the scheduler can place it, and
      a memory limit so one leak cannot take the node.
spec:
  background: true
  rules:
    - name: requests-and-memory-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: "Set resources.requests.cpu, resources.requests.memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
