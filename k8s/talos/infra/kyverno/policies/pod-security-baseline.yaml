# Namespaces whose job needs host access are excluded rather than reported forever.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
  annotations:
    # No ReplicaSets: their Pods and Deployment are checked already, and old revisions
    # would keep reporting a config that no longer runs.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Pod Security Standards, baseline
    policies.kyverno.io/description: >-
      The baseline Pod Security Standard: no privileged containers, host namespaces,
      hostPath volumes or added capabilities beyond the default set.
spec:
  # Kyverno fills in these defaults; spelled out so Argo CD sees no drift.
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  rules:
    - name: baseline
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - falco
                - csi-driver-nfs
                - csi-proxmox
                - intel-gpu-plugin
      validate:
        failureAction: Audit
        allowExistingViolations: true
        podSecurity:
          level: baseline
          version: latest
