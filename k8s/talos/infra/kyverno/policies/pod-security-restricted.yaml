apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted
  annotations:
    policies.kyverno.io/title: Pod Security Standards, restricted
    policies.kyverno.io/description: >-
      The restricted Pod Security Standard: non-root, no privilege escalation, all
      capabilities dropped and a RuntimeDefault seccomp profile.
spec:
  # Kyverno fills in these defaults; spelled out so Argo CD sees no drift.
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  rules:
    - name: restricted
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - falco
                - csi-driver-nfs
                - csi-proxmox
                - intel-gpu-plugin
      validate:
        failureAction: Audit
        allowExistingViolations: true
        podSecurity:
          level: restricted
          version: latest
