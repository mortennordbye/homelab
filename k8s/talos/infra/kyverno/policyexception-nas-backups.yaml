# The k8s-backups NFS export only admits root, so the dump jobs and the backup checks that
# read them run as root with DAC_OVERRIDE, CHOWN or FOWNER; docs/platform/backups/README.md.
# Scoped to the two controls and these images, so anything else the pods break still reports.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: nas-backup-root
spec:
  exceptions:
    - policyName: pod-security-restricted
      ruleNames:
        - restricted
        - autogen-restricted
        - autogen-cronjob-restricted
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Job
            - CronJob
          namespaces:
            - identity
          names:
            - authentik-db-backup*
      - resources:
          kinds:
            - Pod
            - Job
            - CronJob
          namespaces:
            - logeverylift
          names:
            - logeverylift-db-backup*
      - resources:
          kinds:
            - Pod
            - Job
            - CronJob
          namespaces:
            - etcd-backup
          names:
            - etcd-backup*
      - resources:
          kinds:
            - Pod
            - Job
            - CronJob
          namespaces:
            - backup-check
          names:
            - restore-test*
            - ha-backup-check*
  podSecurity:
    - controlName: Running as Non-root
      images:
        - postgres:*-alpine
        - docker.io/library/alpine:*
        - docker.io/restic/restic:*
    - controlName: Capabilities
      images:
        - postgres:*-alpine
        - docker.io/library/alpine:*
        - docker.io/restic/restic:*
---
# VolSync movers write the restic repositories on the same root-only export, so they run as
# uid 0 with added capabilities. moverSecurityContext cannot change that without breaking backups.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: volsync-movers-root
spec:
  exceptions:
    - policyName: pod-security-restricted
      ruleNames:
        - restricted
        - autogen-restricted
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Job
          namespaces:
            - arr-stack
            - audiobookshelf
            - garage
            - gluetun-vpn
            - headroom
            - mealie
            - monitoring
            - open-webui
            - plex-media-stack
            - trek
            - verksted
          names:
            - volsync-src-*
            - volsync-dst-*
  podSecurity:
    - controlName: Running as Non-root
      images:
        - quay.io/backube/volsync:*
    - controlName: Running as Non-root user
      images:
        - quay.io/backube/volsync:*
    - controlName: Capabilities
      images:
        - quay.io/backube/volsync:*
    # The repository is an inline nfs volume, which restricted does not allow.
    - controlName: Volume Types
