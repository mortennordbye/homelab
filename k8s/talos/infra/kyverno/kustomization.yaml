apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

resources:
  - namespace.yaml
  - policies/disallow-mutable-image-tags.yaml
  - policies/pod-security-baseline.yaml
  - policies/pod-security-restricted.yaml
  - policies/require-requests-limits.yaml
  - policies/verify-first-party-images.yaml
  - policyexception-monitoring.yaml
  - policyexception-host-access.yaml
  - policyexception-nas-backups.yaml
  - policyexception-media-root.yaml
  - policyexception-control-plane.yaml

# kustomize's namespace transformer does not know the ServiceMonitor CRD is
# namespaced, so set the namespace explicitly.
patches:
  - target:
      kind: ServiceMonitor
    patch: |
      - op: add
        path: /metadata/namespace
        value: kyverno

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    includeCRDs: true
    skipTests: true
    namespace: kyverno
    version: 3.10.0
    releaseName: kyverno
    valuesFile: ./values.yaml
  - name: policy-reporter
    repo: https://kyverno.github.io/policy-reporter
    namespace: kyverno
    version: 3.11.2
    releaseName: policy-reporter
    valuesFile: ./values-policy-reporter.yaml
