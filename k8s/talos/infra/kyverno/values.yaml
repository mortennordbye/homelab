features:
  # A Kyverno outage must never block the API server, even for the enforcing policies.
  forceFailurePolicyIgnore:
    enabled: true
  # Exceptions are only read from the kyverno namespace, so no app can exempt itself.
  policyExceptions:
    enabled: true
    namespace: kyverno

admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

backgroundController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

reportsController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

cleanupController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
