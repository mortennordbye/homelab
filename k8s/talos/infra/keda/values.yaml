operator:
  replicaCount: 1

resources:
  operator:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
