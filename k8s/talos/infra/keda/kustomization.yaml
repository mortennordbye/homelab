apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

namespace: keda

# kustomize's namespace transformer doesn't recognise the ServiceMonitor CRD
# as namespaced, so stamp it explicitly — the infra Application has no default
# destination namespace to fall back on.
patches:
  - target:
      kind: ServiceMonitor
    patch: |
      - op: add
        path: /metadata/namespace
        value: keda

helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    includeCRDs: true
    namespace: keda
    version: 2.20.2
    releaseName: keda
    valuesFile: ./values.yaml
