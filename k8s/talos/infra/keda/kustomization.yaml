apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

namespace: keda

# kustomize's namespace transformer does not know the ServiceMonitor CRD is
# namespaced, so set the namespace explicitly. The infra Application has no
# default destination namespace.
patches:
  - target:
      kind: ServiceMonitor
    patch: |
      - op: add
        path: /metadata/namespace
        value: keda

helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    includeCRDs: true
    namespace: keda
    version: 2.21.0
    releaseName: keda
    valuesFile: ./values.yaml
