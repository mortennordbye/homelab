apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: kro
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kro
  ingress:
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
