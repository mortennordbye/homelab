# stage: receives new Freight directly from the Warehouse (auto-promoted per
# ProjectConfig), rewrites the image tag in the portfolio-stage kustomization,
# pushes to main, then verifies with an HTTP smoke test. Only Freight that
# passes verification here becomes available to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: portfolio-smoke
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/mortennordbye/homelab.git
        - name: appPath
          value: k8s/talos/apps/portfolio-stage
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/portfolio
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          config:
            path: ./repo/${{ vars.appPath }}
            images:
              # Freight tag is the 0.0.<run_number> semver the Warehouse selected.
              - image: ${{ vars.imageRepo }}
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: "chore(portfolio): promote ${{ imageFrom(vars.imageRepo).Tag }} to stage"
        - uses: git-push
          config:
            path: ./repo
        # Trigger the Argo CD sync and block until portfolio-stage is Synced +
        # Healthy, so the promotion (and its verification) only succeed once the
        # deploy has converged. Pin the app to the commit this promotion just
        # pushed: argocd-update registers a lasting health check against
        # desiredRevision, so the app must track a revision Kargo controls.
        # updateTargetRevision rewrites the Application's targetRevision to that
        # commit; without it the app tracks the shared main HEAD, which every
        # later commit advances past, leaving this Stage perpetually Unhealthy.
        # The apps ApplicationSet ignores /spec/source/targetRevision for
        # portfolio* so it does not revert this pin (k8s/talos/infra/argocd/apps.yaml).
        - uses: argocd-update
          config:
            apps:
              - name: portfolio-stage
                sources:
                  - repoURL: ${{ vars.gitopsRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
                    updateTargetRevision: true
