# Lets the Alertmanager HTTPRoute send authentik's callback path to authentik-server. Without
# it the route sits at ResolvedRefs=False and the sign-in callback 500s.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: alertmanager-to-authentik
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
  to:
    - group: ""
      kind: Service
      name: authentik-server
