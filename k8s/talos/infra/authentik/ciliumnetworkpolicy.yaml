apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
  ingress:
    # Web UI / OIDC endpoints fronted by Traefik.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
    # Internal: server <-> worker <-> postgres within the namespace.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": identity
            "k8s:app.kubernetes.io/instance": authentik
    - fromEntities:
        - host
        - health
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Internal: server -> postgres, worker -> postgres, server <-> worker.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": identity
            "k8s:app.kubernetes.io/instance": authentik
    # The embedded outpost's websocket goes to the public URL, which resolves to Cloudflare.
    - toFQDNs:
        - matchName: "auth.bigd.no"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The worker manages outposts through the Kubernetes API.
    - toEntities:
        - kube-apiserver
