# Username and password on one page for every app behind authentik. The
# default flow's password stage skips itself once the identification stage has
# already checked the password, so no binding changes are needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-login-flow
  namespace: identity
  annotations:
    # Ahead of the chart-inflated worker Deployment (wave 0), which mounts this.
    argocd.argoproj.io/sync-wave: "-1"
data:
  login-flow.yaml: |
    version: 1
    metadata:
      name: login-flow-single-page
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # The stage itself is owned by authentik's default blueprint, which
      # leaves password_stage alone on reconcile. user_fields must be repeated:
      # the stage is validated whole, and without it the entry fails.
      - model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]

      # authentik's default ends the session when the browser closes, which on
      # a phone means signing in constantly. MFA below is what makes a long
      # session acceptable on a public login page.
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-authentication-login
        attrs:
          session_duration: days=30

      # MFA for everyone: authentik is internet-facing at auth.bigd.no. A user
      # without a device is made to enrol one at next sign-in rather than
      # skipped, which is authentik's default.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
