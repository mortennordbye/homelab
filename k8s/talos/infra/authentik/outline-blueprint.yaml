apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-outline
  namespace: identity
  annotations:
    # Ahead of the chart-inflated worker Deployment (wave 0), which mounts this.
    argocd.argoproj.io/sync-wave: "-1"
data:
  outline.yaml: |
    version: 1
    metadata:
      name: outline-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: group-outline-users
        state: present
        identifiers:
          name: outline-users
        attrs:
          is_superuser: false
          # Reconciliation resets this list, so add members here rather than in authentik.
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-outline
        state: present
        identifiers:
          name: outline
        attrs:
          name: outline
          client_type: confidential
          client_id: !Env OUTLINE_OIDC_CLIENT_ID
          client_secret: !Env OUTLINE_OIDC_CLIENT_SECRET
          # Unset, authentik rejects every grant.
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: https://docs.local.bigd.no/auth/oidc.callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          include_claims_in_id_token: true

      - model: authentik_core.application
        id: app-outline
        state: present
        identifiers:
          slug: outline
        attrs:
          name: Outline
          slug: outline
          provider: !KeyOf provider-outline
          policy_engine_mode: any
          meta_launch_url: https://docs.local.bigd.no

      # Outline creates an account for anyone the IdP lets through, so the
      # binding is the only gate on who gets one.
      - model: authentik_policies.policybinding
        id: binding-outline
        state: present
        identifiers:
          target: !KeyOf app-outline
          group: !KeyOf group-outline-users
          order: 0
