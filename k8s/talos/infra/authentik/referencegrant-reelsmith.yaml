# Gateway API refuses a cross-namespace backendRef unless the target namespace
# grants it. Narrow on purpose: only reelsmith HTTPRoutes, only to
# authentik-server. Without this the route sits at ResolvedRefs=False and the
# sign-in callback 500s, which reads like an authentik fault.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: reelsmith-to-authentik
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: reelsmith
  to:
    - group: ""
      kind: Service
      name: authentik-server
