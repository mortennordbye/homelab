# Gateway API refuses a cross-namespace backendRef unless the target namespace
# grants it. Narrow intentionally: only reelsmith HTTPRoutes, only to
# authentik-server. Without this the route stays at ResolvedRefs=False and the
# sign-in callback 500s, which looks like an authentik fault.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: reelsmith-to-authentik
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: reelsmith
  to:
    - group: ""
      kind: Service
      name: authentik-server
