apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: identity
  annotations:
    # Ahead of the chart's Deployments (wave 0). Containers read envFrom once at
    # start, so a secret that arrives after the pods leaves them
    # without the new keys until a manual restart.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: "7e213ddc-121b-444e-93fc-b42100fbec37"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgres-password
      remoteRef:
        key: "38aaa9d9-54d7-4be1-8734-b42100fc2496"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # argocd-blueprint.yaml consumes this through !Env. Keys must be valid C
    # identifiers, or the pod's envFrom silently drops them.
    - secretKey: ARGOCD_OIDC_CLIENT_ID
      remoteRef:
        key: "abd2f0cf-b00c-400e-971d-b48d01355263"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ARGOCD_OIDC_CLIENT_SECRET
      remoteRef:
        key: "89206c8b-8f19-480d-973f-b48d01361cb3"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # grafana-blueprint.yaml consumes this. Kargo needs no entry here: it is a
    # public PKCE client, so it has no client secret at all.
    - secretKey: GRAFANA_OIDC_CLIENT_ID
      remoteRef:
        key: "f4825e2c-5f3b-46ba-87b0-b48d013b73ac"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef:
        key: "8618a4d2-7461-4346-9577-b48d013bbdd3"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # outline-blueprint.yaml consumes this.
    - secretKey: OUTLINE_OIDC_CLIENT_ID
      remoteRef:
        key: "fce83cf4-59d6-4242-b5c8-b4ff0141e37b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OUTLINE_OIDC_CLIENT_SECRET
      remoteRef:
        key: "f2a431df-7ea0-4642-831f-b4ff0141e959"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
