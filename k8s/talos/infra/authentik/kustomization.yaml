apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - namespace.yaml
  - authentik-secrets.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.5.2  # Current stable 2026 version
    releaseName: authentik
    namespace: identity
    valuesFile: values.yaml