apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-argocd
  namespace: identity
  annotations:
    # Ahead of the chart-inflated worker Deployment (wave 0), which mounts this.
    argocd.argoproj.io/sync-wave: "-1"
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: argocd-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: group-argocd-admins
        state: present
        identifiers:
          name: argocd-admins
        attrs:
          is_superuser: false
          # Membership is declared here intentionally, so a rebuilt cluster grants
          # Argo CD access without manual UI work. Reconciliation resets
          # this list, so add members here rather than in authentik.
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-argocd
        state: present
        identifiers:
          name: argocd
        attrs:
          name: argocd
          client_type: confidential
          # Comes from authentik-secrets via envFrom on the worker pod, so the
          # credentials never enter git. No !Env default: a missing variable
          # must fail the blueprint import, not create a
          # provider with an empty secret.
          client_id: !Env ARGOCD_OIDC_CLIENT_ID
          client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
          # Empty by default in 2026.5. Unset, authentik rejects every grant.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.local.bigd.no/auth/callback
            # For `argocd login --sso` from the CLI.
            - matching_mode: strict
              url: http://localhost:8085/auth/callback
          # Matched on `managed`, the stable identifier in authentik's own system
          # blueprints, not the mutable scope_name. `profile` emits the groups claim
          # that Argo CD RBAC keys on; there is no groups scope. The refresh_token
          # grant requires offline_access to issue tokens.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          include_claims_in_id_token: true

      - model: authentik_core.application
        id: app-argocd
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          # The slug forms the issuer URL that argocd-cm must match exactly:
          # https://auth.local.bigd.no/application/o/argocd/
          slug: argocd
          provider: !KeyOf provider-argocd
          policy_engine_mode: any
          meta_launch_url: https://argocd.local.bigd.no
