# Talos-specific Cilium configuration
# Cluster identification
cluster:
  name: hyper-cluster
  id: 1

# KubePrism endpoint for accessing Kubernetes API via host networking
k8sServiceHost: localhost
k8sServicePort: 7445

# CNI mode
cni:
  exclusive: false

# IPAM - Use Kubernetes Host Scope IPAM (Talos assigns PodCIDRs to nodes)
ipam:
  mode: kubernetes

# Replace kube-proxy
kubeProxyReplacement: true

# eBPF configuration
bpf:
  masquerade: true
  # REQUIRED for Talos 1.8+: Host Legacy Routing must be enabled
  hostLegacyRouting: true

# Talos-specific security context and cgroup settings
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Cgroup configuration for Talos
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# --- METRICS & OBSERVABILITY SECTION ---

# Hubble (observability)
hubble:
  enabled: true
  # Metrics for East-West traffic and Ingress-to-Pod traffic
  metrics:
    enabled:
      - dns:query;answer
      - drop
      - tcp
      - flow
      - icmp
      - httpV2 # Essential for Traefik L7 visibility
    enableOpenMetrics: true
    port: 9965
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  # Dashboard configuration (fixed indentation)
  dashboards:
    enabled: true
  ui:
    enabled: true
    rollOutPods: true
  relay:
    enabled: true
    rollOutPods: true

# Cilium Agent Prometheus Metrics
prometheus:
  enabled: true
  metricsService: true
  port: 9962
  # Comprehensive list of metrics for health monitoring
  metrics:
    - +cilium_agent_bootstrap_seconds_total
    - +cilium_agent_datapath_conntrack_gc_duration_seconds
    - +cilium_agent_datapath_conntrack_gc_entries
    - +cilium_forwarding_errors_total
    - +cilium_unreachable_health_endpoints_total
    - +cilium_unreachable_nodes_total
    - +cilium_event_latency_seconds
    - +cilium_endpoint_state
    - +cilium_policy_verdict_total
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    additionalLabels:
      release: kube-prometheus-stack

# Cilium Operator Metrics
operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    metricsService: true
    port: 9963
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  dashboards:
    enabled: true
  tolerations:
    - operator: Exists
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

# Envoy Proxy Metrics (L7 visibility for Traefik flows)
envoy:
  enabled: true
  prometheus:
    enabled: true
    port: 9964
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

# --- ROUTING & PERFORMANCE ---

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

loadBalancer:
  algorithm: maglev
  mode: dsr

l2announcements:
  enabled: true

externalIPs:
  enabled: true

gatewayAPI:
  enabled: false

# Global dashboard and rollout settings
dashboards:
  enabled: true
rollOutCiliumPods: true
k8sClientRateLimit:
  qps: 20
  burst: 100

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi