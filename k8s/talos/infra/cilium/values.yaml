cluster:
  name: hyper-cluster
  id: 1

# KubePrism endpoint (Talos host networking).
k8sServiceHost: localhost
k8sServicePort: 7445

cni:
  exclusive: false

# Talos assigns PodCIDRs to nodes.
ipam:
  mode: kubernetes

kubeProxyReplacement: true

# TEMPORARY: drops are logged (Hubble verdict AUDIT), not enforced. Flip back
# to false once Hubble shows zero AUDIT events for normal workflows.
policyAuditMode: true

bpf:
  masquerade: true
  # Required for Talos's kube-dns-to-host-DNS forwarding; DNS breaks without it.
  hostLegacyRouting: true

securityContext:
  capabilities:
    ciliumAgent:
      # SYS_MODULE deliberately excluded: Talos forbids workloads loading
      # kernel modules.
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Reuse the cgroupv2 mount Talos already provides.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query;answer
      - drop
      - tcp
      - flow
      - icmp
      - httpV2
      # Policy verdicts (incl. AUDIT) to Prometheus, so would-be-denied traffic
      # is recorded over the 7d retention rather than only the short Hubble ring
      # buffer — needed to safely move off policyAuditMode into enforcement.
      - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
    enableOpenMetrics: true
    port: 9965
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
      # Node names for Grafana.
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
          action: replace
          replacement: ${1}
  dashboards:
    enabled: true
  ui:
    enabled: true
    rollOutPods: true
  relay:
    enabled: true
    rollOutPods: true

operator:
  # HA: 2 replicas (active + standby via leader election) with a PDB so a node
  # drain can't take the only operator down.
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  rollOutPods: true
  # Tolerate everything: nodes can't become Ready until Cilium runs, so the
  # operator must schedule on NotReady nodes during bootstrap.
  tolerations:
    - operator: Exists
  prometheus:
    enabled: true
    metricsService: true
    port: 9963
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  dashboards:
    enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

# Native routing is required for DSR mode.
routingMode: native
autoDirectNodeRoutes: true
# Must match the cluster pod CIDR.
ipv4NativeRoutingCIDR: 10.244.0.0/16

loadBalancer:
  algorithm: maglev
  mode: dsr

# LoadBalancer VIPs are announced on the local network via L2.
l2announcements:
  enabled: true

bgpControlPlane:
  enabled: false

externalIPs:
  enabled: true

# Using Traefik instead.
gatewayAPI:
  enabled: false

prometheus:
  enabled: true
  metricsService: true
  port: 9962
  metrics:
    - +cilium_agent_bootstrap_seconds_total
    - +cilium_agent_datapath_conntrack_gc_duration_seconds
    - +cilium_agent_datapath_conntrack_gc_entries
    - +cilium_forwarding_errors_total
    - +cilium_unreachable_health_endpoints_total
    - +cilium_unreachable_nodes_total
    - +cilium_event_latency_seconds
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    labels:
      release: kube-prometheus-stack

dashboards:
  enabled: true

rollOutCiliumPods: true

k8sClientRateLimit:
  qps: 20
  burst: 100

envoy:
  enabled: true
  prometheus:
    enabled: true
    # Quoted: the chart schema wants a string here.
    port: "9964"
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi