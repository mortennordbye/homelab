# Talos-specific Cilium configuration
cluster:
  name: hyper-cluster
  id: 1

# KubePrism endpoint for Talos
k8sServiceHost: localhost
k8sServicePort: 7445

cni:
  exclusive: false

ipam:
  mode: kubernetes

kubeProxyReplacement: true

bpf:
  masquerade: true
  # REQUIRED for Talos 1.8+
  hostLegacyRouting: true

# Security settings for Talos compatibility
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Cgroup configuration for Talos
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# --- METRICS & OBSERVABILITY ---

# Hubble (Optimized for Traefik visibility)
hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query;answer
      - drop
      - tcp
      - flow
      - icmp
      - httpV2 # Visibility for Traefik -> Pod traffic
    enableOpenMetrics: true
    port: 9965
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  dashboards:
    enabled: true
  ui:
    enabled: true
    rollOutPods: true
  relay:
    enabled: true
    rollOutPods: true

# Cilium Agent Metrics
prometheus:
  enabled: true
  metricsService: true
  port: 9962
  # List of metrics for your dashboards
  metrics:
    - +cilium_agent_bootstrap_seconds_total
    - +cilium_agent_datapath_conntrack_gc_duration_seconds
    - +cilium_agent_datapath_conntrack_gc_entries
    - +cilium_forwarding_errors_total
    - +cilium_unreachable_health_endpoints_total
    - +cilium_unreachable_nodes_total
    - +cilium_event_latency_seconds
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    additionalLabels:
      release: kube-prometheus-stack

# Cilium Operator
operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    metricsService: true
    port: 9963
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  dashboards:
    enabled: true
  tolerations:
    - operator: Exists
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

# Envoy (Specifically fixed for your Kustomize error)
envoy:
  enabled: true
  prometheus:
    enabled: true
    # FIX: Quoted string to satisfy schema "got number, want string"
    port: "9964" 
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

# --- ROUTING & PERFORMANCE ---

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

loadBalancer:
  algorithm: maglev
  mode: dsr

l2announcements:
  enabled: true

externalIPs:
  enabled: true

# Keep Gateway API disabled since you use Traefik
gatewayAPI:
  enabled: false

# Global settings
dashboards:
  enabled: true
rollOutCiliumPods: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi