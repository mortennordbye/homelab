alloy:
  # Usage stats go to stats.grafana.org, which the egress policy blocks.
  enableReporting: false
  clustering:
    enabled: true
  configMap:
    create: true
    content: |
      // 1. Discover the pods on this node only; every node runs its own Alloy.
      discovery.kubernetes "local_pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // 2. Map k8s discovery metadata to stream labels.
      //    Keep this list short — every label here becomes part of Loki's index.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.local_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          target_label  = "k8s_app"
        }
      }

      // 3. Tail logs from the relabeled targets
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.labels.receiver]
      }

      // 4. Add static labels
      loki.process "labels" {
        stage.static_labels {
          values = {
            cluster = "genesis",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      // 4b. Watch Kubernetes events cluster-wide for troubleshooting.
      //     Emits labels: namespace, job ("kubernetes-events"), instance.
      //     Clustered with no namespaces listed, so exactly one Alloy pod collects them.
      loki.source.kubernetes_events "k8s_events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.process.events.receiver]
        clustering {
          enabled = true
        }
      }

      // 4c. Tag events with the cluster label, then ship through the same writer.
      loki.process "events" {
        stage.static_labels {
          values = {
            cluster = "genesis",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      // 5. Send to Loki
      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // 6. Traces: Traefik pushes OTLP over gRPC, logeverylift over HTTP; Tempo gets
      // what survives the filters.
      otelcol.receiver.otlp "traefik" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.tail_sampling.traces.input]
        }
      }

      // Decides per whole trace, so a dropped request never leaves orphaned child spans.
      // Every Traefik span of a trace reaches the same Alloy pod because each Traefik pod
      // holds one long-lived gRPC connection. An app's spans may land on another pod, so
      // a drop policy here never removes them.
      otelcol.processor.tail_sampling "traces" {
        decision_wait = "10s"

        policy {
          name = "keep"
          type = "always_sample"
        }
        // The monitoring UIs: viewing a dashboard would otherwise trace itself.
        policy {
          name = "drop-monitoring-uis"
          type = "drop"
          drop {
            drop_sub_policy {
              name = "monitoring-hosts"
              type = "string_attribute"
              string_attribute {
                key    = "server.address"
                values = ["grafana.local.bigd.no", "prometheus.local.bigd.no", "alertmanager.local.bigd.no", "pyrra.local.bigd.no"]
              }
            }
          }
        }
        policy {
          name = "drop-probes"
          type = "drop"
          drop {
            drop_sub_policy {
              name = "blackbox"
              type = "string_attribute"
              string_attribute {
                key                    = "user_agent.original"
                values                 = ["Blackbox-Exporter/.*"]
                enabled_regex_matching = true
              }
            }
          }
        }

        // The kubelet's readiness and liveness probes hit logeverylift's /api/health
        // directly, several times a minute; each would be a trace of its own.
        policy {
          name = "drop-health-checks"
          type = "drop"
          drop {
            drop_sub_policy {
              name = "app-health"
              type = "string_attribute"
              string_attribute {
                key    = "http.route"
                values = ["/api/health"]
              }
            }
          }
        }

        output {
          traces = [otelcol.processor.transform.traces.input]
        }
      }

      // Per-process, per-connection and client-IP attributes: noise in every breakdown,
      // and the IPs are personal data. Query strings go too: they can carry what a
      // user typed (logeverylift's gym search sends it to Nominatim in the URL).
      otelcol.processor.transform "traces" {
        error_mode = "ignore"

        trace_statements {
          context    = "resource"
          statements = [
            `delete_matching_keys(attributes, "^(process|os|host)\\..*")`,
            `delete_key(attributes, "k8s.pod.uid")`,
            // @vercel/otel labels every resource as running on Vercel.
            `delete_matching_keys(attributes, "^vercel\\..*")`,
            `delete_key(attributes, "cloud.provider")`,
          ]
        }
        trace_statements {
          context    = "span"
          statements = [
            `delete_key(attributes, "client.address")`,
            `delete_key(attributes, "client.port")`,
            `delete_key(attributes, "network.peer.address")`,
            `delete_key(attributes, "network.peer.port")`,
            `delete_key(attributes, "url.query")`,
            `replace_pattern(attributes["url.full"], "\\?.*", "")`,
            `replace_pattern(attributes["http.url"], "\\?.*", "")`,
            `replace_pattern(attributes["http.target"], "\\?.*", "")`,
          ]
        }

        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  mounts:
    # Essential for Kubernetes log collection
    varlog: true
    # Talos uses containerd; this ensures Alloy can reach the symlinks
    dockercontainers: true

controller:
  # Ensure an agent runs on every node
  type: 'daemonset'

serviceAccount:
  # RBAC is needed to let Alloy talk to the K8s API for pod discovery
  create: true

# Enable the ServiceMonitor so you can see Alloy's own metrics in your Grafana
serviceMonitor:
  enabled: true