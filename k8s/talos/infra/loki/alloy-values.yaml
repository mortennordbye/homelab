alloy:
  configMap:
    create: true
    content: |
      // 1. Discover pods
      discovery.kubernetes "all_pods" {
        role = "pod"
      }

      // 2. Map k8s discovery metadata to stream labels.
      //    Keep this list short — every label here becomes part of Loki's index.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.all_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          target_label  = "k8s_app"
        }
      }

      // 3. Tail logs from the relabeled targets
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.labels.receiver]
      }

      // 4. Add static labels
      loki.process "labels" {
        stage.static_labels {
          values = {
            cluster = "genesis",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      // 4b. Watch Kubernetes events cluster-wide for troubleshooting.
      //     Emits labels: namespace, job ("kubernetes-events"), instance.
      loki.source.kubernetes_events "k8s_events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.process.events.receiver]
      }

      // 4c. Tag events with the cluster label, then ship through the same writer.
      loki.process "events" {
        stage.static_labels {
          values = {
            cluster = "genesis",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      // 5. Send to Loki
      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  mounts:
    # Essential for Kubernetes log collection
    varlog: true
    # Talos uses containerd; this ensures Alloy can reach the symlinks
    dockercontainers: true

controller:
  # Ensure an agent runs on every node
  type: 'daemonset'

serviceAccount:
  # RBAC is needed to let Alloy talk to the K8s API for pod discovery
  create: true

# Enable the ServiceMonitor so you can see Alloy's own metrics in your Grafana
serviceMonitor:
  enabled: true