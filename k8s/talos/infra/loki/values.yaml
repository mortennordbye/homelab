deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  limits_config:
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    allow_structured_metadata: true
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    retention_period: 24h
    unordered_writes: true
  
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

compactor:
  working_directory: /var/loki/compactor
  shared_store: filesystem
  retention_enabled: true

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "proxmox-local"
    whenDeleted: Retain

gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack 
    interval: 30s
    scrapeTimeout: 10s