deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  limits_config:
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    allow_structured_metadata: true
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    # Only applied when the compactor block below is enabled under `loki:`.
    retention_period: 168h
    # Keep Kubernetes events longer than pod logs for incident troubleshooting.
    retention_stream:
      - selector: '{job="kubernetes-events"}'
        priority: 1
        period: 720h
    unordered_writes: true
  
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Retention is the compactor's job, and nothing else does it. This block must
  # live under `loki:` — at the top level the chart drops it silently and no
  # log line is ever deleted. No `shared_store`: Loki 3 removed the field and
  # the pod refuses to start with it.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    # Required for the delete API, which `deletion_mode: filter-and-delete` in
    # limits_config already assumes exists. Without it a delete request is
    # accepted and never acted on.
    delete_request_store: filesystem

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "proxmox-local"
    whenDeleted: Retain

gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack 
    interval: 30s
    scrapeTimeout: 10s