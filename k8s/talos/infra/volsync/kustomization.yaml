apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: volsync-system

resources:
  - namespace.yaml
  - servicemonitor.yaml

helmCharts:
  - name: volsync
    repo: https://backube.github.io/helm-charts
    version: 0.16.0
    releaseName: volsync
    namespace: volsync-system
    includeCRDs: true
    valuesFile: values.yaml
