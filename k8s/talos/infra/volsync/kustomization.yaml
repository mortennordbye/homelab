apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: volsync-system

resources:
  - namespace.yaml

helmCharts:
  - name: volsync
    repo: https://backube.github.io/helm-charts
    version: 0.16.0
    releaseName: volsync
    namespace: volsync-system
    includeCRDs: true
    valuesFile: values.yaml

# The chart renders its ServiceMonitor only when the monitoring API is present (as it is
# under ArgoCD), without the label Prometheus selects on. It feeds VolSyncBackupStale.
patches:
  # The chart's templates carry no metadata.namespace, and the namespace field above
  # does not add one to them; ArgoCD then refuses the objects.
  - target:
      kind: ^(ServiceAccount|Service|Deployment|Role|RoleBinding|ServiceMonitor)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: volsync-system
  - target:
      kind: ServiceMonitor
      name: volsync
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: kube-prometheus-stack
