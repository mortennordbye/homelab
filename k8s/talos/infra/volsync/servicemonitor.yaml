# Feeds VolSyncBackupStale in homelab-alerts.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volsync
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: volsync
      app.kubernetes.io/instance: volsync
  endpoints:
    - port: https
      scheme: https
      interval: 60s
      tlsConfig:
        insecureSkipVerify: true
