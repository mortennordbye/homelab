apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trivy-system

resources:
  - namespace.yaml
  - ciliumnetworkpolicy.yaml

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts
    includeCRDs: true
    version: 0.38.1
    releaseName: trivy-operator
    namespace: trivy-system
    valuesFile: values.yaml
