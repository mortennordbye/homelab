# Operator: watches workloads and creates scan Jobs through the API server.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  ingress:
    - fromEntities:
        - host
        - health
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
# trivy-server holds the vulnerability DB, pulled from mirror.gcr.io, and answers the scan jobs.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: trivy-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  ingress:
    - fromEntities:
        - host
        - health
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": trivy-system
            "k8s:app.kubernetes.io/managed-by": trivy-operator
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Scan jobs pull image layers straight from each workload's registry (and its CDN
# redirects), so they need any HTTPS host rather than an FQDN list.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: trivy-scan-jobs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: trivy-operator
  ingress:
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
