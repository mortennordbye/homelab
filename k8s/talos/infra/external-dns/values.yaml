provider:
  name: cloudflare

# Cloudflare API token (Zone:Read + DNS:Edit on the managed zones).
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-token-secret
        key: cloudflare-token

# Derive desired records from Gateway API HTTPRoutes.
sources:
  - gateway-httproute

# Manage only the public zone. The nordbye.it / logeverylift.com records are kept by hand.
domainFilters:
  - bigd.no

# Never publish internal split-horizon hostnames, even if a route passes the gateway filter.
excludeDomains:
  - local.bigd.no

# Create and update records, never delete. Switch to "sync" when we trust the setup.
policy: upsert-only

# Ownership tracking. txtPrefix templates the record type so the TXT never
# collides with a CNAME. The trailing dot is required. Without it the zone apex
# maps to a sibling of the zone (cname-bigd.no). The Cloudflare provider drops
# that record without an error, so the apex can never be owned. With the dot it
# maps inside the zone (extdns-cname.bigd.no).
registry: txt
txtOwnerId: genesis
txtPrefix: "extdns-%{record_type}."

# The v0.21 default is external-dns.kubernetes.io/. Pinned, so the gateway target annotation always matches.
annotationPrefix: external-dns.kubernetes.io/

extraArgs:
  # Only manage routes attached to the public Traefik gateway (label set in traefik/gateway-public.yaml).
  - --gateway-label-filter=external-dns=public

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack

logLevel: info

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi
