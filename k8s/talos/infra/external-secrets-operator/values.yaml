bitwarden-sdk-server:
  enabled: true

installCRDs: true

replicaCount: 1

# HA for the admission webhook: API calls to ExternalSecret/SecretStore block on
# it, so keep 2 replicas with a PDB across node drains.
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Soft spread the 2 webhook replicas across hypervisors (zones).
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: external-secrets-webhook
            topologyKey: topology.kubernetes.io/zone

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
