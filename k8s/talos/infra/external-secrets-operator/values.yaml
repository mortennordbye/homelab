bitwarden-sdk-server:
  enabled: true
  # The server reads its TLS cert into memory at startup and never reloads it.
  # After a cert-manager renewal of bitwarden-tls-certs the pod serves the old
  # cert while ESO trusts the new CA, and every ExternalSecret fails with x509.
  # Stakater Reloader restarts the Deployment when the cert secret changes.
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: bitwarden-tls-certs
  # The image runs as uid 65532.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # The request is the idle size. The limit leaves room for a burst that the server
  # keeps resident afterwards.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 1Gi

installCRDs: true

replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# HA for the admission webhook: API calls to ExternalSecret/SecretStore block on
# it. Keep 2 replicas and a PDB, so a node drain never removes both.
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 192Mi
  # Spread the 2 webhook replicas across hypervisors (zones). Preferred, not required.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: external-secrets-webhook
            topologyKey: topology.kubernetes.io/zone

certController:
  resources:
    requests:
      cpu: 10m
      memory: 160Mi
    limits:
      memory: 384Mi

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
