apiVersion: v1
kind: Service
metadata:
  name: traefik-public
  namespace: traefik
  annotations:
    lbipam.cilium.io/ips: "10.3.10.101"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
    # QUIC / HTTP/3 for the websecure entrypoint (same VIP + port, UDP).
    - name: websecure-h3
      port: 443
      targetPort: 8443
      protocol: UDP
    - name: plex
      port: 32400
      targetPort: 32400
      protocol: TCP
