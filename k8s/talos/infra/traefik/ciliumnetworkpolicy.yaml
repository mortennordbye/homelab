apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: traefik
  namespace: traefik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
    # Public ingress from anywhere on HTTP/HTTPS (LB-exposed).
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "8444"
              protocol: TCP
    # Dashboard / metrics endpoint scraped by Prometheus.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
    - fromEntities:
        - host
        - health
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Backends + Kubernetes API. cluster entity already covers all pods, host,
    # remote-node, and kube-apiserver, so this single line is enough. Audit mode
    # will reveal the actual destination set if a tighter rule is wanted later.
    - toEntities:
        - cluster
