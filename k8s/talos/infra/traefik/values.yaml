global:
  checkNewVersion: false
  sendAnonymousUsage: false

deployment:
  replicas: 3

# Required zone anti-affinity below pins one replica per hypervisor (replicas ==
# zones). The default surging rollout (maxSurge:1) then deadlocks — a 4th pod has
# no free zone and stays Pending. Terminate-then-recreate frees a zone first, so
# rollouts run at 2/3 briefly instead of getting stuck.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Spread the replicas one-per-hypervisor so losing a physical host (or a VIP
# L2-announce re-election) can't take the edge proxy down. topology.kubernetes.io/zone
# maps to the hypervisor (hyper1/2/3), matching how the apps express failure domains.
# 3 replicas / 3 zones => exactly one replica per hypervisor.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        topologyKey: topology.kubernetes.io/zone

# Keep at least 2 of the 3 replicas up through node drains / voluntary disruptions.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

api:
  dashboard: true

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: true

ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    # blog.nordbye.it is proxied through Cloudflare, so requests arrive from an
    # edge address. Without trustedIPs the entrypoint strips X-Forwarded-For and
    # the per-client limits downstream key on the edge IP, not the visitor.
    # Ranges from cloudflare.com/ips-v4 and /ips-v6, fetched 2026-08-21.
    forwardedHeaders:
      trustedIPs: &cloudflareIPs
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    # Same ranges as web; this is where proxied traffic lands.
    forwardedHeaders:
      trustedIPs: *cloudflareIPs
    # HTTP/3 (QUIC) on the public HTTPS entrypoint. Traefik also listens UDP on
    # this port and advertises Alt-Svc: h3=":443" so browsers upgrade. Serving
    # over UDP/443 additionally needs the port on the public Service and the
    # CiliumNetworkPolicy (both below), plus a UDP/443 forward on the router.
    # TCP stays the fallback, so clients that can't reach H3 use HTTP/2.
    http3:
      enabled: true
      # Advertise h3 on the exposed port (443), not Traefik's internal 8443.
      # The Service maps 443 -> 8443, so browsers must be told to reach h3 on
      # 443; without this Traefik advertises alt-svc h3=":8443", which isn't
      # exposed externally and h3 silently fails.
      advertisedPort: 443
    expose:
      default: true
  web-private:
    port: 8001
    exposedPort: 80
    protocol: TCP
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure-private
          scheme: https
          permanent: true
  websecure-private:
    port: 8444
    exposedPort: 443
    protocol: TCP
    expose:
      default: true
  plex:
    port: 32400
    exposedPort: 32400
    protocol: TCP
    expose:
      default: true
  metrics:
    port: 9100
    expose:
      default: true
    exposedPort: 9100
    protocol: TCP

service:
  enabled: false

log:
  level: INFO
# JSON so each line carries ClientAddr, the TCP peer, next to ClientHost, the
# address resolved from X-Forwarded-For. The default common format logs only
# the resolved one, which makes a Cloudflare-fronted request indistinguishable
# from one that reached the origin directly. Temporary: this is here to size an
# IPAllowList on the proxied hostnames, and reverts once the ranges are known.
accessLog:
  enabled: true
  format: json

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

experimental:
  kubernetesGateway:
    enabled: true

# Emit OTLP traces for every ingress request to Tempo (blog.nordbye.it included).
tracing:
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: tempo.monitoring:4317
      insecure: true