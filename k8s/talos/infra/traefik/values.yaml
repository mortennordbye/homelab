global:
  checkNewVersion: false
  sendAnonymousUsage: false

deployment:
  replicas: 3

# Required zone anti-affinity below pins one replica per hypervisor (replicas ==
# zones). The default surging rollout (maxSurge:1) then deadlocks — a 4th pod has
# no free zone and stays Pending. Terminate-then-recreate frees a zone first, so
# rollouts run at 2/3 briefly instead of getting stuck.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Spread the replicas one-per-hypervisor so losing a physical host (or a VIP
# L2-announce re-election) can't take the edge proxy down. topology.kubernetes.io/zone
# maps to the hypervisor (hyper1/2/3), matching how the apps express failure domains.
# 3 replicas / 3 zones => exactly one replica per hypervisor.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        topologyKey: topology.kubernetes.io/zone

# Keep at least 2 of the 3 replicas up through node drains / voluntary disruptions.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

api:
  dashboard: true

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: true

ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    # HTTP/3 (QUIC) on the public HTTPS entrypoint. Traefik also listens UDP on
    # this port and advertises Alt-Svc: h3=":443" so browsers upgrade. Serving
    # over UDP/443 additionally needs the port on the public Service and the
    # CiliumNetworkPolicy (both below), plus a UDP/443 forward on the router.
    # TCP stays the fallback, so clients that can't reach H3 use HTTP/2.
    http3:
      enabled: true
    expose:
      default: true
  web-private:
    port: 8001
    exposedPort: 80
    protocol: TCP
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure-private
          scheme: https
          permanent: true
  websecure-private:
    port: 8444
    exposedPort: 443
    protocol: TCP
    expose:
      default: true
  plex:
    port: 32400
    exposedPort: 32400
    protocol: TCP
    expose:
      default: true
  metrics:
    port: 9100
    expose:
      default: true
    exposedPort: 9100
    protocol: TCP

service:
  enabled: false

log:
  level: INFO
accessLog:
  enabled: true

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

experimental:
  kubernetesGateway:
    enabled: true

# Emit OTLP traces for every ingress request to Tempo (blog.nordbye.it included).
tracing:
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: tempo.monitoring:4317
      insecure: true