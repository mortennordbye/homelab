apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway-public
  namespace: traefik
  labels:
    # Selected by external-dns --gateway-label-filter so only public routes get DNS records.
    external-dns: public
  annotations:
    traefik.io/service.serversscheme: h2c
    # external-dns publishes every public route on this gateway as a CNAME to this DDNS A record.
    external-dns.kubernetes.io/target: ddns.bigd.no
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        # Traefik 3.7+ selects the matching cert per SNI from this list.
        certificateRefs:
          - group: ""
            kind: Secret
            name: bigd-no-tls
            namespace: cert-manager
          - group: ""
            kind: Secret
            name: nordbye-it-tls
            namespace: cert-manager
          - group: ""
            kind: Secret
            name: logeverylift-com-tls
            namespace: cert-manager
