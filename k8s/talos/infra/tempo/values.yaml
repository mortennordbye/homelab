tempo:
  reportingEnabled: false
  retention: 24h
  # OTLP-only: Traefik pushes OTLP gRPC. Drop the jaeger/zipkin/opencensus receivers.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  # local-blocks answers TraceQL metrics (rate(), histograms), which Grafana's Traces
  # Drilldown needs; without a generator those queries fail with "empty ring".
  metricsGenerator:
    enabled: true
    # Nothing is written while local-blocks is the only processor. span-metrics or
    # service-graphs would also need Prometheus' remote-write receiver and an egress rule.
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
    processor:
      local_blocks:
        flush_to_storage: true
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # 512Mi OOM-killed tempo on startup during WAL replay + local block reload,
      # crash-looping before readiness. 1Gi clears the replay spike.
      memory: 1Gi

# Local block storage for traces (same class Loki uses); 24h retention.
persistence:
  enabled: true
  storageClassName: proxmox-local
  size: 10Gi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
