mode: daemonset

# contrib image: the prometheusremotewrite exporter is not in the core image.
image:
  repository: otel/opentelemetry-collector-contrib

presets:
  hostMetrics:
    enabled: true

  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false

config:
  receivers:
    prometheus:
      config:
        scrape_configs:
          - job_name: "otel-collector"
            scrape_interval: 30s
            static_configs:
              - targets: ["${env:MY_POD_IP}:8888"]

  processors:
    batch:
      send_batch_size: 1000
      timeout: 10s

    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    resource:
      attributes:
        - key: cluster.name
          value: genesis
          action: upsert

  exporters:
    prometheus:
      endpoint: "${env:MY_POD_IP}:9090"
      namespace: otel
      const_labels:
        cluster: genesis

  service:
    pipelines:
      # hostmetrics receiver is added by the preset.
      metrics:
        receivers: [hostmetrics, otlp, prometheus]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [debug]

useGOMEMLIMIT: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ports:
  metrics:
    enabled: true
  prometheus:
    enabled: true
    containerPort: 9090
    servicePort: 9090
    protocol: TCP
  # hostPort 0 on every receiver port: PodSecurity compliance.
  otlp:
    enabled: true
    hostPort: 0
  otlp-http:
    enabled: true
    hostPort: 0
  jaeger-compact:
    enabled: true
    hostPort: 0
  jaeger-thrift:
    enabled: true
    hostPort: 0
  jaeger-grpc:
    enabled: true
    hostPort: 0
  zipkin:
    enabled: true
    hostPort: 0

serviceAccount:
  create: true

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prometheus
      interval: 30s

# Root is required for the host metrics scrapers.
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

hostNetwork: false

# Run on every node, control plane included.
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists
