# Password of the view-only local UniFi user "unpoller"; not the Terraform API key,
# which can change the whole network.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: unpoller
    creationPolicy: Owner
  data:
    - secretKey: UP_UNIFI_DEFAULT_PASS
      remoteRef:
        key: "d2f1b1e9-23d4-44d3-af38-b4d1013f3061"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
