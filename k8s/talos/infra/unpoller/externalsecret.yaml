# The UniFi Terraform API key, copied into Bitwarden. It is admin-scoped; a key
# from a dedicated view-only admin would be narrower.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: unpoller
    creationPolicy: Owner
  data:
    - secretKey: UP_UNIFI_DEFAULT_API_KEY
      remoteRef:
        key: "4fb7cdf6-ac42-4d96-a67a-b4d10140c069"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
