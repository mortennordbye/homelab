# Polls the UniFi gateway: WAN latency and drops, switch port traffic and errors,
# client counts. The gateway's system log goes to Loki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels:
    app.kubernetes.io/name: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.2.8
          args:
            - --config
            - /etc/unpoller-config/up.conf
          envFrom:
            - secretRef:
                name: unpoller
          ports:
            - name: metrics
              containerPort: 9130
          volumeMounts:
            - name: config
              mountPath: /etc/unpoller-config
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: unpoller
