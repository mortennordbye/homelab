# Talos issues a talosconfig for this into a Secret of the same name. The CRD exists only
# once kubernetesTalosAPIAccess is on (talos-cluster.tf), and the role and namespace
# must stay in that allow-list.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  roles:
    - os:etcd:backup
