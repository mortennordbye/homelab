global:
  domain: argocd.local.bigd.no

crds:
  install: true

configs:
  params:
    server.insecure: true
  cm:
    kustomize.buildOptions: "--enable-helm"
    exec.enabled: "true"
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    # The provider is defined declaratively in
    # k8s/talos/infra/authentik/argocd-blueprint.yaml.
    # `url` is intentionally not set here: the chart derives it from
    # global.domain, and that is what Argo CD builds the redirect URI from
    # (so server.insecure still yields an https:// callback).
    oidc.config: |
      name: Authentik
      # Trailing slash required. The path segment is the authentik *application
      # slug*, not the provider name. Mismatch here gives "oidc: issuer did not match".
      issuer: https://auth.local.bigd.no/application/o/argocd/
      clientID: 5dbfc17206b0310cad6e088795218914
      clientSecret: $argocd-oidc:clientSecret
      # No `groups` scope exists in authentik; the groups claim rides on `profile`.
      # Requesting it explicitly would return invalid_scope.
      requestedScopes:
        - openid
        - profile
        - email
        - offline_access
      requestedIDTokenClaims:
        groups:
          essential: true
  rbac:
    # Authenticated but unmapped SSO users get nothing. The built-in local admin
    # bypasses RBAC entirely and stays enabled as break-glass.
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, argocd-admins, role:admin

server:
  replicas: 2
  # Chart applies soft pod anti-affinity by default (global.affinity), so the
  # replicas spread across nodes on their own.
  pdb:
    enabled: true
    maxUnavailable: 1
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "10.3.10.100"
  ingress:
    enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

dex:
  enabled: false

notifications:
  enabled: true

applicationSet:
  enabled: true
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1

redis-ha:
  enabled: false

controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

repoServer:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack