apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  # goTemplate is required for templatePatch below. String fields switch to the
  # {{.path.*}} syntax; every generated Application renders exactly as before.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mortennordbye/homelab.git
        revision: HEAD
        directories:
          - path: k8s/talos/apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: https://github.com/mortennordbye/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: in-cluster
        namespace: '{{.path.basename}}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  # Authorize Kargo to sync the apps it promotes. templatePatch is a Go-templated
  # merge patch (a string), so structural conditionals are valid here in a way
  # they are not inside the parsed `template` above. Onboarding a new Kargo app is
  # a one-word addition to the list below: its prod app "<app>" and stage app
  # "<app>-stage" get authorized-stage <app>-cd:prod / <app>-cd:stage. Every
  # non-Kargo app matches nothing and renders no patch.
  templatePatch: |
    {{- $base := .path.basename }}
    {{- range $app := list "portfolio" }}
    {{- if eq $base $app }}
    metadata:
      annotations:
        kargo.akuity.io/authorized-stage: {{ $app }}-cd:prod
    {{- else if eq $base (printf "%s-stage" $app) }}
    metadata:
      annotations:
        kargo.akuity.io/authorized-stage: {{ $app }}-cd:stage
    {{- end }}
    {{- end }}
