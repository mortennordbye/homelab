apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  # goTemplate is required for templatePatch below. String fields switch to the
  # {{.path.*}} syntax; every generated Application renders exactly as before.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mortennordbye/homelab.git
        revision: HEAD
        directories:
          - path: k8s/talos/apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: https://github.com/mortennordbye/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: in-cluster
        namespace: '{{.path.basename}}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  # Authorize Kargo to sync the apps it promotes. templatePatch is a Go-templated
  # merge patch (a string), so structural conditionals are valid here in a way
  # they are not inside the parsed `template` above. Onboarding a new Kargo app is
  # a one-word addition to the list below: its prod app "<app>", stage app
  # "<app>-stage" and demo app "<app>-demo" get authorized-stage <app>-cd:prod /
  # <app>-cd:stage / <app>-cd:demo. A suffix an app doesn't use matches no
  # directory, so it renders nothing; every non-Kargo app matches nothing at all.
  # Apps holding a CloudNativePG Cluster need server-side diff: the client-side
  # diff reports the webhook-defaulted Cluster as OutOfSync and self-heal loops.
  templatePatch: |
    {{- $base := .path.basename }}
    {{- $stage := "" }}
    {{- range $app := list "portfolio" "blog" "logeverylift" "headroom" "verksted" "reelsmith" "innestemme" }}
    {{- if eq $base $app }}{{ $stage = printf "%s-cd:prod" $app }}
    {{- else if eq $base (printf "%s-stage" $app) }}{{ $stage = printf "%s-cd:stage" $app }}
    {{- else if eq $base (printf "%s-demo" $app) }}{{ $stage = printf "%s-cd:demo" $app }}
    {{- end }}
    {{- end }}
    {{- $serverSideDiff := has $base (list "logeverylift") }}
    {{- if or $stage $serverSideDiff }}
    metadata:
      annotations:
        {{- if $stage }}
        kargo.akuity.io/authorized-stage: {{ $stage }}
        {{- end }}
        {{- if $serverSideDiff }}
        argocd.argoproj.io/compare-options: ServerSideDiff=true
        {{- end }}
    {{- end }}
