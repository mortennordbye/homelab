apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  # goTemplate is required for templatePatch below. String fields switch to the
  # {{.path.*}} syntax; every generated Application renders exactly as before.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Kargo pins portfolio and portfolio-stage to a specific commit on promotion
  # (argocd-update updateTargetRevision, see k8s/talos/infra/kargo-portfolio/).
  # Without this the ApplicationSet controller would revert targetRevision back
  # to HEAD and fight Kargo. Scoped to portfolio*; every other app keeps HEAD.
  ignoreApplicationDifferences:
    - name: 'portfolio*'
      jsonPointers:
        - /spec/source/targetRevision
  generators:
    - git:
        repoURL: https://github.com/mortennordbye/homelab.git
        revision: HEAD
        directories:
          - path: k8s/talos/apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: https://github.com/mortennordbye/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: in-cluster
        namespace: '{{.path.basename}}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  # Authorize Kargo to sync only the portfolio apps. templatePatch is a
  # Go-templated merge patch (a string), so structural if/end conditionals are
  # valid here in a way they are not inside the parsed `template` above. For
  # every other app this renders empty (no patch).
  templatePatch: |
    {{- if eq .path.basename "portfolio-stage" }}
    metadata:
      annotations:
        kargo.akuity.io/authorized-stage: portfolio-cd:stage
    {{- end }}
    {{- if eq .path.basename "portfolio" }}
    metadata:
      annotations:
        kargo.akuity.io/authorized-stage: portfolio-cd:prod
    {{- end }}
