apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logeverylift-synthetic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: logeverylift-synthetic
    creationPolicy: Owner
  data:
    - secretKey: SYNTHETIC_PASSWORD
      remoteRef:
        key: "2864c9b9-0179-489b-bd3b-b4ea00847ed7"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
