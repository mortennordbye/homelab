# Reloader: watches ConfigMaps/Secrets and patches workloads to roll them.
# Egress to DNS + API server; ingress only for the metrics scrape.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reloader
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  ingress:
    - fromEntities:
        - host
        - health
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    - toEntities:
        - kube-apiserver
