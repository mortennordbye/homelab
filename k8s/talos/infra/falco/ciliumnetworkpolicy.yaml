# Falco: runtime syscall monitor (DaemonSet). No inbound traffic needed beyond
# node-local health checks; egress to DNS and the API server for enriching alerts
# with pod/container metadata, and to falcosidekick for alert forwarding.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: falco
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  ingress:
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    # Kubernetes API for pod/container metadata enrichment in alerts.
    - toEntities:
        - kube-apiserver
    # Forward detections to falcosidekick (which fans out to Discord).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            "k8s:app.kubernetes.io/name": falcosidekick
      toPorts:
        - ports: [{ port: "2801", protocol: TCP }]
    # falcoctl pulls the Falco ruleset from an OCI registry (ghcr.io) at startup
    # and follows updates. Without this the artifact-install init container hangs
    # and Falco never starts. Scoped to HTTPS to the outside world.
    - toEntities:
        - world
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
# falcosidekick: receives events from Falco and forwards them to Discord.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: falcosidekick
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  ingress:
    # Events pushed from the Falco DaemonSet.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            "k8s:app.kubernetes.io/name": falco
      toPorts:
        - ports: [{ port: "2801", protocol: TCP }]
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    # Deliver alerts to the Discord webhook over HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
