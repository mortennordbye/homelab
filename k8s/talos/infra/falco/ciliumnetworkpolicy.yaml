apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: falco
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  ingress:
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            "k8s:app.kubernetes.io/name": falcosidekick
      toPorts:
        - ports: [{ port: "2801", protocol: TCP }]
    # falcoctl pulls the ruleset from ghcr.io at startup; without it Falco won't start.
    - toEntities:
        - world
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: falcosidekick
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            "k8s:app.kubernetes.io/name": falco
      toPorts:
        - ports: [{ port: "2801", protocol: TCP }]
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    - toEntities:
        - world
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
