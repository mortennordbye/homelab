apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-falcosidekick-discord
  namespace: falco
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: falco-falcosidekick-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOKURL
      remoteRef:
        key: "b10f44ee-88c8-41d2-b518-b45b0117be13"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
