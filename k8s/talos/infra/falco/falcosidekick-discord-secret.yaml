apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-falcosidekick-discord
  namespace: falco
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: falco-falcosidekick-discord
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # falcosidekick loads this secret via envFrom; a non-empty DISCORD_WEBHOOKURL
        # is what switches the Discord output on. Reuse the Alertmanager webhook from
        # Bitwarden but strip the trailing /slack — Alertmanager needs the /slack
        # endpoint (Slack-format payloads), whereas falcosidekick posts Discord-native
        # payloads and must hit the plain webhook URL.
        DISCORD_WEBHOOKURL: '{{ .url | trimSuffix "/slack" }}'
  data:
    - secretKey: url
      remoteRef:
        key: "d810abf7-40ad-4b1c-9d30-b44c0108ecad"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
