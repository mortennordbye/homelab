# modern eBPF: the only driver that works on Talos (no kernel headers).
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false

# Reloader restarts the DaemonSet when the rules/config ConfigMap changes.
controller:
  annotations:
    reloader.stakater.com/auto: "true"

falcosidekick:
  enabled: true
  webui:
    enabled: false
  config:
    existingSecret: falco-falcosidekick-discord
    extraEnv:
      - name: DISCORD_MINIMUMPRIORITY
        value: notice
  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 192Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

falcoctl:
  artifact:
    follow:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

# Expose Falco's Prometheus metrics. kube-prometheus-stack scrapes the
# ServiceMonitor (the release label matches the operator's selector convention).
metrics:
  enabled: true
  interval: 15m
serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

# Tune known-benign behaviour through the upstream rules' own template macros.
# Overrides of these hooks survive upgrades, because the rules consume them.
customRules:
  tuning.yaml: |-
    # ---- Cluster infrastructure --------------------------------------------

    # Cilium CNI plugin execs from /opt/cni/bin on every node. It is not a workload.
    # BuildKit RUN steps (verksted's dind builds) have no k8s metadata. The
    # buildkit/ container id is the only handle. FlareSolverr patches and runs
    # its own chromedriver at startup.
    - macro: known_drop_and_execute_activities
      condition: >
        (proc.name=cilium-cni and proc.exepath startswith /opt/cni/bin/)
        or (container.id startswith buildkit/)
        or (container.image.repository=ghcr.io/flaresolverr/flaresolverr and proc.exepath=/app/chromedriver)
      override:
        condition: replace

    # Test suites that harden against symlink escape create links to /etc or
    # /root inside /tmp/vk-repos-<random> clones. They run inside dind, where Falco
    # has no container metadata (<NA>), so the linkpath is the only handle.
    # Exempts the location of the link, not its target, so a link to a
    # sensitive file anywhere else still alerts.
    - rule: Create Symlink Over Sensitive Files
      condition: >
        and not evt.arg.linkpath startswith /tmp/vk-repos-
      override:
        condition: append

    # kubelet (exec/port-forward streams) and Authentik connect stdio to sockets
    # legitimately. Scoped to those binaries, so a real shell still alerts.
    - macro: user_known_stand_streams_redirect_activities
      condition: (proc.name=kubelet) or (container.image.repository=ghcr.io/goauthentik/server and proc.name=authentik)
      override:
        condition: replace

    # ---- verksted: trusted at the image level, not per path ----------------
    #
    # verksted is an agent sandbox: sessions install tooling and run arbitrary
    # code as root, so per-path tuning never lasts. Exempted via the adopter
    # hooks that upstream documents, scoped to the image. These two signals have
    # no value in a pod whose purpose is a root shell. The rules that watch the
    # real boundary (container escape, kernel module injection, release_agent,
    # debugfs) stay active for this image like any other.
    - list: known_drop_and_execute_containers
      items:
        - ghcr.io/mortennordbye/verksted
      override:
        items: append

    # systemd-sysusers reads /etc/shadow whenever a session apt-installs a
    # package.
    - list: read_sensitive_file_images
      items:
        - ghcr.io/mortennordbye/verksted
      override:
        items: append

    # ---- verksted: the dind sidecar ----------------------------------------
    #
    # Falco sees the sidecar as the upstream docker image. Every exemption
    # must also pin the namespace, or it exempts that image cluster-wide.
    - macro: verksted_dind
      condition: (container.image.repository=docker.io/library/docker and k8s.ns.name=verksted)

    # The dind containerd truncates /var/log/dpkg.log when it unpacks Debian
    # layers. Upstream only exempts the host containerd's snapshot root.
    # Pinned to the dind root, so the same write anywhere else still alerts.
    - macro: allowed_clear_log_files
      condition: >
        (proc.name=containerd and verksted_dind
         and fd.name startswith /var/lib/docker/containerd/daemon/io.containerd.snapshotter.v1.overlayfs/snapshots/)
      override:
        condition: replace

    # cilium-agent and the dind dockerd open AF_PACKET sockets as normal
    # datapath setup. Appended to the rule, not the template hook:
    # user_known_packet_socket_binaries is a list that proc.name in (...)
    # consumes, and that can only exempt the binary name cluster-wide.
    - rule: Packet socket created in container
      condition: >
        and not (proc.name=cilium-agent and container.image.repository=quay.io/cilium/cilium)
        and not (proc.name=dockerd and verksted_dind)
      override:
        condition: append
