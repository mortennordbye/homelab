# modern eBPF: the only driver that works on Talos (no kernel headers).
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false

falcosidekick:
  enabled: true
  webui:
    enabled: false
  config:
    existingSecret: falco-falcosidekick-discord
    extraEnv:
      - name: DISCORD_MINIMUMPRIORITY
        value: notice

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Expose Falco's Prometheus metrics; kube-prometheus-stack scrapes the
# ServiceMonitor (release label matches the operator's selector convention).
metrics:
  enabled: true
  interval: 15m
serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

# Tune out known-benign behaviour so the channel only shows actionable alerts.
customRules:
  tuning.yaml: |-
    - macro: cilium_cni_exec
      condition: (proc.name=cilium-cni and proc.exepath startswith /opt/cni/bin/)

    - rule: Drop and execute new binary in container
      condition: and not cilium_cni_exec
      override:
        condition: append

    - macro: authentik_server
      condition: (container.image.repository=ghcr.io/goauthentik/server and proc.name=authentik)

    - rule: Redirect STDOUT/STDIN to Network Connection in Container
      condition: and not authentik_server
      override:
        condition: append
