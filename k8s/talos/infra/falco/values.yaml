# modern eBPF: the only driver that works on Talos (no kernel headers).
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false

falcosidekick:
  enabled: true
  webui:
    enabled: false
  config:
    existingSecret: falco-falcosidekick-discord
    extraEnv:
      - name: DISCORD_MINIMUMPRIORITY
        value: notice

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
