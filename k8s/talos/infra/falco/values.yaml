# modern eBPF: the only driver that works on Talos (no kernel headers).
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false

falcosidekick:
  enabled: true
  webui:
    enabled: false
  config:
    existingSecret: falco-falcosidekick-discord
    extraEnv:
      - name: DISCORD_MINIMUMPRIORITY
        value: notice

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Suppress false positives from the Cilium CNI plugin exec'ing on every node.
customRules:
  tuning.yaml: |-
    - macro: cilium_cni_exec
      condition: (proc.name=cilium-cni and proc.exepath startswith /opt/cni/bin/)

    - rule: Drop and execute new binary in container
      condition: and not cilium_cni_exec
      override:
        condition: append
