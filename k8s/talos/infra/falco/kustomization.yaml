apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: falco

resources:
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - falcosidekick-discord-secret.yaml

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.0.0
    releaseName: falco
    namespace: falco
    valuesFile: values.yaml

# falcosidekick is a subchart that only exposes pod annotations, so patch the
# Reloader annotation onto its Deployment to auto-restart on webhook secret change.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: falco-falcosidekick
        namespace: falco
        annotations:
          reloader.stakater.com/auto: "true"
