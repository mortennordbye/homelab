apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keda

# The `keda` namespace is owned by the core `keda` Application — do not recreate
# it here (same pattern as loki/tempo into `monitoring`).
resources:
  - referencegrant.yaml
  - servicemonitor.yaml

helmCharts:
  - name: keda-add-ons-http
    repo: https://kedacore.github.io/charts
    includeCRDs: true
    namespace: keda
    version: 0.15.0
    releaseName: keda-add-ons-http
    valuesFile: ./values.yaml
