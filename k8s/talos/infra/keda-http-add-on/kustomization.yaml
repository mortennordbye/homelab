apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keda

# The core `keda` Application owns the `keda` namespace. Do not create it here
# again (same pattern as loki/tempo into `monitoring`).
resources:
  - referencegrant.yaml
  - servicemonitor.yaml

helmCharts:
  - name: keda-add-ons-http
    repo: https://kedacore.github.io/charts
    includeCRDs: true
    namespace: keda
    version: 0.16.0
    releaseName: keda-add-ons-http
    valuesFile: ./values.yaml
