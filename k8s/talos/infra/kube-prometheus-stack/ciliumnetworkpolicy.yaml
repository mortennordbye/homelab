# Prometheus: scrapes targets in every namespace, pushes alerts to Alertmanager.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    # Grafana queries.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": grafana
    # Traefik for the dashboard.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
    # Pyrra's UI reads SLO budgets.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": pyrra
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # The portfolio API and status-publisher read cluster metrics.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": portfolio
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Kargo's error budget gate before a prod promotion PR.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kargo
            "k8s:app.kubernetes.io/component": controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # k6 user journeys remote-write their results.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": synthetics
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEntities:
        - host
        - health
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API for service discovery.
    - toEntities:
        - kube-apiserver
    # Scrape targets: every pod, host, and remote node in the cluster (cluster entity
    # already covers host + remote-node + kube-apiserver, so node-exporter on the host
    # network is included). Audit mode will narrow this later.
    - toEntities:
        - cluster
    # node-exporter on the Proxmox hosts, outside the cluster.
    - toCIDR:
        - 10.3.10.12/32
        - 10.3.10.13/32
        - 10.3.10.14/32
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
---
# Alertmanager: receives alert payloads from Prometheus, forwards to Discord.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
    # Traefik forwards Proxmox's webhook posts (HTTPRoute alertmanager).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
    # Peer gossip between Alertmanager replicas.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": alertmanager
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns:
              - matchPattern: "*"
    # Discord webhook for alert notifications.
    - toFQDNs:
        - matchName: "discord.com"
        - matchPattern: "*.discord.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    # Heartbeat to the Cloudflare watchdog Worker.
    - toFQDNs:
        - matchName: "watchdog.bigd.no"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    # Peer gossip between Alertmanager replicas.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": alertmanager
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
---
# Grafana: dashboards, queries Prometheus and Loki.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # Traefik fronts the UI.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
    # Prometheus scrapes Grafana metrics.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
    # Argo CD notifications posts deploy annotations.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
            "k8s:app.kubernetes.io/name": argocd-notifications-controller
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns:
              - matchPattern: "*"
    # Data sources: Prometheus, Loki and Tempo in same namespace.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": loki
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": tempo
      toPorts:
        - ports: [{ port: "3200", protocol: TCP }]
    # Authentik OIDC token exchange goes through the gateway VIP.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/name": traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "8444"
              protocol: TCP
    # Pinned plugins download from grafana.com, which redirects to the catalog bucket.
    - toFQDNs:
        - matchName: grafana.com
        - matchName: storage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Dashboard and datasource sidecars watch ConfigMaps.
    - toEntities:
        - kube-apiserver
---
# Prometheus Operator: manages Prometheus/Alertmanager CRD reconciliation.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  ingress:
    - fromEntities:
        - kube-apiserver
    # Prometheus scrapes the operator's own metrics on the HTTPS admission port.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    - toEntities:
        - kube-apiserver
---
# kube-state-metrics: exposes Kubernetes object metrics on 8080.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    - toEntities:
        - kube-apiserver
