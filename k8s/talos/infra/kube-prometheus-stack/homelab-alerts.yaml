apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    # Matches Prometheus ruleSelector (kube-prometheus-stack default).
    release: kube-prometheus-stack
spec:
  groups:
    # Workload-level: anything an app would expose as user-visible breakage.
    - name: homelab.workload
      rules:
        # Container restarted more than 3 times inside a 15-minute window.
        # Catches early flapping before CrashLoopBackOff (upstream
        # KubePodCrashLooping fires only after 15 min sustained).
        # `kubectl delete pod` does NOT trigger this — only in-pod container
        # restarts (e.g. container exits, kubelet restarts in place) do.
        - alert: ContainerRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted >3 times in 15m'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` restarted {{ $value | printf "%.0f" }} times in the last 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous

        # Deployment desires >0 replicas but has 0 available for >5 min.
        # Filters out deployments intentionally scaled to 0.
        - alert: DeploymentUnavailable
          expr: |
            (kube_deployment_status_replicas_available == 0)
              and on(namespace, deployment)
            (kube_deployment_spec_replicas > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has 0 ready replicas'
            description: |
              Deployment `{{ $labels.namespace }}/{{ $labels.deployment }}` wants >0 replicas but has 0 available for over 5 minutes.
              Check: kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}

        # A container stuck in CrashLoopBackOff for 10 min. Unlike
        # DeploymentUnavailable, this fires even when a rolling update keeps the
        # old pod serving while the new revision crash-loops. max_over_time
        # smooths the gaps while the kubelet is mid-restart-attempt; a single
        # crash that recovers never reaches `for: 10m`.
        - alert: PodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} crash-looping'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` has been in CrashLoopBackOff for over 10 minutes. A rolling update may be masking this (an old pod still serving) — the new revision is broken.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous

        # Any container whose last termination was OOMKilled within the last 10 min.
        # last_terminated_reason is a persistent gauge (stays 1 forever after an OOM),
        # so we AND it with a recency check on last_terminated_timestamp to ensure the
        # alert auto-clears once the OOMs stop happening.
        - alert: ContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            and on(namespace, pod, container)
            (time() - kube_pod_container_status_last_terminated_timestamp) < 600
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOMKilled'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` was OOMKilled in the last 10 minutes.
              Raise the memory request/limit. Check: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}

    # Platform-level: anything that breaks the control plane (deploys, secrets, certs).
    - name: homelab.platform
      rules:
        # Any ArgoCD application not Healthy for >15 min.
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status!="Healthy",health_status!=""} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD app {{ $labels.name }} health={{ $labels.health_status }} sync={{ $labels.sync_status }}'
            description: |
              ArgoCD application `{{ $labels.name }}` (project `{{ $labels.project }}`, dest `{{ $labels.dest_namespace }}`) has been in health_status `{{ $labels.health_status }}` / sync_status `{{ $labels.sync_status }}` for over 15 minutes.
              Check: kubectl -n argocd describe application {{ $labels.name }}

        # ArgoCD app stuck out-of-sync / unable to render manifests for >20 min.
        # Health-based ArgoCDAppDegraded misses this: a ComparisonError shows as
        # sync_status "Unknown" while health stays "Healthy". 20m avoids firing
        # on normal in-progress syncs.
        - alert: ArgoCDAppSyncStuck
          expr: argocd_app_info{sync_status=~"OutOfSync|Unknown"} == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD app {{ $labels.name }} stuck sync={{ $labels.sync_status }} for >20m'
            description: |
              ArgoCD application `{{ $labels.name }}` (project `{{ $labels.project }}`, dest `{{ $labels.dest_namespace }}`) has been sync_status `{{ $labels.sync_status }}` for over 20 minutes — sustained drift or a manifest-generation failure (ComparisonError) that auto-sync cannot resolve.
              Check: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'

        # ExternalSecret has been NotReady for 30 min.
        # Typical causes: Bitwarden API breakage, expired token, missing/renamed secret in the store, wrong remoteRef UUID.
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{status="False",condition="Ready"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not Ready'
            description: |
              ExternalSecret `{{ $labels.namespace }}/{{ $labels.name }}` has been NotReady for 30 minutes.
              Check: kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}

        # Any cert-manager certificate within 7 days of expiry.
        # cert-manager normally auto-renews — if this fires the DNS-01 / HTTP-01
        # challenge is failing silently.
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
            description: |
              Certificate `{{ $labels.namespace }}/{{ $labels.name }}` expires in {{ $value | humanizeDuration }}.
              cert-manager should be auto-renewing — if this fires, the renewal pipeline is broken.
              Check: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}

        # KEDA-aware replacement for the upstream KubeHpaMaxedOut (disabled in
        # values.yaml defaultRules): KEDA-driven HPAs sit "at max" by design, so
        # keda-hpa-* is excluded while genuine CPU/memory HPAs stay covered.
        # Expr mirrors the upstream rule verbatim.
        - alert: KubeHpaMaxedOut
          expr: |
            (
              kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
                == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
            )
            and on (namespace, horizontalpodautoscaler)
            (
              kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
                != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} running at max replicas'
            description: |
              HPA `{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}` has been at max replicas for over 15 minutes and cannot scale higher to meet demand. (KEDA-driven HPAs are excluded — their max is set by schedule/trigger, not load.)
              Check: kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}

    # Media stack (arr-stack, exportarr + qbittorrent-exporter). Critical so they reach Discord.
    - name: homelab.media
      rules:
        # warning/error queue items never clear on their own: they wait for a manual import or removal.
        - alert: ArrQueueStuck
          expr: |
            sum by (namespace, job, download_state) (
              {__name__=~"sonarr_queue_total|radarr_queue_total", download_status=~"warning|error"}
            ) > 0
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.job }}: {{ $value | printf "%.0f" }} queue items stuck in {{ $labels.download_state }}'
            description: |
              `{{ $labels.job }}` has {{ $value | printf "%.0f" }} queue items in state `{{ $labels.download_state }}` with a warning or error for over 2 hours.
              Open Activity > Queue in the app and import or remove them.

        - alert: MediaRootFolderLow
          expr: |
            min by (namespace, job, path) (
              {__name__=~"sonarr_rootfolder_freespace_bytes|radarr_rootfolder_freespace_bytes"}
            ) < 200e9
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.job }} root folder {{ $labels.path }} has {{ $value | humanize1024 }}B free'
            description: |
              Root folder `{{ $labels.path }}` in `{{ $labels.job }}` is under 200 GB free. Imports fail once it fills.

        # exportarr reports 0 when it cannot reach the app's API, even while the pod is Running.
        - alert: ArrAppUnreachable
          expr: |
            min by (namespace, job) (
              {__name__=~"sonarr_system_status|radarr_system_status|prowlarr_system_status|bazarr_system_status"}
            ) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.job }} cannot reach its app API'
            description: |
              `{{ $labels.job }}` has reported the app as down for 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs deploy/{{ $labels.job }}

        - alert: MediaExporterDown
          expr: up{namespace="arr-stack"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: 'Media stack exporter {{ $labels.job }} is down'
            description: |
              Prometheus has failed to scrape `{{ $labels.job }}` for 15 minutes, so the other media alerts are blind.
              Check: kubectl -n {{ $labels.namespace }} get pods

        # qBittorrent runs inside the gluetun VPN pod; disconnected means the tunnel is down.
        - alert: QbittorrentDisconnected
          expr: min by (namespace, server) (qbittorrent_connected) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: 'qBittorrent at {{ $labels.server }} has no connection'
            description: |
              qBittorrent has reported no connection for 30 minutes, so downloads are stalled.
              Check: kubectl -n gluetun-vpn logs deploy/gluetun -c gluetun

    - name: homelab.backup
      rules:
        # Covers etcd-backup and every *-db-backup CronJob. The second branch catches a
        # job that has been scheduled but never succeeded, which has no
        # last_successful_time yet.
        - alert: BackupJobStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|.+-db-backup"}) > 26 * 3600
            or
            (
              kube_cronjob_status_last_schedule_time{cronjob=~"etcd-backup|.+-db-backup"}
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
            )
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'Backup job {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in over a day'
            description: |
              CronJob `{{ $labels.namespace }}/{{ $labels.cronjob }}` has not completed a backup in over 26 hours.
              Check: kubectl -n {{ $labels.namespace }} get jobs,pods and the failed pod's logs.

        - alert: VolSyncBackupStale
          expr: max by (obj_namespace, obj_name) (volsync_volume_out_of_sync{role="source"}) == 1
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: 'Volume backup {{ $labels.obj_namespace }}/{{ $labels.obj_name }} is behind schedule'
            description: |
              ReplicationSource `{{ $labels.obj_namespace }}/{{ $labels.obj_name }}` has missed its nightly restic backup for over 6 hours.
              Check: kubectl -n {{ $labels.obj_namespace }} describe replicationsource {{ $labels.obj_name }} and the volsync-src-{{ $labels.obj_name }} pod logs.

    - name: homelab.network
      rules:
        # Fires only when every internet target fails, so one site being down is not an
        # outage. Discord is unreachable during the outage itself; Alertmanager retries
        # and the message lands once the line is back, carrying the start time.
        - alert: InternetDown
          expr: max(probe_success{job="internet"}) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'Internet unreachable from the homelab'
            description: |
              Every internet probe (Google, Cloudflare) has failed for over a minute. The UniFi gateway log under Telia Norge AS shows whether the WAN dropped.
              Latency history: probe_duration_seconds{job="internet"} in Grafana.
