apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    # Matches Prometheus ruleSelector (kube-prometheus-stack default).
    release: kube-prometheus-stack
spec:
  groups:
    # 0/1 gauges for Pyrra bool_gauge SLOs (k8s/talos/infra/pyrra/slos.yaml), which take a metric, not an expression.
    - name: homelab.sli
      rules:
        - record: homelab:argocd_app_healthy
          expr: max by (name) (argocd_app_info{health_status="Healthy"} or argocd_app_info * 0)
        - record: homelab:volsync_in_sync
          expr: 1 - max by (obj_namespace, obj_name) (volsync_volume_out_of_sync{role="source"})

    # Workload-level: anything an app would expose as user-visible breakage.
    - name: homelab.workload
      rules:
        # Container restarted more than 3 times inside a 15-minute window.
        # Catches early flapping before CrashLoopBackOff (upstream
        # KubePodCrashLooping fires only after 15 min sustained).
        # `kubectl delete pod` does NOT trigger this — only in-pod container
        # restarts (e.g. container exits, kubelet restarts in place) do.
        - alert: ContainerRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#containerrestartingfrequently
            summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted >3 times in 15m'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` restarted {{ $value | printf "%.0f" }} times in the last 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous

        # Deployment desires >0 replicas but has 0 available for >5 min.
        # Filters out deployments intentionally scaled to 0.
        - alert: DeploymentUnavailable
          expr: |
            (kube_deployment_status_replicas_available == 0)
              and on(namespace, deployment)
            (kube_deployment_spec_replicas > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#deploymentunavailable
            summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has 0 ready replicas'
            description: |
              Deployment `{{ $labels.namespace }}/{{ $labels.deployment }}` wants >0 replicas but has 0 available for over 5 minutes.
              Check: kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}

        # A container stuck in CrashLoopBackOff for 10 min. Unlike
        # DeploymentUnavailable, this fires even when a rolling update keeps the
        # old pod serving while the new revision crash-loops. max_over_time
        # smooths the gaps while the kubelet is mid-restart-attempt; a single
        # crash that recovers never reaches `for: 10m`.
        - alert: PodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#podcrashlooping
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} crash-looping'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` has been in CrashLoopBackOff for over 10 minutes. A rolling update may be masking this (an old pod still serving) — the new revision is broken.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous

        # Any container whose last termination was OOMKilled within the last 10 min.
        # last_terminated_reason is a persistent gauge (stays 1 forever after an OOM),
        # so we AND it with a recency check on last_terminated_timestamp to ensure the
        # alert auto-clears once the OOMs stop happening.
        - alert: ContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            and on(namespace, pod, container)
            (time() - kube_pod_container_status_last_terminated_timestamp) < 600
          for: 1m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#containeroomkilled
            summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOMKilled'
            description: |
              Container `{{ $labels.container }}` in pod `{{ $labels.namespace }}/{{ $labels.pod }}` was OOMKilled in the last 10 minutes.
              Raise the memory request/limit. Check: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}

    # Platform-level: anything that breaks the control plane (deploys, secrets, certs).
    - name: homelab.platform
      rules:
        # Any ArgoCD application not Healthy for >15 min.
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status!="Healthy",health_status!=""} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#argocdappdegraded
            summary: 'ArgoCD app {{ $labels.name }} health={{ $labels.health_status }} sync={{ $labels.sync_status }}'
            description: |
              ArgoCD application `{{ $labels.name }}` (project `{{ $labels.project }}`, dest `{{ $labels.dest_namespace }}`) has been in health_status `{{ $labels.health_status }}` / sync_status `{{ $labels.sync_status }}` for over 15 minutes.
              Check: kubectl -n argocd describe application {{ $labels.name }}

        # ArgoCD app stuck out-of-sync / unable to render manifests for >20 min.
        # Health-based ArgoCDAppDegraded misses this: a ComparisonError shows as
        # sync_status "Unknown" while health stays "Healthy". 20m avoids firing
        # on normal in-progress syncs.
        - alert: ArgoCDAppSyncStuck
          expr: argocd_app_info{sync_status=~"OutOfSync|Unknown"} == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#argocdappsyncstuck
            summary: 'ArgoCD app {{ $labels.name }} stuck sync={{ $labels.sync_status }} for >20m'
            description: |
              ArgoCD application `{{ $labels.name }}` (project `{{ $labels.project }}`, dest `{{ $labels.dest_namespace }}`) has been sync_status `{{ $labels.sync_status }}` for over 20 minutes — sustained drift or a manifest-generation failure (ComparisonError) that auto-sync cannot resolve.
              Check: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'

        # ExternalSecret has been NotReady for 30 min.
        # Typical causes: Bitwarden API breakage, expired token, missing/renamed secret in the store, wrong remoteRef UUID.
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{status="False",condition="Ready"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#externalsecretnotready
            summary: 'ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not Ready'
            description: |
              ExternalSecret `{{ $labels.namespace }}/{{ $labels.name }}` has been NotReady for 30 minutes.
              Check: kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}

        # Any cert-manager certificate within 7 days of expiry.
        # cert-manager normally auto-renews — if this fires the DNS-01 / HTTP-01
        # challenge is failing silently.
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#certificateexpiringsoon
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
            description: |
              Certificate `{{ $labels.namespace }}/{{ $labels.name }}` expires in {{ $value | humanizeDuration }}.
              cert-manager should be auto-renewing — if this fires, the renewal pipeline is broken.
              Check: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}

        # KEDA-aware replacement for the upstream KubeHpaMaxedOut (disabled in
        # values.yaml defaultRules): KEDA-driven HPAs sit "at max" by design, so
        # keda-hpa-* is excluded while genuine CPU/memory HPAs stay covered.
        # Expr mirrors the upstream rule verbatim.
        - alert: KubeHpaMaxedOut
          expr: |
            (
              kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
                == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
            )
            and on (namespace, horizontalpodautoscaler)
            (
              kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
                != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", horizontalpodautoscaler!~"keda-hpa-.*"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#kubehpamaxedout
            summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} running at max replicas'
            description: |
              HPA `{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}` has been at max replicas for over 15 minutes and cannot scale higher to meet demand. (KEDA-driven HPAs are excluded — their max is set by schedule/trigger, not load.)
              Check: kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}

        # The free-space floor keeps a fresh volume being filled by a restore or migration quiet.
        - alert: PersistentVolumeFillingUp
          expr: |
            predict_linear(kubelet_volume_stats_available_bytes{job="kubelet"}[6h], 4 * 86400) < 0
            and kubelet_volume_stats_available_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} < 0.5
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#persistentvolumefillingup
            summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} fills within 4 days'
            description: |
              At the last 6 hours' rate, PVC `{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}` runs out of space within 4 days.
              Check what is writing to it, then expand the PVC or cut retention.

    # Media stack (arr-stack, exportarr + qbittorrent-exporter). Critical so they reach Discord.
    - name: homelab.media
      rules:
        # warning/error queue items never clear on their own: they wait for a manual import or removal.
        - alert: ArrQueueStuck
          expr: |
            sum by (namespace, job, download_state) (
              {__name__=~"sonarr_queue_total|radarr_queue_total", download_status=~"warning|error"}
            ) > 0
          for: 2h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#arrqueuestuck
            summary: '{{ $labels.job }}: {{ $value | printf "%.0f" }} queue items stuck in {{ $labels.download_state }}'
            description: |
              `{{ $labels.job }}` has {{ $value | printf "%.0f" }} queue items in state `{{ $labels.download_state }}` with a warning or error for over 2 hours.
              Open Activity > Queue in the app and import or remove them.

        - alert: MediaRootFolderLow
          expr: |
            min by (namespace, job, path) (
              {__name__=~"sonarr_rootfolder_freespace_bytes|radarr_rootfolder_freespace_bytes"}
            ) < 200e9
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#mediarootfolderlow
            summary: '{{ $labels.job }} root folder {{ $labels.path }} has {{ $value | humanize1024 }}B free'
            description: |
              Root folder `{{ $labels.path }}` in `{{ $labels.job }}` is under 200 GB free. Imports fail once it fills.

        # exportarr reports 0 when it cannot reach the app's API, even while the pod is Running.
        - alert: ArrAppUnreachable
          expr: |
            min by (namespace, job) (
              {__name__=~"sonarr_system_status|radarr_system_status|prowlarr_system_status|bazarr_system_status"}
            ) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#arrappunreachable
            summary: '{{ $labels.job }} cannot reach its app API'
            description: |
              `{{ $labels.job }}` has reported the app as down for 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs deploy/{{ $labels.job }}

        - alert: MediaExporterDown
          expr: up{namespace="arr-stack"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#mediaexporterdown
            summary: 'Media stack exporter {{ $labels.job }} is down'
            description: |
              Prometheus has failed to scrape `{{ $labels.job }}` for 15 minutes, so the other media alerts are blind.
              Check: kubectl -n {{ $labels.namespace }} get pods

        # qBittorrent runs inside the gluetun VPN pod; disconnected means the tunnel is down.
        - alert: QbittorrentDisconnected
          expr: min by (namespace, server) (qbittorrent_connected) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#qbittorrentdisconnected
            summary: 'qBittorrent at {{ $labels.server }} has no connection'
            description: |
              qBittorrent has reported no connection for 30 minutes, so downloads are stalled.
              Check: kubectl -n gluetun-vpn logs deploy/gluetun -c gluetun

    - name: homelab.backup
      rules:
        # Covers etcd-backup, every *-db-backup and every *-backup-check CronJob. The second branch catches a
        # job that has been scheduled but never succeeded, which has no
        # last_successful_time yet.
        - alert: BackupJobStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|.+-db-backup|.+-backup-check"}) > 26 * 3600
            or
            (
              kube_cronjob_status_last_schedule_time{cronjob=~"etcd-backup|.+-db-backup|.+-backup-check"}
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
            )
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#backupjobstale
            summary: 'Backup job {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in over a day'
            description: |
              CronJob `{{ $labels.namespace }}/{{ $labels.cronjob }}` has not completed a backup in over 26 hours.
              Check: kubectl -n {{ $labels.namespace }} get jobs,pods and the failed pod's logs.

        # Nightly ScheduledBackup; 26 h leaves room for one slow run.
        - alert: PostgresBaseBackupStale
          expr: time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#postgresbasebackupstale
            summary: 'No CloudNativePG base backup in {{ $labels.namespace }} for over a day'
            description: |
              The newest base backup in Garage for the Cluster in `{{ $labels.namespace }}` is older than 26 hours.
              Check: kubectl -n {{ $labels.namespace }} get backups and the latest Backup's status.

        # Monthly job: fires 6 h after a run that did not succeed, or when no run has
        # succeeded for 32 days.
        - alert: RestoreTestFailed
          expr: |
            kube_cronjob_status_last_schedule_time{cronjob="restore-test"}
              > on (namespace, cronjob) kube_cronjob_status_last_successful_time
            or
            (time() - kube_cronjob_status_last_successful_time{cronjob="restore-test"}) > 32 * 24 * 3600
            or
            (
              kube_cronjob_status_last_schedule_time{cronjob="restore-test"}
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
            )
          for: 6h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#restoretestfailed
            summary: 'The monthly restore test did not pass'
            description: |
              CronJob `backup-check/restore-test` has not completed a successful run since it was last scheduled.
              Check: kubectl -n backup-check logs job/<latest restore-test job> --all-containers

        - alert: VolSyncBackupStale
          expr: max by (obj_namespace, obj_name) (volsync_volume_out_of_sync{role="source"}) == 1
          for: 6h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#volsyncbackupstale
            summary: 'Volume backup {{ $labels.obj_namespace }}/{{ $labels.obj_name }} is behind schedule'
            description: |
              ReplicationSource `{{ $labels.obj_namespace }}/{{ $labels.obj_name }}` has missed its nightly restic backup for over 6 hours.
              Check: kubectl -n {{ $labels.obj_namespace }} describe replicationsource {{ $labels.obj_name }} and the volsync-src-{{ $labels.obj_name }} pod logs.

    - name: homelab.data
      rules:
        # Warning, not critical: when the database is down the logeverylift user journey
        # and public-site probe already page; this names the cause.
        # absent(): a primary that is down stops reporting rather than reporting 0.
        - alert: PostgresDown
          expr: absent(cnpg_pg_replication_in_recovery{namespace="logeverylift"} == 0)
          for: 5m
          labels:
            severity: warning
            namespace: logeverylift
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#postgresdown
            summary: 'logeverylift-db has no writable primary'
            description: |
              No instance of the CloudNativePG Cluster `logeverylift-db` has reported itself as primary for 5 minutes.
              Check: kubectl -n logeverylift get cluster logeverylift-db and the instance pods' postgres logs.

        # Critical: WAL that cannot be archived stays on the instance volume until it
        # fills and the primary stops, and point-in-time restore has a gap.
        - alert: PostgresWalArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#postgreswalarchivingfailing
            summary: 'WAL archiving is failing on {{ $labels.namespace }}/{{ $labels.pod }}'
            description: |
              The newest WAL archive attempt on `{{ $labels.pod }}` failed and none has succeeded since, for 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c plugin-barman-cloud, and the garage pod in namespace garage.

    - name: homelab.network
      rules:
        # Fires only when every internet target fails, so one site being down is not an
        # outage. Discord is unreachable during the outage itself; Alertmanager retries
        # and the message lands once the line is back, carrying the start time.
        - alert: InternetDown
          expr: max(probe_success{job="internet"}) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#internetdown
            summary: 'Internet unreachable from the homelab'
            description: |
              Every internet probe (Google, Cloudflare) has failed for over a minute. The UniFi gateway's system log shows whether the WAN dropped.
              Latency history: probe_duration_seconds{job="internet"} in Grafana.

        # Silent while the whole internet is down; InternetDown covers that case.
        - alert: PublicSiteDown
          expr: |
            probe_success{job="public-sites"} == 0
            and on () max(probe_success{job="internet"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#publicsitedown
            summary: '{{ $labels.instance }} is down from outside'
            description: |
              {{ $labels.instance }} has failed through public DNS and Cloudflare for 5 minutes while the internet itself is up.
              Check the app, its HTTPRoute, and Traefik's public gateway.

        - alert: InternalSiteDown
          expr: probe_success{job="internal-sites"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#internalsitedown
            summary: '{{ $labels.instance }} is down on the private gateway'
            description: |
              {{ $labels.instance }} has failed through the gateway's DNS and Traefik's private gateway for 10 minutes.
              Check the app, its HTTPRoute, and Traefik's private gateway.

    # k6 browser journeys from k8s/talos/infra/synthetics, one remote-written run every 10 min.
    # Samples arrive only during a run, so the rules read the last one inside the window.
    - name: homelab.synthetics
      rules:
        # for: 15m spans two runs, so one flaky run does not page.
        - alert: UserJourneyFailing
          expr: |
            min by (journey, check) (last_over_time(k6_checks_rate[25m])) < 1
            and on () max(probe_success{job="internet"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#userjourneyfailing
            summary: '{{ $labels.journey }} journey breaks at step {{ $labels.check }}'
            description: |
              A real browser signed in as the synthetic user failed the {{ $labels.check }} step of the {{ $labels.journey }} journey on two runs in a row, while the site itself may still answer 200.
              The step's error and the page URL are in the job log: kubectl -n synthetics logs job/<latest logeverylift-journey job>.
              Dashboard: https://grafana.local.bigd.no/d/user-journeys?var-journey={{ $labels.journey }}

        - alert: UserJourneyNotRunning
          expr: absent_over_time(k6_checks_rate{journey="logeverylift"}[30m])
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#userjourneynotrunning
            summary: 'logeverylift journey has reported nothing for 30 minutes'
            description: |
              No k6 check result has reached Prometheus for 30 minutes, so UserJourneyFailing cannot fire.
              Check the CronJob in namespace synthetics and the Prometheus remote-write ingress.

    - name: homelab.nas
      rules:
        # diskStatus and diskHealthStatus are 1 when normal; anything else is a
        # disk DSM itself considers failing, crashed or uninitialised.
        - alert: NasDiskUnhealthy
          expr: (diskStatus{job="snmp-exporter"} != 1) or (diskHealthStatus{job="snmp-exporter"} != 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#nasdiskunhealthy
            summary: 'NAS disk {{ $labels.diskID }} is not healthy'
            description: |
              DSM reports a disk as not normal (status {{ $value }}). Check Storage Manager > HDD/SSD on nas.local.bigd.no.

        - alert: NasRaidDegraded
          expr: raidStatus{job="snmp-exporter"} != 1
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#nasraiddegraded
            summary: 'NAS {{ $labels.raidName }} is not normal'
            description: |
              DSM reports {{ $labels.raidName }} with RAID status {{ $value }} (1 is normal). Check Storage Manager on nas.local.bigd.no before anything else writes to it.

        - alert: NasVolumeAlmostFull
          expr: 1 - raidFreeSize{raidName="Volume 1"} / raidTotalSize{raidName="Volume 1"} > 0.9
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#nasvolumealmostfull
            summary: 'NAS Volume 1 is {{ $value | humanizePercentage }} full'
            description: |
              Volume 1 holds the media, the cluster volumes and every backup. Free space before it fills.

        - alert: NasVolumeFillingUp
          expr: predict_linear(raidFreeSize{raidName="Volume 1"}[6h], 4 * 86400) < 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#nasvolumefillingup
            summary: 'NAS Volume 1 fills within 4 days'
            description: |
              At the last 6 hours' rate, Volume 1 runs out of space within 4 days. It holds the media, the cluster volumes and every backup.

        - alert: NasMetricsDown
          expr: up{job="snmp-exporter"} == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#nasmetricsdown
            summary: 'NAS SNMP scrape failing'
            description: |
              Prometheus has not reached the NAS over SNMPv3 for 30 minutes, so the NAS disk and RAID alerts are blind.
              Check: kubectl -n monitoring logs deploy/snmp-exporter, and DSM > Terminal & SNMP.

    - name: homelab.proxmox
      rules:
        - alert: ProxmoxHostDown
          expr: pve_up{id=~"node/.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxhostdown
            summary: 'Proxmox {{ $labels.id }} is down'
            description: |
              The Proxmox cluster reports {{ $labels.id }} offline for 5 minutes; its Talos VMs are down with it.

        # Shared storages (pbs, nfs-vmstore) report once per host; the max keeps one alert each.
        - alert: ProxmoxStorageAlmostFull
          expr: max by (id) (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes) > 0.85
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxstoragealmostfull
            summary: 'Proxmox {{ $labels.id }} is {{ $value | humanizePercentage }} full'
            description: |
              local-lvm holds the proxmox-local PVCs, where Proxmox-CSI leaves orphaned volumes; pbs holds every VM backup.

        - alert: ProxmoxStorageFillingUp
          expr: max by (id) (predict_linear(pve_disk_usage_bytes{id=~"storage/.*"}[6h], 4 * 86400) - pve_disk_size_bytes) > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxstoragefillingup
            summary: 'Proxmox {{ $labels.id }} fills within 4 days'
            description: |
              At the last 6 hours' rate, {{ $labels.id }} runs out of space within 4 days.

        - alert: ProxmoxMetricsDown
          expr: max(up{job="pve-exporter"}) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxmetricsdown
            summary: 'Proxmox exporter scrape failing'
            description: |
              Prometheus has not reached the Proxmox API for 30 minutes, so the Proxmox alerts are blind.
              Check: kubectl -n monitoring logs deploy/pve-exporter

        # coretemp reports the package and each core; the i5-11400T throttles at 100 °C.
        - alert: ProxmoxHostHot
          expr: max by (instance) (node_hwmon_temp_celsius{job="proxmox-node-exporter", chip=~"platform_coretemp.*"}) > 90
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxhosthot
            summary: 'Proxmox {{ $labels.instance }} CPU at {{ $value | printf "%.0f" }} °C'
            description: |
              {{ $labels.instance }} has run above 90 °C for 10 minutes. Check for a blocked fan or dust, and what is loading the host.

        - alert: ProxmoxSensorsDown
          expr: max(up{job="proxmox-node-exporter"}) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#proxmoxsensorsdown
            summary: 'Proxmox node-exporter scrape failing'
            description: |
              Prometheus has not reached node-exporter on any Proxmox host for 30 minutes, so ProxmoxHostHot is blind.
              Check: systemctl status prometheus-node-exporter on the hosts, and terraform/proxmox/hyper-cluster/datacenter/sensors.tf.
