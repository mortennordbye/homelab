prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Empty selectors: discover ServiceMonitors in every namespace.
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

grafana:
  enabled: true
  replicas: 1

  # Admin credentials come from an ExternalSecret.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: syno-nfs-csi
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # OIDC client credentials, so they stay out of git. The chart's
  # assertNoLeakedSecrets helper fails the render on a literal client_secret,
  # so the $__env indirection below is required rather than stylistic.
  envFromSecret: grafana-oidc

  grafana.ini:
    server:
      domain: grafana.local.bigd.no
      # Required. Without it Grafana derives http://grafana.local.bigd.no:3000/
      # from domain plus http_port and sends that as the OAuth redirect, which
      # fails authentik's strict matching. TLS terminates at Traefik; this is
      # the browser-facing URL, not how the pod is reached.
      root_url: https://grafana.local.bigd.no
    auth:
      # Both already default to false. Spelled out because keeping the local
      # admin login working is a hard requirement, and a later edit flipping
      # either of these would silently remove the break-glass path.
      disable_login_form: false
      oauth_auto_login: false
    auth.generic_oauth:
      enabled: true
      name: authentik
      client_id: $__env{GF_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_OAUTH_CLIENT_SECRET}
      # groups rides on profile; authentik has no groups scope. No
      # offline_access, since use_refresh_token defaults to false.
      scopes: openid profile email
      # Slug-less on purpose: authentik mounts authorize/token/userinfo
      # globally. Only the issuer and discovery document are per-application.
      auth_url: https://auth.local.bigd.no/application/o/authorize/
      token_url: https://auth.local.bigd.no/application/o/token/
      api_url: https://auth.local.bigd.no/application/o/userinfo/
      role_attribute_path: contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'
      # GrafanaAdmin above grants server admin rather than just org admin, but
      # only because this is set; without it the value degrades to org Admin.
      allow_assign_grafana_admin: true
      # false so an SSO user in no group lands as Viewer instead of being
      # denied login outright.
      role_attribute_strict: false
      allow_sign_up: true
      use_pkce: true

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring:3100/
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring:3200/

# Routes Prometheus alerts to Discord.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # HA: 2 replicas form a gossip cluster (the operator wires --cluster.peer
    # automatically) so alerting survives a pod/node loss. Each replica gets its
    # own NFS PVC via the volumeClaimTemplate below.
    replicas: 2
    retention: 120h
    # Mount the ExternalSecret with the Discord webhook so the URL is not in git.
    # The secret key 'url' is then read via api_url_file (see alertmanager.config below).
    secrets:
      - alertmanager-discord-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Only critical alerts reach Discord; everything else is dropped.
        - matchers:
            - severity = "critical"
          receiver: discord
    receivers:
      - name: "null"
      - name: discord
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
            channel: "#homelab-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Severity:* `{{ .Labels.severity }}`
              *Namespace:* `{{ .Labels.namespace }}`
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  # Cilium runs kubeProxyReplacement; there is no kube-proxy to scrape.
  enabled: false

defaultRules:
  create: true
  # Replaced by the KEDA-aware version in homelab-alerts.yaml: KEDA-driven
  # HPAs sit at max by design.
  disabled:
    KubeHpaMaxedOut: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
