prometheus:
  prometheusSpec:
    replicas: 1
    # The k6 user journeys in k8s/talos/infra/synthetics push their results here.
    enableRemoteWriteReceiver: true
    # At least the Pyrra SLO window (28d), or Pyrra computes budgets on partial data.
    retention: 30d
    # syno-nfs-csi does not enforce the PVC size. This limit protects the rest of the NAS.
    retentionSize: 35GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Empty selectors: discover monitors in every namespace. Without the
    # NilUsesHelmValues flags the chart swaps {} for release: kube-prometheus-stack.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

grafana:
  enabled: true
  replicas: 1

  # The root chown init container breaks the restricted standard. The PVC is already 472-owned.
  initChownData:
    enabled: false

  # Grafana installs these before startup when the version on the PVC differs. A failed download
  # or a version that needs a newer Grafana stops the pod. Bump with the Grafana image.
  plugins:
    - grafana-exploretraces-app@3.0.0 # renovate: custom.grafana-plugins=grafana-exploretraces-app
    - grafana-lokiexplore-app@3.0.0 # renovate: custom.grafana-plugins=grafana-lokiexplore-app
    - grafana-metricsdrilldown-app@3.0.0 # renovate: custom.grafana-plugins=grafana-metricsdrilldown-app
    - grafana-pyroscope-app@3.0.0 # renovate: custom.grafana-plugins=grafana-pyroscope-app
    - grafana-advisor-app@1.1.0 # renovate: custom.grafana-plugins=grafana-advisor-app
    - grafana-github-datasource@2.9.4 # renovate: custom.grafana-plugins=grafana-github-datasource
    - yesoreyeram-infinity-datasource@4.1.4 # renovate: custom.grafana-plugins=yesoreyeram-infinity-datasource

  # A dashboard ConfigMap's k8s-sidecar-target-directory annotation names its Grafana folder.
  sidecar:
    dashboards:
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 256Mi

  # Admin credentials come from an ExternalSecret.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: syno-nfs-csi
    size: 10Gi

  # The log dashboard's Loki queries add over 100Mi on top of the steady working set.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  # OIDC client credentials, so they stay out of git. The chart's
  # assertNoLeakedSecrets helper fails the render on a literal client_secret,
  # so the $__env indirection below is necessary, not a style choice.
  envFromSecret: grafana-oidc

  # Credentials for the GitHub and Cloudflare data sources, read with $__file below.
  extraSecretMounts:
    - name: github-app
      secretName: grafana-github-app
      mountPath: /etc/secrets/github-app
      readOnly: true
    - name: cloudflare
      secretName: grafana-cloudflare
      mountPath: /etc/secrets/cloudflare
      readOnly: true

  grafana.ini:
    server:
      domain: grafana.local.bigd.no
      # Required. Without it Grafana derives http://grafana.local.bigd.no:3000/
      # from domain plus http_port and sends that as the OAuth redirect. That URL
      # fails authentik's strict matching. TLS terminates at Traefik; this is
      # the browser-facing URL, not the pod address.
      root_url: https://grafana.local.bigd.no
    # Renovate tracks versions. Without it, these would need egress to grafana.com.
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    # Grafana's built-in preinstall list (Drilldown apps, and the Prometheus, Loki and Tempo
    # data sources) would otherwise update to latest once grafana.com is reachable.
    plugins:
      preinstall_auto_update: false
    # Grafana fetches avatars server-side from gravatar.com, which the egress policy blocks.
    security:
      disable_gravatar: true
    auth:
      # Both already default to false. Spelled out because the local admin
      # login must keep working. A later edit that flips either of these
      # would silently remove the emergency fallback login.
      disable_login_form: false
      oauth_auto_login: false
    auth.generic_oauth:
      enabled: true
      name: authentik
      client_id: $__env{GF_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_OAUTH_CLIENT_SECRET}
      # profile includes groups; authentik has no groups scope. No
      # offline_access, since use_refresh_token defaults to false.
      scopes: openid profile email
      # No slug, intentionally: authentik serves authorize/token/userinfo
      # globally. Only the issuer and discovery document are per-application.
      auth_url: https://auth.local.bigd.no/application/o/authorize/
      token_url: https://auth.local.bigd.no/application/o/token/
      api_url: https://auth.local.bigd.no/application/o/userinfo/
      role_attribute_path: contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'
      # GrafanaAdmin above grants server admin, not only org admin, because
      # this is set. Without it the value degrades to org Admin.
      allow_assign_grafana_admin: true
      # false so an SSO user in no group gets Viewer. Otherwise Grafana
      # denies the login.
      role_attribute_strict: false
      allow_sign_up: true
      use_pkce: true

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring:3100/
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring:3200/
    - name: GitHub
      type: grafana-github-datasource
      uid: github
      jsonData:
        selectedAuthType: github-app
        appId: $__file{/etc/secrets/github-app/app-id}
        installationId: $__file{/etc/secrets/github-app/installation-id}
      secureJsonData:
        privateKey: $__file{/etc/secrets/github-app/private-key}
    # Cloudflare's GraphQL analytics API. The Cloudflare dashboard queries it live.
    - name: Cloudflare
      type: yesoreyeram-infinity-datasource
      uid: cloudflare
      jsonData:
        auth_method: bearerToken
        allowedHosts:
          - https://api.cloudflare.com
      secureJsonData:
        bearerToken: $__file{/etc/secrets/cloudflare/token}

# Routes Prometheus alerts to Discord.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # HA: 2 replicas form a gossip cluster (the operator sets --cluster.peer
    # automatically), so alerting survives a pod or node loss. Each replica gets its
    # own NFS PVC via the volumeClaimTemplate below.
    replicas: 2
    retention: 120h
    # Silence and alert links in notifications point here.
    externalUrl: https://alertmanager.local.bigd.no
    # Mount the ExternalSecret with the Discord webhook so the URL is not in git.
    # api_url_file then reads the secret key 'url' (see alertmanager.config below).
    secrets:
      - alertmanager-discord-webhook
      - alertmanager-heartbeat
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # The always-firing Watchdog goes to the Cloudflare watchdog Worker every 5 min.
        # The Worker alerts Discord when it stops. Keep this route first.
        - matchers:
            - alertname = "Watchdog"
          receiver: heartbeat
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # reelsmith runs unattended. Its warning-tier alerts (queue starved, backup
        # stale, a post stuck) are the purpose of gateway/monitoring.yaml: the
        # failure mode they catch never shows as a restart or a 500. Dropped at
        # warning like every other app's, they would stay silent. Route the
        # namespace ahead of the severity filter below.
        - matchers:
            - namespace = "reelsmith"
          receiver: discord
        # Proxmox and DSM notifications are one-shot events from their webhooks. They
        # "resolve" when the push expires, not when a problem is fixed.
        - matchers:
            - namespace =~ "proxmox|synology"
          receiver: discord-event
        # Only critical alerts reach Discord. Alertmanager drops everything else.
        - matchers:
            - severity = "critical"
          receiver: discord
    receivers:
      - name: "null"
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-heartbeat/url
            send_resolved: false
      - name: discord-event
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
            channel: "#homelab-alerts"
            send_resolved: false
            title: '[{{ .CommonLabels.namespace | toUpper }}] {{ .Alerts | len }} notification{{ if gt (len .Alerts) 1 }}s{{ end }}'
            text: |-
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              *Node:* `{{ .Labels.node }}`{{ if .Labels.pve_severity }} · *Severity:* `{{ .Labels.pve_severity }}`{{ end }}
              {{ .Annotations.description }}
              {{ end }}
      - name: discord
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
            channel: "#homelab-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            # Pyrra cannot set annotations, so its alerts get their runbook link here.
            text: |-
              {{ range .Alerts }}
              *Severity:* `{{ .Labels.severity }}`
              *Namespace:* `{{ .Labels.namespace }}`
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ else if or (eq .Labels.alertname "ErrorBudgetBurn") (eq .Labels.alertname "SLOMetricAbsent") }}*Runbook:* https://docs.nordbye.it/platform/observability/runbooks/#{{ .Labels.alertname | toLower }}{{ end }}
              {{ end }}

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

# Talos serves etcd metrics over plain HTTP on 2381 only because the control-plane patch in
# terraform/proxmox/hyper-cluster/k8s/talos/talos-cluster.tf sets listen-metrics-urls.
kubeEtcd:
  enabled: true
  endpoints:
    - 10.3.10.31
    - 10.3.10.32
    - 10.3.10.33
  service:
    port: 2381
    targetPort: 2381

kubeScheduler:
  enabled: false

kubeProxy:
  # Cilium runs kubeProxyReplacement; there is no kube-proxy to scrape.
  enabled: false

defaultRules:
  create: true
  # homelab-alerts.yaml has a KEDA-aware replacement: KEDA-driven
  # HPAs are at max by design.
  disabled:
    KubeHpaMaxedOut: true
  additionalRuleGroupAnnotations:
    alertmanager:
      runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#alertmanager
    etcd:
      runbook_url: https://docs.nordbye.it/platform/observability/runbooks/#etcd
  rules:
    alertmanager: true
    etcd: true
    configReloaders: false
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
