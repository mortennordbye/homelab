## Minimal kube-prometheus-stack configuration
## Basic monitoring with minimal resource usage

## Prometheus configuration
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Scrape interval for minimal load
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Allow Prometheus to discover ServiceMonitors in all namespaces
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

## Grafana configuration
grafana:
  enabled: true
  replicas: 1

  # Use ExternalSecret for admin credentials
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: syno-nfs-csi
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Grafana configuration
  grafana.ini:
    server:
      domain: grafana.local.bigd.no

## Alertmanager — routes Prometheus alerts to Discord
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    # Mount the ExternalSecret with the Discord webhook so the URL is not in git.
    # The secret key 'url' is then read via api_url_file (see alertmanager.config below).
    secrets:
      - alertmanager-discord-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: syno-nfs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: discord
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog is a dead-man-switch alert that always fires; drop it.
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
      - name: discord
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
            channel: "#homelab-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Severity:* `{{ .Labels.severity }}`
              *Namespace:* `{{ .Labels.namespace }}`
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
    inhibit_rules:
      # If a critical fires for a target, suppress the warning for the same target.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["alertname", "namespace"]

## Enable basic exporters
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

## Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

## Minimal monitoring of k8s components
kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: true

## Basic alerting rules
defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
