apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-app
  namespace: monitoring
  annotations:
    # Ahead of the chart's Deployment (wave 0): the secret mount is required at pod start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: "809a0df2-18fa-4a0c-a0fa-b4f1011b6723"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: installation-id
      remoteRef:
        key: "078409da-e11c-42b0-a978-b4f1011bee61"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: private-key
      remoteRef:
        key: "740c5356-a686-4bb9-9f1f-b4f1011b967d"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
