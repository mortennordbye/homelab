# Forward-auth for the Alertmanager UI and API. Lives in this namespace because Traefik
# resolves an HTTPRoute ExtensionRef in the route's own namespace. Alertmanager has no auth of
# its own, so this is the only protection for the silences.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: alertmanager-authentik
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  forwardAuth:
    address: http://authentik-server.identity.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    # Safe: the private gateway is the only path to this middleware. It overwrites the
    # X-Forwarded-* headers that authentik uses for the post-login redirect.
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
