# Heartbeat URL of the Cloudflare watchdog Worker, written to Bitwarden by
# terraform/cloudflare/watchdog. It carries the Worker's token in its path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-heartbeat
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-heartbeat
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: "1f2f4f0b-431e-4c1d-8b27-b4d101588505"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
