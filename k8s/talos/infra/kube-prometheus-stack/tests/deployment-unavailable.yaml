# Triggers: DeploymentUnavailable — an image that never pulls keeps available
# replicas at 0; fires after `for: 5m`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-test-unavailable
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-test-unavailable
  template:
    metadata:
      labels:
        app: alert-test-unavailable
        app.kubernetes.io/managed-by: homelab-alert-test
    spec:
      containers:
        - name: nope
          image: ghcr.io/morten-homelab/this-image-will-never-exist:never
