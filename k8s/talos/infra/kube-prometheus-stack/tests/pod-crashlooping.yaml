# Triggers: PodCrashLooping — container exits on start, CrashLoopBackOff must
# persist `for: 10m`. DeploymentUnavailable also fires here, so verify this
# alert by name in Alertmanager, not just that Discord pinged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-test-crashloop
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-test-crashloop
  template:
    metadata:
      labels:
        app: alert-test-crashloop
        app.kubernetes.io/managed-by: homelab-alert-test
    spec:
      containers:
        - name: crash
          image: busybox:1.37.0
          command: ["sh", "-c", "echo starting; exit 1"]
