# Triggers: ExternalSecretNotReady — bogus Bitwarden UUID keeps Ready=False.
# The rule's `for: 30m` means a full test takes ~31 minutes; lower `for`
# temporarily for a faster smoke test.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-test-broken
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alert-test-broken
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        # Deliberately non-existent UUID; ESO will fail to resolve.
        key: "00000000-0000-0000-0000-000000000000"
