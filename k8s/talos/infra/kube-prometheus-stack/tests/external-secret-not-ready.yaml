# Triggers: ExternalSecretNotReady
#
# ExternalSecret pointing at a bogus Bitwarden UUID. ESO tries to fetch every
# minute (refreshInterval: 1m), fails, sets condition Ready=False. The metric
# externalsecret_status_condition{status="False",condition="Ready"} flips to 1.
#
# NOTE: The rule has `for: 30m` to absorb transient Bitwarden hiccups. For
# faster smoke testing, you can either:
#   (a) wait the full 31 minutes, or
#   (b) temporarily lower `for` on the ExternalSecretNotReady rule before
#       applying this fixture, then revert.
#
# Expected timeline (with default for: 30m):
#   t≈0       ES created
#   t≈30s     ESO fails first sync → Ready=False
#   t≈30min   for: 30m elapsed → firing → Discord
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-test-broken
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alert-test-broken
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        # Deliberately non-existent UUID; ESO will fail to resolve.
        key: "00000000-0000-0000-0000-000000000000"
