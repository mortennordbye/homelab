# Triggers: ContainerOOMKilled — anonymous RSS allocation past a 64 MiB limit,
# OOMKilled in a loop until deleted. Anonymous allocation, not dd to /dev/shm:
# the bounded tmpfs hits ENOSPC and exits StartError instead of OOMKilled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-test-oom
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-test-oom
  template:
    metadata:
      labels:
        app: alert-test-oom
        app.kubernetes.io/managed-by: homelab-alert-test
    spec:
      containers:
        - name: hog
          image: python:3.13-alpine
          command:
            - python
            - -c
            - |
              l = [b'a' * (1024 * 1024) for _ in range(300)]
              import time; time.sleep(60)
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
