# Triggers: ContainerRestartingFrequently — container exits every 20s so the
# in-place restart counter climbs; fires after ~5min.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-test-restart
  namespace: default
  labels:
    app.kubernetes.io/managed-by: homelab-alert-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-test-restart
  template:
    metadata:
      labels:
        app: alert-test-restart
        app.kubernetes.io/managed-by: homelab-alert-test
    spec:
      containers:
        - name: crash
          image: busybox:1.37.0
          command: ["sh", "-c", "echo running; sleep 20; echo crashing; exit 1"]
