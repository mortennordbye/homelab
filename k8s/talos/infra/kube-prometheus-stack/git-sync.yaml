# Git Sync: registers grafana/ in this repo as a Grafana repository, so dashboards saved in
# the UI open a PR and merged dashboards appear in Grafana. See
# docs/platform/observability/README.md#git-sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-git-sync
  namespace: monitoring
  annotations:
    # After Grafana is healthy, and again on every sync: this Job owns both resources.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-git-sync
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: docker.io/curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              api=http://kube-prometheus-stack-grafana.monitoring/apis/provisioning.grafana.app/v1beta1/namespaces/default
              auth="$(cat /admin/admin-user):$(cat /admin/admin-password)"
              key=$(base64 -w 0 /github-app/private-key)

              # POST, and on 409 (exists) merge-patch the same body.
              apply() {
                code=$(curl -s -o /tmp/out -w '%{http_code}' -u "$auth" -H 'Content-Type: application/json' \
                  -X POST "$api/$1" --data-binary @/tmp/body)
                if [ "$code" = 409 ]; then
                  code=$(curl -s -o /tmp/out -w '%{http_code}' -u "$auth" -H 'Content-Type: application/merge-patch+json' \
                    -X PATCH "$api/$1/$2" --data-binary @/tmp/body)
                fi
                case "$code" in 2*) echo "$1/$2: $code" ;; *) echo "$1/$2: $code"; cat /tmp/out; exit 1 ;; esac
              }

              cat > /tmp/body <<EOF
              {
                "apiVersion": "provisioning.grafana.app/v1beta1",
                "kind": "Connection",
                "metadata": {"name": "homelab-github"},
                "spec": {
                  "title": "Homelab GitHub App",
                  "type": "github",
                  "url": "https://github.com",
                  "github": {
                    "appID": "$(cat /github-app/app-id)",
                    "installationID": "$(cat /github-app/installation-id)"
                  }
                },
                "secure": {"privateKey": {"create": "$key"}}
              }
              EOF
              apply connections homelab-github

              cat > /tmp/body <<EOF
              {
                "apiVersion": "provisioning.grafana.app/v1beta1",
                "kind": "Repository",
                "metadata": {"name": "homelab"},
                "spec": {
                  "title": "Homelab (Git)",
                  "type": "github",
                  "connection": {"name": "homelab-github"},
                  "github": {
                    "url": "https://github.com/mortennordbye/homelab",
                    "branch": "main",
                    "path": "grafana/"
                  },
                  "sync": {"enabled": true, "target": "folder", "intervalSeconds": 60},
                  "workflows": ["branch"]
                }
              }
              EOF
              apply repositories homelab
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: admin
              mountPath: /admin
              readOnly: true
            - name: github-app
              mountPath: /github-app
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: admin
          secret:
            secretName: grafana-admin-credentials
        - name: github-app
          secret:
            secretName: grafana-github-app
