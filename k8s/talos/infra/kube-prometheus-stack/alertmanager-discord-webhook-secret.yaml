apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    # The Bitwarden value MUST be a Discord webhook URL with `/slack` appended:
    #   https://discord.com/api/webhooks/<id>/<token>/slack
    # Alertmanager uses slack_configs (Discord has no native AM receiver that supports
    # webhook_url_file yet — see prometheus-operator PR #6346). Discord's /slack endpoint
    # is the only one that accepts Slack-format payloads. Without /slack, every alert
    # fails with HTTP 400 `{"attachments": ["0"]}`.
    - secretKey: url
      remoteRef:
        key: "d810abf7-40ad-4b1c-9d30-b44c0108ecad"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
