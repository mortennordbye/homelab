apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: Homelab
    # SPOG dashboard JSON exceeds the 256 KiB last-applied-configuration
    # annotation limit, so ArgoCD must use server-side apply for these.
    argocd.argoproj.io/sync-options: ServerSideApply=true

configMapGenerator:
  - name: dashboard-homelab-spog
    files:
      - homelab-spog.json
  - name: dashboard-homelab-log-spog
    files:
      - homelab-log-spog.json
