apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloudflare
  namespace: monitoring
  annotations:
    # Ahead of the chart's Deployment (wave 0): the secret mount is required at pod start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "c3b6360e-7a35-4d50-af89-b4f1012bc99a"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
