# PR-based variant of promote-to-argocd, used by every prod Stage: pushes the
# bump to a generated branch, opens a homelab PR, and blocks until it merges
# before syncing Argo CD.
#
# Every step that reaches GitHub or Argo CD carries a retry.errorThreshold:
# Kargo's default of 1 means no retries, and a failed Promotion is terminal —
# the Stage sits on the old Freight until someone promotes by hand.
#
# The GitHub App needs Pull requests: read/write in addition to Contents:
# read/write, or git-open-pr fails. desiredRevision is deliberately NOT pinned
# on argocd-update: prod tracks shared main HEAD, and a fixed revision reports
# the Stage perpetually Unhealthy on the next commit.
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: promote-via-pr
spec:
  vars:
    - name: appName      # commit-message scope, e.g. portfolio
    - name: appPath      # kustomization dir, e.g. k8s/talos/apps/portfolio
    - name: imageRepo    # GHCR repo the Warehouse subscribes to
    - name: argocdApp    # Argo CD Application to sync, e.g. portfolio
    # PromQL returning the app's lowest error budget left (0..1). `none` skips the
    # gate; an empty value would make the var required on every Stage.
    - name: budgetQuery
      value: none
  steps:
    - uses: git-clone
      retry:
        errorThreshold: 3
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        # Without this Kargo authors commits as `Kargo <no-reply@kargo.io>`,
        # which GitHub carries into the squash commit as a Co-authored-by trailer.
        author:
          name: Morten Victor Nordbye
          email: morten@nordbye.it
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/${{ vars.appPath }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: "chore(${{ vars.appName }}): promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }}"
    # No-op promotions: git-commit auto-skips when there is nothing to commit,
    # so status('commit') == 'Skipped' gates push/open-pr/wait-pr (no orphan
    # promotion branch). argocd-update/wait stay unguarded so the promotion
    # still ends green by confirming prod Healthy. Use status(), not
    # task.outputs guards — those evaluate unreliably and leaked a branch per
    # no-op retry; status() also resolves with the plain step alias.
    - uses: git-push
      as: push
      retry:
        errorThreshold: 3
      if: ${{ status('commit') != 'Skipped' }}
      config:
        path: ./repo
        generateTargetBranch: true
    # Error budget gate (docs/platform/observability/slos.md). Below 25 % the PR
    # gets slo/budget-low and kargo-automerge leaves it for a hand merge. Prometheus
    # unreachable or no data also reads as low, never as a failed promotion.
    - uses: http
      as: budget
      retry:
        errorThreshold: 3
      continueOnError: true
      if: ${{ vars.budgetQuery != 'none' && status('commit') != 'Skipped' }}
      config:
        method: GET
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query
        queryParams:
          - name: query
            value: ${{ vars.budgetQuery }}
        successExpression: response.status == 200
        outputs:
          - name: low
            fromExpression: len(response.body.data.result) == 0 || float(response.body.data.result[0].value[1]) < 0.25
    - uses: git-open-pr
      as: open-pr
      retry:
        errorThreshold: 3
      if: ${{ status('commit') != 'Skipped' }}
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        provider: github
        sourceBranch: ${{ task.outputs?.['push']?.branch ?? '' }}
        targetBranch: main
        title: "chore(${{ vars.appName }}): promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }}"
        # The kargo-automerge workflow reads `app/<name>` to decide whether
        # this app is opted into unattended merging, and holds slo/budget-low.
        labels:
          - kargo
          - app/${{ vars.appName }}
          - env/${{ ctx.stage }}
          - "${{ vars.budgetQuery == 'none' ? 'slo/none' : (task.outputs?.['budget']?.low == false ? 'slo/budget-ok' : 'slo/budget-low') }}"
    # Blocks the promotion until the PR is merged in GitHub.
    - uses: git-wait-for-pr
      as: wait-pr
      # Polls GitHub for as long as the PR is open — hundreds of calls over a
      # day-long review — so one stray 5xx must not kill the promotion. Five
      # consecutive failures is GitHub being down; one is weather.
      retry:
        errorThreshold: 5
      if: ${{ status('open-pr') != 'Skipped' }}
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        provider: github
        prNumber: ${{ task.outputs?.['open-pr']?.pr?.id ?? 0 }}
    - uses: argocd-update
      retry:
        errorThreshold: 3
      config:
        apps:
          - name: ${{ vars.argocdApp }}
    - uses: argocd-wait
      retry:
        errorThreshold: 3
      config:
        apps:
          - name: ${{ vars.argocdApp }}
