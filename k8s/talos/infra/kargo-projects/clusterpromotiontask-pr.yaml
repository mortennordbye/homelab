# PR-based variant of promote-to-argocd. Same image-bump logic, but instead of
# pushing the commit straight to main it pushes to a generated branch, opens a
# homelab PR, and blocks until that PR is merged in GitHub before syncing Argo
# CD. This keeps promotion "review-and-merge in GitHub" while Kargo still drives
# image discovery, the pipeline view, and post-deploy verification.
#
# Currently used only by portfolio's prod Stage as a pilot. The direct-push
# promote-to-argocd task (clusterpromotiontask.yaml) is unchanged and still used
# by every stage Stage and by blog.
#
# PREREQUISITE: the git credential's GitHub App (mortennordbye-homelab-deployer)
# needs Pull requests: read/write in addition to Contents: read/write. git-open-pr
# fails without it. desiredRevision is deliberately NOT pinned on argocd-update
# for the same reason as promote-to-argocd: prod tracks shared main HEAD, so a
# fixed revision would report the Stage perpetually Unhealthy on the next commit.
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: promote-via-pr
spec:
  vars:
    - name: appName      # commit-message scope, e.g. portfolio
    - name: appPath      # kustomization dir, e.g. k8s/talos/apps/portfolio
    - name: imageRepo    # GHCR repo the Warehouse subscribes to
    - name: argocdApp    # Argo CD Application to sync, e.g. portfolio
  steps:
    - uses: git-clone
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/${{ vars.appPath }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: "chore(${{ vars.appName }}): promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }}"
    # No-op promotions (image tag unchanged, e.g. Kargo re-promoting a fresh
    # Freight for the already-live version) are gated with the `status('<alias>')`
    # function, the Kargo-canonical way to branch on a skipped step. git-commit
    # auto-skips when there is nothing to commit, so status('commit') == 'Skipped'
    # is the no-op signal. Guarding git-push on it makes push actually skip on a
    # no-op (so no orphan kargo/promotion branch is created), and open-pr/wait-pr
    # skip in turn. argocd-update/wait stay unguarded so the promotion still ends
    # green by confirming prod Healthy.
    #
    # This replaced home-grown `task.outputs['commit'].commit` guards, which
    # evaluated unreliably here: with identical guards git-push ran and wait-pr
    # errored while open-pr skipped, leaking a branch per no-op retry. status() is
    # purpose-built for skip detection and resolves with the plain step alias
    # (outputs still need task.outputs[...] scoping inside a task; status() does not).
    # Output references are also kept null-safe as belt-and-suspenders.
    - uses: git-push
      as: push
      if: ${{ status('commit') != 'Skipped' }}
      config:
        path: ./repo
        generateTargetBranch: true
    - uses: git-open-pr
      as: open-pr
      if: ${{ status('commit') != 'Skipped' }}
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        provider: github
        sourceBranch: ${{ task.outputs?.['push']?.branch ?? '' }}
        targetBranch: main
        title: "chore(${{ vars.appName }}): promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }}"
    # Blocks the promotion until the PR is merged in GitHub.
    - uses: git-wait-for-pr
      as: wait-pr
      if: ${{ status('open-pr') != 'Skipped' }}
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        provider: github
        prNumber: ${{ task.outputs?.['open-pr']?.pr?.id ?? 0 }}
    - uses: argocd-update
      config:
        apps:
          - name: ${{ vars.argocdApp }}
    - uses: argocd-wait
      config:
        apps:
          - name: ${{ vars.argocdApp }}
