# Kargo project for the linkgraph app. Single-environment (no stage overlay), so
# the whole pipeline is one auto-promotion: the linkgraph CI pushes a new image ->
# Warehouse creates Freight -> Kargo opens a homelab PR -> the merge deploys
# prod -> the smoke test verifies. Mirrors logeverylift.yaml/headroom.yaml. The
# image source and CI live in the separate mortennordbye/linkgraph repo.

# Named `linkgraph-cd` (not `linkgraph`) to avoid a collision with the app namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: linkgraph-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Single Stage: Kargo promotes new Freight to `prod` via promote-via-pr, which
# opens a homelab PR and waits for the merge. The PR merge is the only gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: linkgraph-cd
  namespace: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push/PR, using the existing GitHub App
# `mortennordbye-homelab-deployer`. Same App and Bitwarden keys as the other
# projects. Only the namespace differs (Kargo cred lookup is per-Project).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: linkgraph
  namespace: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/linkgraph
        # linkgraph CI tags every build 0.0.<run_number>. SemVer picks the
        # greatest. strictSemvers keeps the git-SHA/latest tags out of selection.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# prod verification: a one-shot Job that curls the app URL and fails on any
# non-2xx. linkgraph is on the private gateway with an internal cert, so use the
# internal hostname and -k. argocd-wait has already confirmed the pod Healthy
# (tcp readiness probe), so the retries only cover the short window after a roll.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: linkgraph-prod-smoke
  namespace: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: linkgraph-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            ttlSecondsAfterFinished: 86400
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  # The image names its USER (curl_user), which runAsNonRoot cannot verify.
                  runAsUser: 100
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke
                    image: curlimages/curl:8.23.0
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        memory: 64Mi
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 10 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://linkgraph.local.bigd.no/
---
# prod: the only Stage. Receives Freight straight from the Warehouse
# (sources.direct), auto-promoted per ProjectConfig through promote-via-pr. The
# smoke test then verifies it. promote-via-pr opens a homelab PR and waits for the
# merge, so the PR review is the deploy gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: linkgraph-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: prod = red.
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse via a homelab PR; smoke-tested on linkgraph.local.bigd.no after merge."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: linkgraph
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: linkgraph-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: linkgraph
        - name: appPath
          value: k8s/talos/apps/linkgraph
        - name: imageRepo
          value: ghcr.io/mortennordbye/linkgraph
        - name: argocdApp
          value: linkgraph
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
