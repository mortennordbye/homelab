# Kargo project for the portfolio app: stage -> prod promotion driven by the
# portfolio Warehouse. All portfolio-cd resources live in this one file; the
# reusable promotion steps live in clusterpromotiontask.yaml (shared with every
# other app's project). Onboarding another app = a sibling <app>.yaml here.

# Named `portfolio-cd` (not `portfolio`) to avoid colliding with the portfolio
# app namespace. The label lets the Project below adopt this pre-created
# namespace instead of racing to create it.
apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Auto-promotion is a Project-level policy in Kargo, never on a Stage. Both
# Stages auto-promote; prod goes through promote-via-pr, so the only human gate
# is merging that PR in GitHub.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: portfolio-cd
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: stage
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push (GitHub App
# mortennordbye-homelab-deployer). The Secret must live in this Project
# namespace — Kargo cred lookup is per-Project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Cloudflare API token for the prod cache purge. Kargo's secret() resolves by
# name in the Project's own namespace, so this is repeated per project.
# It is the broad token (DNS:Edit on nordbye.it); a purge-only token would cap
# the blast radius and is only a Bitwarden UUID swap here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    # Key is apiToken, not cloudflare-token as in cert-manager and external-dns:
    # Kargo reads it as ${{ secret('cloudflare-api-token').apiToken }}, and a
    # hyphenated key would need bracket indexing to reach.
    - secretKey: apiToken
      remoteRef:
        key: "621a3a65-abe5-4c24-9a32-b29e010850f5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: portfolio
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/homelab/portfolio
        # CI tags every build 0.0.<run_number>; SemVer picks the greatest.
        # NewestBuild stalls here — all builds share the base layer's `created`.
        # strictSemvers keeps git-SHA and env tags out of selection; defaults
        # spelled out to avoid ArgoCD drift.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# Stage verification: a one-shot Job that curls the stage URL and fails on any
# non-2xx. Retries cover the KEDA scale-from-zero cold start (the request also
# wakes the stage deployment). -k skips TLS verify for the internal local cert.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: portfolio-smoke
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: portfolio-stage-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 10 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://portfolio-stage.local.bigd.no/
---
# prod verification: the same check against the live public domain. Fewer
# retries than stage since prod stays warm.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: portfolio-prod-smoke
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: portfolio-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 5 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://nordbye.it/
---
# stage: receives new Freight directly from the Warehouse, then verifies with
# the smoke test. Only Freight that passes here becomes available to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: stage = blue, prod = red.
    kargo.akuity.io/color: "#0284c7"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse, then smoke-tested on portfolio-stage.local.bigd.no."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: portfolio-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: portfolio
        - name: appPath
          value: k8s/talos/apps/portfolio-stage
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/portfolio
        - name: argocdApp
          value: portfolio-stage
      steps:
        - task:
            name: promote-to-argocd
            kind: ClusterPromotionTask
---
# prod: receives only Freight already verified in `stage` (sources.stages).
# promote-via-pr auto-opens a homelab PR and blocks on the merge — the PR
# review is the prod gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Manual promotion of stage-verified Freight. Live at nordbye.it; smoke-tested after deploy."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        stages:
          - stage
  verification:
    analysisTemplates:
      - name: portfolio-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: portfolio
        - name: appPath
          value: k8s/talos/apps/portfolio
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/portfolio
        - name: argocdApp
          value: portfolio
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
        # The edge caches HTML for 4h (terraform/cloudflare/nordbye-it/cache.tf)
        # while CSS/JS are content-hashed, so stale HTML 404s every asset of a
        # new build. Purge as the last step, after argocd-wait, so the new pods
        # are already serving. Zone ID is looked up by name to keep the
        # identifier out of this public repo.
        - uses: http
          as: cf-zone
          retry:
            errorThreshold: 3
          config:
            method: GET
            url: https://api.cloudflare.com/client/v4/zones?name=nordbye.it
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
            # Asserting on the result count as well as the status, so a token
            # that cannot see the zone fails here with an obvious cause rather
            # than indexing into an empty list in fromExpression.
            successExpression: response.status == 200 && len(response.body.result) == 1
            outputs:
              - name: zoneId
                fromExpression: response.body.result[0].id
        # purge_everything: purge by hostname/prefix is Enterprise-only, and
        # purge by URL would mean enumerating every hashed filename.
        - uses: http
          as: purge-cache
          retry:
            errorThreshold: 3
          config:
            method: POST
            url: https://api.cloudflare.com/client/v4/zones/${{ outputs['cf-zone'].zoneId }}/purge_cache
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
              - name: Content-Type
                value: application/json
            body: '{"purge_everything":true}'
            # Status alone is the signal; asserting response.body.success would
            # turn an unparseable body into a failed promotion.
            successExpression: response.status == 200
          # No continueOnError: a purge that did not happen means broken HTML at
          # the edge for hours, and that should read red in the pipeline.
