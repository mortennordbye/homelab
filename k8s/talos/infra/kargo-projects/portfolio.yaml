# Kargo project for the portfolio app: stage -> prod promotion driven by the
# portfolio Warehouse. All portfolio-cd resources live in this one file; the
# reusable promotion steps live in clusterpromotiontask.yaml (shared with every
# other app's project). Onboarding another app = a sibling <app>.yaml here.

# --- Project namespace ------------------------------------------------------
# Named `portfolio-cd` (not `portfolio`) to avoid colliding with the portfolio
# app namespace. The label lets the Project below adopt this pre-created
# namespace instead of racing to create it, keeping Argo CD sync ordering clean.
apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Auto-promotion is a Project-level policy in Kargo (never on a Stage). Both
# Stages auto-promote: `stage` pushes the bump straight to main, and `prod` runs
# promote-via-pr, which auto-opens a homelab PR and then blocks on the merge. So
# the only human gate in the whole pipeline is approving that prod PR in GitHub;
# there is no manual "promote" click in the Kargo UI. prod still only receives
# Freight that passed the stage smoke test (see the Stage's sources.stages).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: portfolio-cd
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: stage
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push, using the existing GitHub App
# `mortennordbye-homelab-deployer` (scoped to mortennordbye/homelab, Contents
# read/write). ESO pulls the three App values from Bitwarden and templates them
# plus the static repoURL and the required cred-type label into the Secret.
# The Secret must live in this Project namespace (Kargo cred lookup is per-Project).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Cloudflare API token for the prod Stage's cache purge step. Kargo's secret()
# expression function resolves Secrets by name in the Project's own namespace,
# so this is repeated per project rather than shared; there is no cluster-scoped
# lookup. Both copies read the same Bitwarden secret.
#
# This is the same broad token external-dns, cert-manager and the Terraform
# configs use, reused deliberately rather than minting a purge-only one. Worth
# knowing what that means: it carries DNS:Edit and Zone Settings:Edit on
# nordbye.it, so anything able to read Secrets in this namespace, or to land a
# promotion step that reads them, can repoint the zone's records. A purge-only
# token would cap the blast radius at a cold cache. Swapping to one is a change
# of Bitwarden UUID here and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    # Key is apiToken, not cloudflare-token as in cert-manager and external-dns:
    # Kargo reads it as ${{ secret('cloudflare-api-token').apiToken }}, and a
    # hyphenated key would need bracket indexing to reach.
    - secretKey: apiToken
      remoteRef:
        key: "621a3a65-abe5-4c24-9a32-b29e010850f5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: portfolio
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/homelab/portfolio
        # CI tags every build 0.0.<run_number> (GitHub's monotonic run counter).
        # SemVer picks the greatest such tag, so new builds are always selected
        # with no manual tagging and no dependence on image timestamps (the
        # reason NewestBuild stalled: all builds share the base layer's `created`).
        # strictSemvers (default true) makes the git-SHA and env tags non-eligible.
        # discoveryLimit + strictSemvers spelled out to match Kargo's defaults and
        # avoid ArgoCD drift.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# Stage verification: a one-shot Job that curls the stage URL and fails on any
# non-2xx. Retries cover the KEDA scale-from-zero cold start (the request also
# wakes the stage deployment). -k skips TLS verify for the internal local cert.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: portfolio-smoke
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: portfolio-stage-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 10 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://portfolio-stage.local.bigd.no/
---
# prod verification: same one-shot HTTP check against the live public domain
# (through the public gateway + TLS), so a bad prod promotion is flagged instead
# of showing green. Confirmed the cluster can reach nordbye.it (no NAT-hairpin
# issue). Fewer cold-start retries needed than stage since prod stays warm.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: portfolio-prod-smoke
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: portfolio-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 5 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://nordbye.it/
---
# stage: receives new Freight directly from the Warehouse (auto-promoted per
# ProjectConfig), then verifies with the HTTP smoke test. Only Freight that
# passes verification here becomes available to prod. The promotion steps live
# in the shared promote-to-argocd ClusterPromotionTask; this Stage supplies the
# per-app vars.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour (Kargo pipeline view). Set per role and kept identical
    # across every app: stage = blue, prod = red, so the pipeline reads the same
    # everywhere instead of Kargo picking a random colour per Stage.
    kargo.akuity.io/color: "#0284c7"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse, then smoke-tested on portfolio-stage.local.bigd.no."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: portfolio-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: portfolio
        - name: appPath
          value: k8s/talos/apps/portfolio-stage
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/portfolio
        - name: argocdApp
          value: portfolio-stage
      steps:
        - task:
            name: promote-to-argocd
            kind: ClusterPromotionTask
---
# prod: receives only Freight already verified in `stage` (sources.stages).
# Auto-promoted (see ProjectConfig), but through promote-via-pr: as soon as a
# Freight passes the stage smoke test, Kargo auto-opens a homelab PR and waits.
# The prod deploy happens when that PR is approved and merged in GitHub, so the
# PR review is the prod gate. stage still uses the direct-push promote-to-argocd.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: portfolio-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Manual promotion of stage-verified Freight. Live at nordbye.it; smoke-tested after deploy."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        stages:
          - stage
  verification:
    analysisTemplates:
      - name: portfolio-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: portfolio
        - name: appPath
          value: k8s/talos/apps/portfolio
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/portfolio
        - name: argocdApp
          value: portfolio
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
        # The zone's cache rule edge-caches HTML for 4h (see
        # terraform/cloudflare/nordbye-it/cache.tf). A build's CSS and JS are
        # content-hashed, so the HTML the edge is holding names chunk files the
        # freshly promoted image no longer contains: until that HTML expires the
        # site loads with every stylesheet and script 404ing. Purging as the last
        # promotion step closes that window instead of leaving it to whoever
        # notices. Runs after argocd-wait inside the task, so the new pods are
        # already serving and nothing can re-populate the edge from the old ones.
        #
        # The zone ID is looked up by name rather than committed. It is an
        # identifier and not a credential, but this repo is public and the token
        # already carries Zone:Read, so the lookup costs one request and keeps a
        # Cloudflare identifier out of git. blog.nordbye.it lives in the same
        # zone, so both projects look up the same name.
        - uses: http
          as: cf-zone
          retry:
            errorThreshold: 3
          config:
            method: GET
            url: https://api.cloudflare.com/client/v4/zones?name=nordbye.it
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
            # Asserting on the result count as well as the status, so a token
            # that cannot see the zone fails here with an obvious cause rather
            # than indexing into an empty list in fromExpression.
            successExpression: response.status == 200 && len(response.body.result) == 1
            outputs:
              - name: zoneId
                fromExpression: response.body.result[0].id
        # purge_everything rather than a targeted purge because purge by hostname
        # or prefix is Enterprise-only, and purge by URL would mean enumerating
        # every hashed filename in the build. It costs the whole zone a cold
        # cache, which is one origin round-trip per page.
        - uses: http
          as: purge-cache
          retry:
            errorThreshold: 3
          config:
            method: POST
            url: https://api.cloudflare.com/client/v4/zones/${{ outputs['cf-zone'].zoneId }}/purge_cache
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
              - name: Content-Type
                value: application/json
            body: '{"purge_everything":true}'
            # Cloudflare answers a rejected purge with 4xx, so the status alone
            # is the signal. Not asserting on response.body.success, which would
            # turn a body Kargo failed to parse into a failed promotion.
            successExpression: response.status == 200
          # Deliberately no continueOnError. The deploy itself has already
          # succeeded by this point, so failing here looks harsh, but a purge
          # that did not happen means the live site serves broken HTML for the
          # next four hours. That should read red in the pipeline, not green.
