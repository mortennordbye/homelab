# Kargo project for the headroom app. The public read-only demo (DEMO_MODE=1,
# no real data) is the canary: `demo` deploys and smoke-tests each build, and
# only Freight that passes becomes available to `prod`, the private instance,
# gated by a PR merge. The demo never exercises the write path, so prod keeps
# its own smoke test. Image source and CI live in mortennordbye/headroom.

# Named `headroom-cd` (not `headroom`) to avoid colliding with the app namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: headroom-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Both stages auto-promote. `demo` pushes straight to main (it is a demo — no
# review gate buys anything, and a fast public canary is the point). `prod`
# auto-promotes only Freight that already passed `demo`, and does so via
# promote-via-pr, so merging that PR stays the gate on the private instance.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: headroom-cd
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: demo
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push/PR, using the existing GitHub App
# `mortennordbye-homelab-deployer`. Same App and Bitwarden keys as the other
# projects; only the namespace differs (Kargo cred lookup is per-Project).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: headroom
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/headroom
        # headroom CI tags every build 0.0.<run_number>; SemVer picks the
        # greatest. strictSemvers keeps the git-SHA/latest tags out of selection.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# demo verification. More than a liveness curl: because this instance is exposed
# to the internet, the smoke test asserts the properties that make that safe, so
# a build which regresses them fails here and never becomes eligible for prod.
#   1. the app shell serves at all
#   2. the instance really is in demo mode (an image built without DEMO_MODE
#      support would silently ignore the env var and serve a writable app)
#   3. writes are actually refused
#   4. the bank namespace is actually closed — those routes reach Enable Banking
#      on the app's own credentials, so they must never answer here
# Public URL with a real Let's Encrypt cert, so no -k (portfolio's prod smoke
# test hits nordbye.it the same way). No cold start to wait out: the demo runs a
# fixed replica.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: headroom-demo-smoke
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: headroom-demo-read-only
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        BASE=https://headroom.nordbye.it
                        echo "1/4 app shell serves"
                        curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
                          -o /dev/null "$BASE/"
                        echo "2/4 instance reports demo mode"
                        curl -fsS "$BASE/api/config" | grep -q '"demoMode":true'
                        echo "3/4 writes are refused"
                        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                          -H 'Content-Type: application/json' \
                          -d '{"income":1,"assets":{},"fixedExpenses":[],"dailyTransactions":[]}' \
                          "$BASE/api/data")
                        [ "$code" = "403" ] || { echo "POST /api/data returned $code, expected 403"; exit 1; }
                        echo "4/4 bank namespace is closed"
                        code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/bank/status")
                        [ "$code" = "403" ] || { echo "GET /api/bank/status returned $code, expected 403"; exit 1; }
                        echo "demo is serving and read-only"
---
# prod verification: a one-shot Job that curls the app URL and fails on any
# non-2xx. headroom is on the private gateway with an internal cert, so use the
# internal hostname and -k. headroom scales to zero (KEDA), so the request also
# wakes it; the higher retry count covers the cold start.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: headroom-prod-smoke
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: headroom-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 15 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://headroom.local.bigd.no/
---
# demo: receives new Freight straight from the Warehouse via direct-push
# promote-to-argocd. Only Freight that passes the read-only smoke test above
# becomes available to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: demo
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: the pre-prod stage = blue.
    kargo.akuity.io/color: "#0284c7"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse; verified read-only on headroom.nordbye.it."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: headroom
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: headroom-demo-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: headroom
        - name: appPath
          value: k8s/talos/apps/headroom-demo
        - name: imageRepo
          value: ghcr.io/mortennordbye/headroom
        - name: argocdApp
          value: headroom-demo
      steps:
        - task:
            name: promote-to-argocd
            kind: ClusterPromotionTask
---
# prod: the private instance, holding real financial data. Receives only
# Freight already verified in `demo`; promote-via-pr keeps the PR merge as the
# deploy gate on top of the demo canary.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: headroom-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: prod = red.
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Demo-verified Freight, promoted via a homelab PR; smoke-tested on headroom.local.bigd.no after merge."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: headroom
      sources:
        stages:
          - demo
  verification:
    analysisTemplates:
      - name: headroom-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: headroom
        - name: appPath
          value: k8s/talos/apps/headroom
        - name: imageRepo
          value: ghcr.io/mortennordbye/headroom
        - name: argocdApp
          value: headroom
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
