# Kargo project for innestemme, the voice assistant behind the living room Voice PE.
# Single-environment, same shape as reelsmith: one Warehouse feeds one `prod` Stage
# directly, auto-promoted through promote-via-pr. Flow: innestemme CI pushes a new
# image -> Warehouse creates Freight -> Kargo auto-opens a homelab PR -> merging it
# deploys -> the smoke test verifies.
#
# The image source and CI live in mortennordbye/innestemme.

# Named `innestemme-cd` (not `innestemme`) to avoid colliding with the app
# namespace. The label lets the Project adopt this pre-created namespace
# instead of racing to create it.
apiVersion: v1
kind: Namespace
metadata:
  name: innestemme-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: innestemme-cd
  namespace: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push/PR, using the existing GitHub App
# `mortennordbye-homelab-deployer`. Same App and Bitwarden keys as the other
# -cd projects; only the namespace differs, because Kargo cred lookup is
# per-Project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: innestemme
  namespace: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/innestemme
        # innestemme CI tags every main build 0.0.<commit time>; SemVer picks the
        # greatest. strictSemvers keeps the sha-, latest and buildcache tags out of
        # selection.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 10
---
# prod verification: a one-shot Job that curls /healthz on the Service and fails on
# any non-2xx. The CiliumNetworkPolicy admits the cluster on 9090. argocd-wait has
# already seen the pod Healthy (the startup probe covers loading the models), so the
# retries only cover a slow Service endpoint update.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: innestemme-prod-smoke
  namespace: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: innestemme-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            ttlSecondsAfterFinished: 86400
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.22.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsS --retry 10 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        http://innestemme.innestemme.svc.cluster.local:9090/healthz
---
# prod: the only Stage. Receives Freight straight from the Warehouse
# (sources.direct), auto-promoted per ProjectConfig through promote-via-pr,
# then verified by the smoke test. Merging the PR in GitHub is the deploy gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: innestemme-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: prod = red.
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse via a homelab PR; smoke-tested on the innestemme Service after merge."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: innestemme
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: innestemme-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: innestemme
        - name: appPath
          value: k8s/talos/apps/innestemme
        - name: imageRepo
          value: ghcr.io/mortennordbye/innestemme
        - name: argocdApp
          value: innestemme
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
