apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One directory for all Kargo promotion pipelines. The ClusterPromotionTask is
# shared; each app is a single multi-document <app>.yaml. Onboard a new app by
# adding its <app>.yaml here and one word to the authorized-stage list in
# ../argocd/apps.yaml.
resources:
  - clusterpromotiontask.yaml
  - portfolio.yaml
