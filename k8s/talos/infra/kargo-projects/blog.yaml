# Kargo project for the blog app: stage -> prod promotion driven by the blog
# Warehouse. Mirrors portfolio.yaml; the promotion steps live in the shared
# promote-to-argocd ClusterPromotionTask.

# --- Project namespace ------------------------------------------------------
# Named `blog-cd` (not `blog`) to avoid colliding with the blog app namespace.
# The label lets the Project below adopt this pre-created namespace instead of
# racing to create it, keeping Argo CD sync ordering clean.
apiVersion: v1
kind: Namespace
metadata:
  name: blog-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Auto-promotion is a Project-level policy in Kargo (never on a Stage). Both
# Stages auto-promote: `stage` pushes the bump straight to main, and `prod` runs
# promote-via-pr, which auto-opens a homelab PR and then blocks on the merge. So
# the only human gate in the whole pipeline is approving that prod PR in GitHub;
# there is no manual "promote" click in the Kargo UI. prod still only receives
# Freight that passed the stage smoke test (see the Stage's sources.stages).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: blog-cd
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: stage
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push, using the existing GitHub App
# `mortennordbye-homelab-deployer` (scoped to mortennordbye/homelab, Contents
# read/write). Same App as portfolio-cd; only the namespace differs. The Secret
# must live in this Project namespace (Kargo cred lookup is per-Project).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: blog
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/homelab/blog
        # CI tags every build 0.0.<run_number>; SemVer picks the greatest.
        # strictSemvers keeps the git-SHA and moving env tags out of selection.
        # No eligible Freight exists until the first build after the CI change
        # lands a 0.0.<run> tag (the current blog images are git-SHA tagged).
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# Stage verification: a one-shot Job that exercises the stage site and fails on
# any non-2xx. Retries on the first request cover the KEDA scale-from-zero cold
# start (that request also wakes the stage deployment). -k skips TLS verify for
# the internal local cert.
#
# This used to be a single curl of `/` that passed on any 2xx, which meant a
# site rendering a blank or half-broken page still promoted to prod. nginx
# serves whatever Hugo produced, so "200 on the home page" says almost nothing.
# The checks below assert the things that actually break: which theme rendered
# the page, that each page *kind* builds, and that the search index has content.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: blog-smoke
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: blog-stage-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        BASE=https://blog-stage.local.bigd.no
                        # First request carries the long retry: it wakes the
                        # KEDA-scaled deployment from zero.
                        curl -fsSk --retry 10 --retry-delay 6 --retry-all-errors \
                          --max-time 30 -H 'Accept-Encoding: identity' \
                          -o /tmp/home.html "$BASE/"

                        # Which theme rendered this. baseof.html emits this block and
                        # Blowfish emitted nothing like it, so it is the one cheap
                        # assertion that the theme swap actually took effect.
                        #
                        # Grep the bare string, NOT id="northlight-strings" -- the
                        # build runs --minify, which strips attribute quotes, so the
                        # served markup reads id=northlight-strings. The quoted form
                        # passes against an unminified local build and fails against
                        # production, which is the worst way for a gate to be wrong.
                        grep -q 'northlight-strings' /tmp/home.html

                        # One request per page kind. A template that fails to build
                        # takes its whole kind down while the home page stays fine.
                        for p in /blog/ /tags/ /404.html /index.xml; do
                          curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                            --max-time 20 -o /dev/null "$BASE$p"
                        done

                        # The search index. Missing or empty is a silent search
                        # outage: the modal opens and simply finds nothing.
                        curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -H 'Accept-Encoding: identity' \
                          -o /tmp/index.json "$BASE/index.json"
                        grep -q '"title"' /tmp/index.json

                        # An article page, the most complex template. The slug comes
                        # out of the index rather than being hardcoded, so renaming a
                        # post cannot silently stop this being checked.
                        # Split on commas first: the index is one minified line, so a
                        # greedy match against it would return the last url, not the
                        # first, and which post got checked would drift with ordering.
                        POST=$(tr ',' '\n' < /tmp/index.json \
                          | sed -n 's|.*"url":"\([^"]*\)".*|\1|p' | head -1)
                        test -n "$POST"
                        curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -o /dev/null "$BASE$POST"

                        echo "smoke OK (theme, 4 kinds, search index, $POST)"
---
# prod verification: same one-shot HTTP check against the live public domain.
# Confirmed the cluster can reach blog.nordbye.it (no NAT-hairpin issue).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: blog-prod-smoke
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: blog-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 180
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - >
                        curl -fsSk --retry 5 --retry-delay 6 --retry-all-errors
                        -o /dev/null -w '%{http_code}\n'
                        https://blog.nordbye.it/
---
# stage: receives new Freight directly from the Warehouse (auto-promoted per
# ProjectConfig), then verifies with the HTTP smoke test. Only Freight that
# passes verification here becomes available to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: stage = blue, prod = red.
    kargo.akuity.io/color: "#0284c7"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse, then smoke-tested on blog-stage.local.bigd.no."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: blog
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: blog-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: blog
        - name: appPath
          value: k8s/talos/apps/blog-stage
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/blog
        - name: argocdApp
          value: blog-stage
      steps:
        - task:
            name: promote-to-argocd
            kind: ClusterPromotionTask
---
# prod: receives only Freight already verified in `stage` (sources.stages).
# Auto-promoted (see ProjectConfig), but through promote-via-pr: as soon as a
# Freight passes the stage smoke test, Kargo auto-opens a homelab PR and waits.
# The prod deploy happens when that PR is approved and merged in GitHub, so the
# PR review is the prod gate. stage still uses the direct-push promote-to-argocd.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Manual promotion of stage-verified Freight. Live at blog.nordbye.it; smoke-tested after deploy."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: blog
      sources:
        stages:
          - stage
  verification:
    analysisTemplates:
      - name: blog-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: blog
        - name: appPath
          value: k8s/talos/apps/blog
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/blog
        - name: argocdApp
          value: blog
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
