# Kargo project for the blog app: stage -> prod promotion driven by the blog
# Warehouse. Mirrors portfolio.yaml; the promotion steps live in the shared
# promote-to-argocd ClusterPromotionTask.

# Named `blog-cd` (not `blog`) to avoid colliding with the blog app namespace.
# The label lets the Project below adopt this pre-created namespace instead of
# racing to create it.
apiVersion: v1
kind: Namespace
metadata:
  name: blog-cd
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Auto-promotion is a Project-level policy in Kargo, never on a Stage. Both
# Stages auto-promote; prod goes through promote-via-pr, so the only human gate
# is merging that PR in GitHub.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: blog-cd
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stage: stage
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
---
# Git write credential for Kargo's git-push (GitHub App
# mortennordbye-homelab-deployer). The Secret must live in this Project
# namespace — Kargo cred lookup is per-Project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-homelab
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-git-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/mortennordbye/homelab.git
        githubAppClientID: "{{ .githubAppClientID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppClientID
      remoteRef:
        key: "a6b2b4ea-fa97-4d5c-bd74-b489010c5fab"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: "aabab894-a09a-415c-ba17-b489010c8df5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: "fc775dd0-1b67-4dfa-b2e9-b489010d0359"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Cloudflare API token for the prod cache purge. Kargo's secret() resolves by
# name in the Project's own namespace, so this is repeated per project.
# It is the broad token (DNS:Edit on nordbye.it); a purge-only token would cap
# the blast radius and is only a Bitwarden UUID swap here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    # Key is apiToken, not cloudflare-token as in cert-manager and external-dns:
    # Kargo reads it as ${{ secret('cloudflare-api-token').apiToken }}, and a
    # hyphenated key would need bracket indexing to reach.
    - secretKey: apiToken
      remoteRef:
        key: "621a3a65-abe5-4c24-9a32-b29e010850f5"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: blog
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # interval as Kargo normalizes it (1m -> 1m0s), to avoid ArgoCD drift.
  interval: 1m0s
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/mortennordbye/homelab/blog
        # CI tags every build 0.0.<run_number>; SemVer picks the greatest.
        # strictSemvers keeps the git-SHA and moving env tags out of selection.
        imageSelectionStrategy: SemVer
        strictSemvers: true
        discoveryLimit: 20
---
# Stage verification: a one-shot Job that asserts the theme rendered, each page
# kind builds, and the search index has content — a bare 200 on / passes even
# when the site is half-broken. -k skips TLS verify for the internal local cert.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: blog-smoke
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: blog-stage-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        BASE=https://blog-stage.local.bigd.no
                        # First request carries the long retry: it wakes the
                        # KEDA-scaled deployment from zero.
                        curl -fsSk --retry 10 --retry-delay 6 --retry-all-errors \
                          --max-time 30 -H 'Accept-Encoding: identity' \
                          -o /tmp/home.html "$BASE/"

                        # Theme marker from baseof.html. Grep the bare string, not
                        # id="northlight-strings": --minify strips attribute quotes.
                        grep -q 'northlight-strings' /tmp/home.html

                        # One request per page kind. A template that fails to build
                        # takes its whole kind down while the home page stays fine.
                        for p in /blog/ /tags/ /404.html /index.xml; do
                          curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                            --max-time 20 -o /dev/null "$BASE$p"
                        done

                        # The search index. Missing or empty is a silent search
                        # outage: the modal opens and simply finds nothing.
                        curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -H 'Accept-Encoding: identity' \
                          -o /tmp/index.json "$BASE/index.json"
                        grep -q '"title"' /tmp/index.json

                        # An article page; slug taken from the index so a renamed post
                        # stays covered. Split on commas first — the index is one
                        # minified line and a greedy match would grab the last url.
                        POST=$(tr ',' '\n' < /tmp/index.json \
                          | sed -n 's|.*"url":"\([^"]*\)".*|\1|p' | head -1)
                        test -n "$POST"
                        curl -fsSk --retry 2 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -o /dev/null "$BASE$POST"

                        echo "smoke OK (theme, 4 kinds, search index, $POST)"
---
# prod verification: the same checks against the live public domain.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: blog-prod-smoke
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  metrics:
    - name: blog-prod-http-200
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 240
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.21.0
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        BASE=https://blog.nordbye.it
                        # Prod runs minReplicaCount 1, so there is no
                        # scale-from-zero wait to absorb here and the retries
                        # only have to cover a rollout or a blip.
                        curl -fsSk --retry 3 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -H 'Accept-Encoding: identity' \
                          -o /tmp/home.html "$BASE/"

                        # Bare string, not id="...": --minify strips the
                        # attribute quotes. The marker survives Cloudflare's edge.
                        grep -q 'northlight-strings' /tmp/home.html

                        for p in /blog/ /tags/ /404.html /index.xml; do
                          curl -fsSk --retry 3 --retry-delay 3 --retry-all-errors \
                            --max-time 20 -o /dev/null "$BASE$p"
                        done

                        curl -fsSk --retry 3 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -H 'Accept-Encoding: identity' \
                          -o /tmp/index.json "$BASE/index.json"
                        grep -q '"title"' /tmp/index.json

                        POST=$(tr ',' '\n' < /tmp/index.json \
                          | sed -n 's|.*"url":"\([^"]*\)".*|\1|p' | head -1)
                        test -n "$POST"
                        curl -fsSk --retry 3 --retry-delay 3 --retry-all-errors \
                          --max-time 20 -o /dev/null "$BASE$POST"

                        echo "prod smoke OK (theme, 4 kinds, search index, $POST)"
---
# stage: receives new Freight directly from the Warehouse (auto-promoted per
# ProjectConfig), then verifies with the HTTP smoke test. Only Freight that
# passes verification here becomes available to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Cosmetic UI colour, kept identical across apps: stage = blue, prod = red.
    kargo.akuity.io/color: "#0284c7"
    kargo.akuity.io/description: "Auto-promoted from the Warehouse, then smoke-tested on blog-stage.local.bigd.no."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: blog
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: blog-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: blog
        - name: appPath
          value: k8s/talos/apps/blog-stage
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/blog
        - name: argocdApp
          value: blog-stage
      steps:
        - task:
            name: promote-to-argocd
            kind: ClusterPromotionTask
---
# prod: receives only Freight already verified in `stage` (sources.stages).
# promote-via-pr auto-opens a homelab PR and blocks on the merge — the PR
# review is the prod gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: blog-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: "#e11d48"
    kargo.akuity.io/description: "Manual promotion of stage-verified Freight. Live at blog.nordbye.it; smoke-tested after deploy."
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: blog
      sources:
        stages:
          - stage
  verification:
    analysisTemplates:
      - name: blog-prod-smoke
  promotionTemplate:
    spec:
      vars:
        - name: appName
          value: blog
        - name: appPath
          value: k8s/talos/apps/blog
        - name: imageRepo
          value: ghcr.io/mortennordbye/homelab/blog
        - name: argocdApp
          value: blog
      steps:
        - task:
            name: promote-via-pr
            kind: ClusterPromotionTask
        # The edge caches HTML for 4h (terraform/cloudflare/nordbye-it/cache.tf)
        # while CSS/JS are content-hashed, so stale HTML 404s every asset of a
        # new build. Purge as the last step, after argocd-wait, so the new pods
        # are already serving. Zone ID is looked up by name to keep the
        # identifier out of this public repo.
        - uses: http
          as: cf-zone
          retry:
            errorThreshold: 3
          config:
            method: GET
            url: https://api.cloudflare.com/client/v4/zones?name=nordbye.it
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
            # Asserting on the result count as well as the status, so a token
            # that cannot see the zone fails here with an obvious cause rather
            # than indexing into an empty list in fromExpression.
            successExpression: response.status == 200 && len(response.body.result) == 1
            outputs:
              - name: zoneId
                fromExpression: response.body.result[0].id
        # purge_everything: purge by hostname/prefix is Enterprise-only, and
        # purge by URL would mean enumerating every hashed filename.
        - uses: http
          as: purge-cache
          retry:
            errorThreshold: 3
          config:
            method: POST
            url: https://api.cloudflare.com/client/v4/zones/${{ outputs['cf-zone'].zoneId }}/purge_cache
            headers:
              - name: Authorization
                value: Bearer ${{ secret('cloudflare-api-token').apiToken }}
              - name: Content-Type
                value: application/json
            body: '{"purge_everything":true}'
            # Status alone is the signal; asserting response.body.success would
            # turn an unparseable body into a failed promotion.
            successExpression: response.status == 200
          # No continueOnError: a purge that did not happen means broken HTML at
          # the edge for hours, and that should read red in the pipeline.
