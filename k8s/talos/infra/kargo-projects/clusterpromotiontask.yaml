# Reusable direct-push promotion shared by every Kargo app: rewrite the image
# tag in the app's kustomization, commit + push to main, sync Argo CD, block
# until Synced + Healthy. Cluster-scoped; each Stage supplies vars.
#
# desiredRevision is deliberately NOT pinned: the apps track shared main HEAD,
# and a fixed revision reports the Stage perpetually Unhealthy on the next
# commit. Every step that reaches GitHub or Argo CD carries a
# retry.errorThreshold — Kargo's default of 1 means no retries, and a failed
# Promotion is terminal (see clusterpromotiontask-pr.yaml).
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: promote-to-argocd
spec:
  vars:
    - name: appName      # commit-message scope, e.g. portfolio
    - name: appPath      # kustomization dir, e.g. k8s/talos/apps/portfolio-stage
    - name: imageRepo    # GHCR repo the Warehouse subscribes to
    - name: argocdApp    # Argo CD Application to sync, e.g. portfolio-stage
  steps:
    - uses: git-clone
      retry:
        errorThreshold: 3
      config:
        repoURL: https://github.com/mortennordbye/homelab.git
        # Without this Kargo authors commits as `Kargo <no-reply@kargo.io>`,
        # which GitHub carries into the squash commit as a Co-authored-by trailer.
        author:
          name: Morten Victor Nordbye
          email: morten@nordbye.it
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/${{ vars.appPath }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      config:
        path: ./repo
        message: "chore(${{ vars.appName }}): promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }}"
    - uses: git-push
      retry:
        errorThreshold: 3
      config:
        path: ./repo
    - uses: argocd-update
      retry:
        errorThreshold: 3
      config:
        apps:
          - name: ${{ vars.argocdApp }}
    - uses: argocd-wait
      retry:
        errorThreshold: 3
      config:
        apps:
          - name: ${{ vars.argocdApp }}
