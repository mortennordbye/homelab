apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: public-sites-probe
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Share of blackbox probes per public site that succeed, the view a visitor gets.
  target: "99.5"
  window: 7d
  indicator:
    bool_gauge:
      metric: probe_success{job="public-sites"}
      grouping:
        - instance
