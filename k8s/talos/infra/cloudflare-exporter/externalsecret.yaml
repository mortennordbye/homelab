# Read-only user API token: Zone Analytics, Account Analytics, Account Settings and
# Firewall Services, all read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cloudflare-exporter
    creationPolicy: Owner
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: "c3b6360e-7a35-4d50-af89-b4f1012bc99a"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
