# OpenCost: reads usage from Prometheus and cluster objects from the API, serves its UI.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: opencost
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencost
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "9003"
              protocol: TCP
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEntities:
        - kube-apiserver
