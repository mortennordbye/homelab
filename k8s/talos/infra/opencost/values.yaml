fullnameOverride: opencost
namespaceOverride: monitoring

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

opencost:
  exporter:
    defaultClusterId: genesis
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Off: nothing here calls it, and it would be another open port.
  mcp:
    enabled: false

  metrics:
    serviceMonitor:
      enabled: true
      # The chart renders none otherwise, and Argo CD refuses a namespaced object without one.
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack
      # Talos nodes have no providerID, and OpenCost skips a node's price without this
      # label, which leaves idle cost at zero.
      metricRelabelings:
        # Spelled out: the API server defaults it, and Argo CD would see drift.
        - action: replace
          sourceLabels:
            - __name__
            - node
          regex: node_(cpu|ram|gpu|total)_hourly_cost;(.+)
          targetLabel: provider_id
          replacement: $2

  prometheus:
    internal:
      serviceName: prometheus-operated
      namespaceName: monitoring
      port: 9090

  ui:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # NOK per hour, from an estimated 100 W, not a measurement: docs/platform/observability/costs.md
  customPricing:
    enabled: true
    costModel:
      description: Electricity only, estimated at 100 W for the cluster
      currencyCode: NOK
      CPU: 0.00629
      spotCPU: 0.00629
      RAM: 0.00054
      spotRAM: 0.00054
      GPU: 0
      storage: 0
      zoneNetworkEgress: 0
      regionNetworkEgress: 0
      internetNetworkEgress: 0
