apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: backup-check
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # pbs-backup-check reads the Proxmox API on the three hosts.
    - toCIDR:
        - 10.3.10.12/32
        - 10.3.10.13/32
        - 10.3.10.14/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
