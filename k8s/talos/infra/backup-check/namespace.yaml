# baseline, not restricted: the jobs mount the NAS over NFS and read it as root. The
# k8s-backups export maps no other identity.
apiVersion: v1
kind: Namespace
metadata:
  name: backup-check
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "2"
