# Backups made outside the cluster only report failures, so a job that stops running
# stays silent. These checks fail when the newest backup is older than 26 h (and the PBS
# check also on a VM disk stuck as a pending delete), and BackupJobStale alerts on any
# *-backup-check that has not succeeded.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pbs-backup-check
spec:
  schedule: "0 9 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.13-alpine
              command:
                - python3
                - -c
                - |
                  import json, os, re, ssl, sys, time, urllib.parse, urllib.request

                  hosts = ["hyper1", "hyper2", "hyper3"]
                  # Mirrors exclude in terraform/proxmox/hyper-cluster/datacenter/backup.tf.
                  excluded = {1000}
                  ctx = ssl._create_unverified_context()
                  since = int(time.time()) - 26 * 3600

                  def get(path):
                      for host in hosts:
                          req = urllib.request.Request(
                              f"https://{host}.local.bigd.no:8006/api2/json{path}",
                              headers={"Authorization": "PVEAPIToken=" + os.environ["PVE_TOKEN"]},
                          )
                          try:
                              return json.load(urllib.request.urlopen(req, context=ctx, timeout=30))["data"]
                          except OSError as e:
                              print(f"{host}: {e}")
                      sys.exit("no Proxmox host answered")

                  # PVEAuditor cannot list the backups on the pbs storage, so read the vzdump
                  # task log instead: a guest counts once a task finished its backup.
                  done = set()
                  for node in get("/cluster/resources?type=node"):
                      if node["status"] != "online":
                          continue
                      n = node["node"]
                      for t in get(f"/nodes/{n}/tasks?typefilter=vzdump&source=all&since={since}&limit=100"):
                          if t.get("id") and t.get("status") == "OK":
                              done.add(int(t["id"]))
                          elif not t.get("id") and t.get("status"):
                              upid = urllib.parse.quote(t["upid"], safe="")
                              for line in get(f"/nodes/{n}/tasks/{upid}/log?limit=5000"):
                                  m = re.match(r"INFO: Finished Backup of VM (\d+)", line["t"])
                                  if m:
                                      done.add(int(m.group(1)))

                  guests = [g for g in get("/cluster/resources?type=vm")
                            if not g.get("template") and g["vmid"] not in excluded]
                  stale = [g for g in guests if g["vmid"] not in done]
                  for g in sorted(guests, key=lambda g: g["vmid"]):
                      print(f"{'STALE' if g in stale else 'ok   '} {g['vmid']} {g.get('name', '')}")

                  # A Proxmox-CSI detach that loses the config lock leaves the disk as a pending
                  # delete; every vzdump of that VM then fails with "drive-scsiN not found".
                  pending = [(g, x["key"]) for g in guests if g["type"] == "qemu"
                             for x in get(f"/nodes/{g['node']}/qemu/{g['vmid']}/pending")
                             if x.get("delete") and re.match(r"(scsi|virtio|sata)\d+$", x["key"])]
                  for g, key in pending:
                      print(f"PENDING {g['vmid']} {g.get('name', '')}: {key} is a pending delete; "
                            f"once QEMU no longer has it, run 'qm set {g['vmid']} --delete {key}' on {g['node']}")
                  sys.exit(1 if stale or pending else 0)
              envFrom:
                - secretRef:
                    name: pve-token
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ha-backup-check
spec:
  schedule: "0 9 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/alpine:3.24
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  ls -lt /backup/home-assistant | head -4
                  find /backup/home-assistant -maxdepth 1 -name '*.tar' -mmin -1560 | grep -q . \
                    || { echo "no Home Assistant backup newer than 26 h"; exit 1; }
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
          volumes:
            - name: backup
              nfs:
                server: nas.local.bigd.no
                path: /volume1/k8s-backups
                readOnly: true
