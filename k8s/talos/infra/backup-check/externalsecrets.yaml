# Token of prometheus@pve (PVEAuditor), stored as user@realm!token=secret, which is
# the form the PVEAPIToken header takes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: pve-token
    creationPolicy: Owner
  data:
    - secretKey: PVE_TOKEN
      remoteRef:
        key: "7dd0a0f2-efce-48dd-8b5f-b4d1014bbbce"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: restic-password
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: "9facc77a-55f0-4901-a05c-b4d101256b09"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
