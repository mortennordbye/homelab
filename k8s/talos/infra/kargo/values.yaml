# Kargo chart values. Admin credentials are NOT inlined here; the chart reads
# them from the pre-existing Secret named below (synced by ESO in
# kargo-api-secret.yaml), which must hold ADMIN_ACCOUNT_PASSWORD_HASH and
# ADMIN_ACCOUNT_TOKEN_SIGNING_KEY.
api:
  secret:
    name: kargo-api
  # Where the UI/API is actually reached. Kargo builds the "View in Kargo UI"
  # link in every promotion PR body from this host; unset it defaults to
  # `localhost` and the PR links point nowhere.
  host: kargo.local.bigd.no
  # The API is fronted by the Traefik private gateway, which terminates TLS for
  # *.local.bigd.no. Serve plain HTTP in-pod so the gateway can route to it
  # (kargo-api Service becomes port 80 instead of 443). terminatedUpstream forces
  # the generated URLs to https (the gateway serves https) even though the pod
  # itself listens on plain HTTP — it is the one tls.* field honoured when
  # enabled is false.
  tls:
    enabled: false
    terminatedUpstream: true
  # SSO via authentik. The admin account stays enabled (chart default) as
  # break-glass: an authentik outage must not lock us out of promotions.
  oidc:
    enabled: true
    # Trailing slash is load-bearing; it must match authentik's advertised
    # issuer exactly or OIDC discovery fails. The path segment is the
    # authentik application slug.
    issuerURL: https://auth.local.bigd.no/application/o/kargo/
    # Public PKCE client, so this is not a credential.
    clientID: kargo
    # Must be explicitly emptied. The chart default is ["groups"], and authentik
    # has no groups scope, so the default returns invalid_scope. openid, profile
    # and email are always sent regardless, and profile is what carries groups.
    additionalScopes: []
    usernameClaim: email
    admins:
      # Rendered onto the chart's kargo-admin ServiceAccount as
      # rbac.kargo.akuity.io/claims. kargo-admin is cluster-wide across every
      # Project, which is all a single-operator homelab needs.
      claims:
        groups:
          - kargo-admins
    dex:
      enabled: false

controller:
  argocd:
    # We reconcile via Argo CD selfHeal (no argocd-update step in the pilot),
    # but leaving the integration on lets Kargo surface Argo app health/sync
    # in its UI and keeps the door open for argocd-update later.
    integrationEnabled: true
    namespace: argocd
