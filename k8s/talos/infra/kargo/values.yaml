# Kargo chart values. Admin credentials are NOT inlined here. The chart reads
# them from the pre-existing Secret named below (ESO syncs it from
# kargo-api-secret.yaml). The Secret must hold ADMIN_ACCOUNT_PASSWORD_HASH and
# ADMIN_ACCOUNT_TOKEN_SIGNING_KEY.
global:
  # Container-level, applied to every Kargo workload. The image runs as uid 65532.
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

api:
  secret:
    name: kargo-api
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi
  # The host that serves the UI/API. Kargo builds the "View in Kargo UI"
  # link in every promotion PR body from this host. Unset, it defaults to
  # `localhost` and the PR links point nowhere.
  host: kargo.local.bigd.no
  # The Traefik private gateway proxies the API and terminates TLS for
  # *.local.bigd.no. Serve plain HTTP in-pod so the gateway can route to it
  # (kargo-api Service becomes port 80 instead of 443). terminatedUpstream forces
  # the generated URLs to https (the gateway serves https) even though the pod
  # itself listens on plain HTTP. It is the one tls.* field that applies when
  # enabled is false.
  tls:
    enabled: false
    terminatedUpstream: true
  # SSO via authentik. The admin account stays enabled (chart default) as an
  # emergency fallback: an authentik outage must not block promotions.
  oidc:
    enabled: true
    # The trailing slash is required. The value must match authentik's advertised
    # issuer exactly, or OIDC discovery fails. The path segment is the
    # authentik application slug.
    issuerURL: https://auth.local.bigd.no/application/o/kargo/
    # Public PKCE client, so this is not a credential.
    clientID: kargo
    # Must be explicitly emptied. The chart default is ["groups"], and authentik
    # has no groups scope, so the default returns invalid_scope. Kargo always sends
    # openid, profile and email, and profile carries groups.
    additionalScopes: []
    usernameClaim: email
    admins:
      # The chart renders this onto the kargo-admin ServiceAccount as
      # rbac.kargo.akuity.io/claims. kargo-admin is cluster-wide across every
      # Project, which is enough for a single-operator homelab.
      claims:
        groups:
          - kargo-admins
    dex:
      enabled: false

controller:
  resources:
    requests:
      cpu: 150m
      memory: 96Mi
    limits:
      memory: 384Mi
  reconcilers:
    warehouses:
      # Kargo polls at the GREATER of this floor and each Warehouse's own
      # spec.interval. The 5m0s chart default would override the 1m the Warehouses
      # declare.
      minReconciliationInterval: "1m0s"
  argocd:
    # Reconciliation is Argo CD selfHeal (no argocd-update step). The
    # integration only shows app health/sync in the Kargo UI.
    integrationEnabled: true
    namespace: argocd

managementController:
  resources:
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      memory: 256Mi

webhooksServer:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

externalWebhooksServer:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

garbageCollector:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi
