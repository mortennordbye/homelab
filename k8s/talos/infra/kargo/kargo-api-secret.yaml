# Admin credentials for the Kargo API server, referenced by values.yaml
# (api.secret.name: kargo-api). Create two Bitwarden Secrets Manager items and
# put their UUIDs below:
#   - a bcrypt hash of the admin password        -> ADMIN_ACCOUNT_PASSWORD_HASH
#     e.g.  htpasswd -bnBC 10 "" '<password>' | tr -d ':\n' | sed 's/$2y/$2a/'
#   - a random signing key (e.g. openssl rand -base64 48) -> ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-api
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: "c0e7dd57-f041-4679-a408-b489010bed58"
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: "72c98fb4-90e1-4af6-b80c-b489010c112e"
