# Argo Rollouts is installed only for its AnalysisTemplate / AnalysisRun CRDs
# and controller. Kargo uses them for Stage verification. We do not use the
# Rollout workload type itself, so the dashboard stays off.
dashboard:
  enabled: false

controller:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi
