apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_RPC_SECRET
      remoteRef:
        key: "bab2abdb-3810-4a2e-b4cf-b4f400f0e81c"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GARAGE_ADMIN_TOKEN
      remoteRef:
        key: "cfb94bac-1683-40d5-968d-b4f400f0e9a9"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
