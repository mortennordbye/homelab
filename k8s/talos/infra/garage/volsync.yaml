# Nightly restic backup of garage-data to the NAS backup share, which is snapshotted
# and copied offsite (docs/platform/backups/README.md). garage-meta is left out on
# purpose: a live LMDB copy can be torn, and its hourly snapshots live in garage-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-data-restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garage-data-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        RESTIC_REPOSITORY: /mnt/repo/garage/garage-data
        RESTIC_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "9facc77a-55f0-4901-a05c-b4d101256b09"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: garage-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: garage-data
  trigger:
    schedule: "50 1 * * *"
  restic:
    repository: garage-data-restic
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 14
      weekly: 8
      monthly: 6
    cacheStorageClassName: syno-nfs-csi
    cacheCapacity: 2Gi
    moverVolumes:
      - mountPath: repo
        volumeSource:
          nfs:
            server: nas.local.bigd.no
            path: /volume1/k8s-backups/volsync
