apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    # LMDB is unsafe on NFS, so the metadata stays on block storage and is
    # snapshotted onto the NAS volume next to the data it indexes.
    metadata_dir = "/var/lib/garage/meta"
    metadata_snapshots_dir = "/var/lib/garage/nas/meta-snapshots"
    metadata_auto_snapshot_interval = "1h"
    data_dir = "/var/lib/garage/nas/data"
    db_engine = "lmdb"

    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
