# Token of prometheus@pve (PVEAuditor), created by
# terraform/proxmox/hyper-cluster/datacenter/access.tf and stored in Bitwarden in the
# form user@realm!token=secret; the exporter wants only the part after "=".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: pve-exporter
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        pve.yml: |
          default:
            user: prometheus@pve
            token_name: exporter
            token_value: "{{ .token | splitList "=" | last }}"
            verify_ssl: false
  data:
    - secretKey: token
      remoteRef:
        key: "7dd0a0f2-efce-48dd-8b5f-b4d1014bbbce"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
