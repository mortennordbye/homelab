# Secret of the PBS token prometheus@pbs!exporter (role Audit on /), created by
# terraform/proxmox/BOOTSTRAP.md and granted by terraform/proxmox/pbs/access.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbs-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: pbs-exporter
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "f8f10a2e-7ba8-41cf-b048-b4f10139a481"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
