# Nothing connects in. The app only calls YouTube's lounge API and SponsorBlock.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: isponsorblocktv-policy
  namespace: isponsorblocktv
spec:
  endpointSelector:
    matchLabels:
      app: isponsorblocktv
  ingress:
    - fromEntities:
        - host
        - health
