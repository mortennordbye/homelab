# The app only reads config.json at runtime, so the whole file is rendered here and
# nothing needs a volume. isponsorblocktv-devices holds the paired devices as a JSON
# array; pairing is in docs/apps/isponsorblocktv/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isponsorblocktv-config
  namespace: isponsorblocktv
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: isponsorblocktv-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config.json: |
          {
            "devices": {{ .devices }},
            "skip_categories": ["sponsor", "selfpromo", "interaction"],
            "skip_count_tracking": true,
            "mute_ads": true,
            "skip_ads": true,
            "minimum_skip_length": 1,
            "auto_play": true,
            "join_name": "iSponsorBlockTV",
            "apikey": "",
            "channel_whitelist": [],
            "use_proxy": false
          }
  data:
    - secretKey: devices
      remoteRef:
        key: "808075d5-7448-4d15-b955-b4f300e23253"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
