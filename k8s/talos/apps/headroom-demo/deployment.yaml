apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom-demo
  namespace: headroom-demo
  labels:
    app: headroom-demo
spec:
  # Always on, unlike the private instance: linked from the blog, so no KEDA
  # scale-to-zero cold start for visitors.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: headroom-demo
  template:
    metadata:
      labels:
        app: headroom-demo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image starts as root to chown /data, then drops to uid 1000. Do NOT
      # add runAsUser — a non-root start removes the entrypoint's ability to chown.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headroom
          # Tag owned by kustomization.yaml (`images.newTag`), rewritten by the
          # Kargo `demo` Stage; this inline value is only a kubectl-apply fallback.
          image: ghcr.io/mortennordbye/headroom:sha-32a1389
          imagePullPolicy: IfNotPresent
          env:
            # Read-only public demo: the API refuses every write. See the
            # headroom repo's README, "Public demo mode".
            - name: DEMO_MODE
              value: "1"
            # Host-header allowlist (DNS-rebinding guard). The app 403s any host
            # not listed, which is also why the probes below send an explicit
            # Host header instead of hitting the pod IP.
            - name: ALLOWED_HOSTS
              value: "headroom.nordbye.it,localhost,127.0.0.1"
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            # SQLite needs a writable dir; ephemeral on purpose so every restart
            # starts clean.
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: headroom.nordbye.it }]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: headroom.nordbye.it }]
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
