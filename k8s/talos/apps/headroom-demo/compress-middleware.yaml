apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headroom-demo-compress
  namespace: headroom-demo
spec:
  # The app has a ~3.4 MB precached PWA shell (JS/CSS), and Express serves it
  # uncompressed, so the edge owns compression. Same shape as portfolio-compress:
  # brotli first (smallest for JS/HTML), limited to compressible text, so fonts
  # and images are not compressed a second time.
  compress:
    encodings:
      - br
      - zstd
      - gzip
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/javascript
      - application/javascript
      - application/json
      - application/manifest+json
      - image/svg+xml
