apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: headroom-demo-policy
  namespace: headroom-demo
spec:
  endpointSelector:
    matchLabels:
      app: headroom-demo
  ingress:
    # Only Traefik may reach the pod. No KEDA interceptor rule here (unlike the
    # private headroom): this app never scales to zero, so traffic goes straight
    # from the gateway to the service.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    # kubelet probes.
    - fromEntities:
        - host
        - health
  # Egress allowlisted (deny-by-default) because this pod is internet-reachable.
  # api.enablebanking.com is deliberately absent: the demo can never reach a
  # bank even if the demo-mode gate regressed.
  egress:
    # DNS to CoreDNS. Required for the toFQDNs rules below to resolve.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
    # Public statistics the app proxies: SSB and Norges Bank.
    - toFQDNs:
        - matchName: "data.ssb.no"
        - matchName: "data.norges-bank.no"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
