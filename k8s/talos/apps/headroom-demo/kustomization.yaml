apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
resources:
- namespace.yaml
- deployment.yaml
- httproute.yaml
- cloudflare-only-middleware.yaml
- compress-middleware.yaml
- service.yaml
- ciliumnetworkpolicy.yaml
# Public read-only demo of headroom (DEMO_MODE=1, see deployment.yaml).
# Kargo owns newTag: the headroom-cd `demo` Stage rewrites it and pushes
# to main. Do not edit it by hand.
images:
- name: ghcr.io/mortennordbye/headroom
  newTag: 0.0.1024
