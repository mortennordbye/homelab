apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      # Best-effort spread across hypervisors (zones) so a single host loss
      # can't take a disproportionate share of replicas. Soft, so rollouts and
      # constrained scheduling never block.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: portfolio
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # fsGroup chowns the nginx-cache emptyDir to gid 101 so the
        # unprivileged nginx user can write its pid + temp paths under
        # /var/cache/nginx (the only writable path under readOnlyRootFilesystem).
        fsGroup: 101
      containers:
        - name: portfolio
          image: ghcr.io/mortennordbye/homelab/portfolio:f28dc39
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # Live cluster status written by the status-publisher CronJob.
            # Served at /status.json; optional so pods start without it.
            - name: status
              mountPath: /usr/share/nginx/html/status
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: nordbye.it }]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: nordbye.it }]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir:
            medium: Memory
        - name: status
          configMap:
            name: portfolio-status
            optional: true
