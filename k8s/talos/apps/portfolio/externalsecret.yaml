# API key that gates the portfolio API's write endpoints (reads stay public).
# Create a Bitwarden Secrets Manager item holding the key and put its UUID
# below. Until then the Deployment's secretKeyRef is `optional: true`, so pods
# run and reads serve normally — only writes refuse (401).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-api
  namespace: portfolio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: portfolio-api
    creationPolicy: Owner
  data:
    - secretKey: PORTFOLIO_API_KEY
      remoteRef:
        key: "575eaaa2-fdd9-4e6f-9556-b48b00f8f98f"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
