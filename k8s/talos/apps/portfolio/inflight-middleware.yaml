apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-inflight
  namespace: portfolio
spec:
  # Concurrency cap alongside the rate limit: a slow reader holds connections
  # open without exceeding a per-second rate. sourceCriterion must stay explicit
  # — inFlightReq defaults to keying on requestHost, which would cap the whole
  # site at 60 concurrent rather than 60 per client.
  inFlightReq:
    amount: 60
    sourceCriterion:
      ipStrategy:
        depth: 1
