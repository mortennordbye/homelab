apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Startup copies the frontend's assets into static/, which is root-owned in
      # the image; seed a writable copy so the copy succeeds and nothing is lost.
      initContainers:
        - name: seed-static
          image: ghcr.io/open-webui/open-webui:v0.10.2
          command:
            - cp
            - -r
            - /app/backend/open_webui/static/.
            - /static/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: static
              mountPath: /static
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              # Routed through the KEDA HTTP interceptor (via the ollama-wake
              # ExternalName) so ollama wakes from zero on demand.
              value: "http://ollama-wake:8080"
            - name: WEBUI_AUTH
              value: "true"
            # The default key file sits in the root-owned app dir, and would not
            # survive a restart anyway.
            - name: WEBUI_SECRET_KEY_FILE
              value: /app/backend/data/.webui_secret_key
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: static
              mountPath: /app/backend/open_webui/static
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: static
          emptyDir: {}
