apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: innestemme-secret
  namespace: innestemme
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: innestemme-secret
    creationPolicy: Owner
  data:
    # Long-lived Home Assistant token named ai-voice.
    - secretKey: HA_TOKEN
      remoteRef:
        key: "80285e71-47d5-4bd4-bd77-b4d4011f2634"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # The Voice PE's Noise key (base64), set by Home Assistant when the device was added.
    - secretKey: VOICE_SATELLITE_KEY
      remoteRef:
        key: "5d63b3e4-7054-4f82-b5e2-b4d4011f268c"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: VOICE_ADDRESS
      remoteRef:
        key: "c13fb237-5151-48ab-818c-b4d4011f26d7"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
