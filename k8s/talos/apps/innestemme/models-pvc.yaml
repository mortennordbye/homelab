# Hugging Face cache (Parakeet, Whisper, Pocket TTS) and the speech cache. The engine downloads and renders
# them again on an empty volume, so they are not backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: innestemme
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: syno-nfs-csi
  resources:
    requests:
      storage: 4Gi
