# voice-engine settings; every key is a `voice-engine --help` option. Secrets and the street address
# come from innestemme-secret as environment variables, which win over this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: innestemme-config
  namespace: innestemme
data:
  config.yaml: |
    processor: assistant
    # The satellite bridge opens its session on this port from inside the pod; nothing else uses it.
    bind: 127.0.0.1:7000
    metrics-bind: 0.0.0.0:9090
    # A page with everything the assistant understands, on the same port: http://10.3.10.99:9090/
    web: true
    # Match the CPU limit in deployment.yaml.
    threads: 6
    wake-name: Jarvis
    # English answers in a butler's words: "As you wish, sir."
    honorific: sir
    home: Oslo
    norwegian: false
    # English speech from Kokoro inside the engine (sherpa-onnx, the f32 v1.0 model in /models/hub).
    # Fixed sentences are rendered ahead and kept, in a folder of its own (kokoro-onnx-am_onyx), so
    # only sentences with live data are synthesized.
    english-tts: kokoro-onnx
    speech-cache: /models/speech-cache
    kokoro-voice: am_onyx
    # Parakeet TDT 0.6B (English only): about 8x faster than whisper-base on a CPU and more accurate on
    # the Voice PE's recordings (innestemme docs/benchmarks.md).
    listener: parakeet
    ha-url: http://home-assistant.home-assistant.svc.cluster.local:8123
    speaker: Living Room
    # "I'm home" / "daddy's home": these lights at any time, and Liked Songs.
    home-room: Living Room
    home-music: liked
    # The kitchen's Hue plug feeds a bench light with a touch sensor: whatever turns the plug off cuts
    # the power for a few seconds and turns it back on, so the light is off and its sensor still works.
    power-cycle: [light.kjokken]
    # "Initiate lockdown": the music's volume while it lasts, or louder if it already was; "stand down"
    # puts the old one back.
    lockdown-volume: 100
    # Shopping list items under their Norwegian names; an item said by itself after an add is heard
    # again by Whisper small in Norwegian (about 380 MB in /models/hub, about 0.5 GB of memory).
    norwegian-groceries: true
    # "Party mode": every Hue light follows the music through the bridge's Entertainment API.
    hue-bridge: 10.3.10.16
    # No llm-url: rules only. Requests they do not understand get the short fallback at once.
    # The living room Voice PE; its Assist satellite entity is disabled in Home Assistant.
    satellite: 10.3.20.67:6053
    # The engine sets these on the device: Home Assistant's wake word selects go through the disabled
    # Assist satellite entity and never reach it.
    satellite-wake-words: [Hey Jarvis]
    # The wake word is detected here (openWakeWord, downloaded to /models on first start) on the
    # device's continuous stream: the innestemme firmware with "Wake word in innestemme" on. The
    # device's own Hey Jarvis model scored a real voice at 0.84-0.86 against its 0.83 cutoff; this
    # one scores it at 0.9-0.99. 0.65 keeps the TV out (it reached 0.67 once).
    wake-model: hey_jarvis
    wake-threshold: 0.65
    # The device fetches spoken answers here: the VIP in service.yaml, opened for it in
    # terraform/unifi/network/firewall.tf.
    public-url: http://10.3.10.99:9090
    # "Show the weather on the TV" opens this in the LG's browser through Home Assistant's webOS
    # integration. The TV reaches it over HTTPS through Traefik (terraform/unifi/network/firewall.tf).
    screen-url: https://jarvis.local.bigd.no/tv
    # The living room Sonos speaks the answers; the Voice PE only listens.
    answer-player: media_player.living_room
    # With the wake word detected in the engine, louder answers no longer deafen the device's detector.
    answer-volume: 0.50
    # Requests no skill handled, for what to build next; also listed on the web page.
    unhandled-log: /models/unhandled.jsonl
