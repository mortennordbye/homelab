apiVersion: apps/v1
kind: Deployment
metadata:
  name: verksted-app
  namespace: verksted
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Recreate: RWO PVC, two pods can't both mount /data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verksted-app
  template:
    metadata:
      labels:
        app: verksted-app
    spec:
      # The projected token is what agent sessions run kubectl with; see rbac.yaml.
      serviceAccountName: verksted
      containers:
        - name: verksted
          image: ghcr.io/mortennordbye/verksted:0.0.7
          ports:
            - name: http
              containerPort: 8080
          env:
            # dind sidecar over the pod-local network; plain tcp, no TLS.
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            # Deep-link base for ntfy pushes back into a waiting session.
            - name: PUBLIC_URL
              value: https://verksted.local.bigd.no
            # Persist settings on the PVC (agent env vars set via the UI).
            - name: SETTINGS_FILE
              value: /data/settings.json
            # Deliberately off the PVC it backs up; /mnt/backups is the NAS
            # share, which has its own backups.
            - name: VK_BACKUP_DIR
              value: /mnt/backups
          # Ready means serving the SPA at /. timeoutSeconds above the 1s
          # default: a failed readiness check pulls the pod from the Service,
          # which drops every open terminal websocket.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Deliberately hard to trip: a restart kills the tmux server and every
          # agent session. /api/health is a constant with no disk behind it, and
          # the long window keeps NFS stalls and CPU throttling from firing it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Sized for agent sessions (CLIs, headless chromium, dev servers);
          # the 12Gi limit has to clear the reelsmith nightly render peak.
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "6"
              memory: 12Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # The half of reelsmith that is not in git (editorial profile, voice
            # reference, history stores) — not reconstructible, so it lives on
            # the NAS, not the PVC. subPath scopes to this folder only.
            - name: shared-data
              mountPath: /mnt/reelsmith
              subPath: media/reelsmith
            # Nightly volume export target, off the PVC on purpose; subPath
            # scopes to this folder only.
            - name: shared-data
              mountPath: /mnt/backups
              subPath: backups/verksted
        # Docker daemon for the agent sessions. Privileged is inherent to dind;
        # shares the pod netns so the app reaches it at localhost:2375.
        - name: dind
          image: docker:29-dind
          # No explicit --host: with TLS off dind already binds tcp://0.0.0.0:2375,
          # and adding -H on 2375 makes two listeners and a crash-loop. The
          # CiliumNetworkPolicy blocks 2375 from other pods.
          env:
            # Plain tcp on 2375, pod-local only — no TLS cert dance.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # Kept off NFS: overlayfs needs local disk. maintenance.ts prunes it daily.
            - name: dind-storage
              mountPath: /var/lib/docker
            # Same PVC at the same path: bind mounts resolve in the daemon's own
            # filesystem, so without this `docker compose up` under /data mounts
            # an empty directory over its source.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verksted-data
        - name: shared-data
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data
            readOnly: false
        - name: dind-storage
          emptyDir: {}
