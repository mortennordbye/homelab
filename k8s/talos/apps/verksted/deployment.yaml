apiVersion: apps/v1
kind: Deployment
metadata:
  name: verksted-app
  namespace: verksted
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Single stateful pod on a ReadWriteOnce PVC: never run two at once (the second
  # could not mount /data), so replace rather than roll.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verksted-app
  template:
    metadata:
      labels:
        app: verksted-app
    spec:
      containers:
        - name: verksted
          image: ghcr.io/mortennordbye/verksted:0.0.7
          ports:
            - name: http
              containerPort: 8080
          env:
            # Agent sessions run docker against the dind sidecar over the shared
            # pod network (plain tcp, no TLS — pod-local only).
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            # Deep-link base for ntfy pushes back into a waiting session.
            - name: PUBLIC_URL
              value: https://verksted.local.bigd.no
            # Persist settings on the PVC (agent env vars set via the UI).
            - name: SETTINGS_FILE
              value: /data/settings.json
          # The backend serves the built SPA at / — a plain 200 once it is up.
          # Agent auth (claude/codex/agy tokens) is configured interactively in
          # the pod terminal afterwards and persists under HOME=/data/home.
          # Stays on / — serving the SPA is what "ready" means here. The timeout
          # matters as much as the liveness one though: a failed readiness probe
          # pulls the pod out of the Service, which drops every open terminal
          # websocket. The default 1s was well inside normal NFS jitter.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Deliberately hard to trip: a restart kills the tmux server and with
          # it every running agent session, so this must fire only for a backend
          # that is genuinely wedged — never for one that is merely slow. Hence
          # /api/health (a constant, no disk behind it, unlike / which reads
          # index.html through the same libuv threadpool as the NFS volume), a
          # timeout above the default 1s, and 3 minutes of failures before the
          # kill. CPU throttling and NFS stalls both used to fit inside the old
          # ~40s window.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Sized to what a working pod actually holds: agent CLIs, headless
          # chromium per session, and whatever dev servers the agents start add
          # up to several GiB. The old 512Mi request left the pod many times
          # over its request and first in line for eviction; the old 2-core
          # limit had it CFS-throttled ~7% of all scheduling periods, which is
          # what stalled the health check.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
        # Docker daemon for the agent sessions. Privileged is inherent to dind;
        # shares the pod netns so the app reaches it at localhost:2375.
        - name: dind
          image: docker:28-dind
          # No explicit --host: with TLS off the dind entrypoint already binds a
          # single tcp://0.0.0.0:2375 listener. Adding our own -H on 2375 made two
          # listeners on the same port and dind crash-looped ("port is already
          # allocated"). 0.0.0.0 is safe here — the CiliumNetworkPolicy blocks
          # 2375 from other pods, and the app reaches it over loopback.
          env:
            # Plain tcp on 2375, pod-local only — no TLS cert dance.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # Ephemeral image/layer store; rebuilt after a restart. maintenance.ts
            # prunes it daily. Kept off the NFS PVC (overlayfs needs local disk).
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verksted-data
        - name: dind-storage
          emptyDir: {}
