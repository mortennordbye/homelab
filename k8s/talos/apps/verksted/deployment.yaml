apiVersion: apps/v1
kind: Deployment
metadata:
  name: verksted-app
  namespace: verksted
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Recreate: RWO PVC, two pods can't both mount /data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verksted-app
  template:
    metadata:
      labels:
        app: verksted-app
    spec:
      # Agent sessions run kubectl with the projected token; see rbac.yaml.
      serviceAccountName: verksted
      containers:
        - name: verksted
          image: ghcr.io/mortennordbye/verksted:0.0.7
          ports:
            - name: http
              containerPort: 8080
          env:
            # dind sidecar over the pod-local network; plain tcp, no TLS.
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            # Deep-link base for ntfy pushes back into a waiting session.
            - name: PUBLIC_URL
              value: https://verksted.local.bigd.no
            # Persist settings on the PVC (agent env vars set via the UI).
            - name: SETTINGS_FILE
              value: /data/settings.json
            # Kept off the PVC it backs up: /mnt/backups is the NAS
            # share, which has its own backups.
            - name: VK_BACKUP_DIR
              value: /mnt/backups
            # The documents the assistant may read: the whole NAS share, mounted
            # read-only below. The assistant writes the text it extracts to the
            # PVC (DOCS_INDEX_DIR), never to the share.
            - name: DOCS_DIR
              value: /mnt/shared
            # VK_AGENT_USER=vk-agent is off: the Synology share refuses uid
            # 1001 regardless of the file modes (root is not squashed, so root
            # works). The share must grant that uid first. uid 1001 already
            # owns the repos and HOME from the one boot it was on.
          # Ready means tmux answers and the sessions directory accepts a write.
          # Liveness stays on /api/health, since a restart ends every session
          # and does not fix either. timeoutSeconds is above the 1s default: a
          # failed readiness check removes the pod from the Service, which drops
          # every open terminal websocket.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Delays the liveness probe until the server first answers. The
          # boot that turns VK_AGENT_USER on chowns every repo on NFS before it
          # listens. That takes minutes, and the liveness window alone killed
          # it before it finished, on every attempt. 30 minutes for that one boot.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          # Hard to fail by design: a restart kills the tmux server and every
          # agent session. /api/health is a constant with no disk behind it, and
          # the long window stops NFS stalls and CPU throttling from failing it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Sized for agent sessions (CLIs, headless chromium, dev servers).
          # The limit must be above the reelsmith nightly render peak.
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "6"
              memory: 10Gi
          # Still root: the backend starts every agent process as vk-agent,
          # which needs root. It may not gain more privileges than it has.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            # The half of reelsmith that is not in git (editorial profile, voice
            # reference, history stores). It cannot be rebuilt, so it is on
            # the NAS, not the PVC. subPath limits the mount to this folder.
            - name: shared-data
              mountPath: /mnt/reelsmith
              subPath: media/reelsmith
            # Nightly volume export target, kept off the PVC. subPath
            # limits the mount to this folder.
            - name: shared-data
              mountPath: /mnt/backups
              subPath: backups/verksted
            # The same share again, whole and read-only, for reading documents.
            # readOnly is on the mount, not the volume, because the two
            # mounts above still write. The kernel enforces it, so a delete
            # under here fails with EROFS whatever an agent session tries. The
            # container is unprivileged and cannot remount it, and dind does
            # not mount it at all, so nothing in the pod can write to the share
            # through this path.
            - name: shared-data
              mountPath: /mnt/shared
              readOnly: true
        # Docker daemon for the agent sessions. dind needs privileged. It
        # shares the pod netns, so the app reaches it at localhost:2375.
        - name: dind
          image: docker:29-dind
          # No explicit --host: with TLS off dind already binds tcp://0.0.0.0:2375,
          # and adding -H on 2375 makes two listeners and a crash-loop. The
          # CiliumNetworkPolicy blocks 2375 from other pods.
          env:
            # Plain tcp on 2375, pod-local only; no TLS certificates.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            # Kept off NFS: overlayfs needs local disk. maintenance.ts prunes it daily.
            - name: dind-storage
              mountPath: /var/lib/docker
            # Same PVC at the same path: bind mounts resolve in the daemon's own
            # filesystem, so without this `docker compose up` under /data mounts
            # an empty directory over its source.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verksted-data
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
        - name: dind-storage
          emptyDir: {}
