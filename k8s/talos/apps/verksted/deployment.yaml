apiVersion: apps/v1
kind: Deployment
metadata:
  name: verksted-app
  namespace: verksted
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Single stateful pod on a ReadWriteOnce PVC: never run two at once (the second
  # could not mount /data), so replace rather than roll.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verksted-app
  template:
    metadata:
      labels:
        app: verksted-app
    spec:
      # Not the namespace default: the token projected into this pod is what
      # kubectl in an agent session authenticates with, so the account it names
      # is the whole access boundary. See rbac.yaml.
      serviceAccountName: verksted
      containers:
        - name: verksted
          image: ghcr.io/mortennordbye/verksted:0.0.7
          ports:
            - name: http
              containerPort: 8080
          env:
            # Agent sessions run docker against the dind sidecar over the shared
            # pod network (plain tcp, no TLS — pod-local only).
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            # Deep-link base for ntfy pushes back into a waiting session.
            - name: PUBLIC_URL
              value: https://verksted.local.bigd.no
            # Persist settings on the PVC (agent env vars set via the UI).
            - name: SETTINGS_FILE
              value: /data/settings.json
            # Deliberately not on the PVC. `vk backup` tars the whole volume —
            # settings, agent OAuth state, sessions, memory and every repo — and
            # an export kept on the volume it exists to replace only covers a
            # bad restore, not losing the share. This is the NAS share, which
            # gets backed up. The settings page flags it if it ever points back
            # at /data.
            - name: VK_BACKUP_DIR
              value: /mnt/backups
          # The backend serves the built SPA at / — a plain 200 once it is up.
          # Agent auth (claude/codex/agy tokens) is configured interactively in
          # the pod terminal afterwards and persists under HOME=/data/home.
          # Stays on / — serving the SPA is what "ready" means here. The timeout
          # matters as much as the liveness one though: a failed readiness probe
          # pulls the pod out of the Service, which drops every open terminal
          # websocket. The default 1s was well inside normal NFS jitter.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Deliberately hard to trip: a restart kills the tmux server and with
          # it every running agent session, so this must fire only for a backend
          # that is genuinely wedged — never for one that is merely slow. Hence
          # /api/health (a constant, no disk behind it, unlike / which reads
          # index.html through the same libuv threadpool as the NFS volume), a
          # timeout above the default 1s, and 3 minutes of failures before the
          # kill. CPU throttling and NFS stalls both used to fit inside the old
          # ~40s window.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Sized to what a working pod actually holds: agent CLIs, headless
          # chromium per session, and whatever dev servers the agents start add
          # up to several GiB. The old 512Mi request left the pod many times
          # over its request and first in line for eviction; the old 2-core
          # limit had it CFS-throttled ~7% of all scheduling periods, which is
          # what stalled the health check.
          #
          # 8Gi was still not enough for the reelsmith nightly. Chatterbox holds
          # about 4.4Gi while it speaks, on top of a session baseline that
          # climbs from ~3Gi to ~4.4Gi across a batch, so video two peaked at
          # 7.55Gi and video three went over: OOMKilled 2026-08-14 02:33, which
          # took the batch, the session and its log with it. Because the
          # baseline only grows through a run, the later a video sits in the
          # batch the likelier it is to be the one that dies, and the 7d peak
          # had touched 7.9Gi twice before it finally did. 12Gi leaves about
          # 3Gi over the worst observed peak; the request goes to 6Gi so the
          # scheduler is told something closer to the truth than 4Gi.
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "6"
              memory: 12Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # The half of reelsmith that is not in git: the editorial profile,
            # the voice reference recording, and the cooldown and star history
            # stores. Kept off the PVC so the workbench can be rebuilt without
            # taking the account's identity with it, and so the NAS backs it up
            # — the voice recording exists nowhere else and is not
            # reconstructible. subPath, like audiobookshelf, so the container
            # sees only this folder rather than the whole media share.
            - name: shared-data
              mountPath: /mnt/reelsmith
              subPath: media/reelsmith
            # Where the nightly volume export lands, off the PVC on purpose.
            # subPath again, so the container sees only this folder rather than
            # the whole share.
            - name: shared-data
              mountPath: /mnt/backups
              subPath: backups/verksted
        # Docker daemon for the agent sessions. Privileged is inherent to dind;
        # shares the pod netns so the app reaches it at localhost:2375.
        - name: dind
          image: docker:29-dind
          # No explicit --host: with TLS off the dind entrypoint already binds a
          # single tcp://0.0.0.0:2375 listener. Adding our own -H on 2375 made two
          # listeners on the same port and dind crash-looped ("port is already
          # allocated"). 0.0.0.0 is safe here — the CiliumNetworkPolicy blocks
          # 2375 from other pods, and the app reaches it over loopback.
          env:
            # Plain tcp on 2375, pod-local only — no TLS cert dance.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # Ephemeral image/layer store; rebuilt after a restart. maintenance.ts
            # prunes it daily. Kept off the NFS PVC (overlayfs needs local disk).
            - name: dind-storage
              mountPath: /var/lib/docker
            # The same PVC the app has, at the same path. A bind mount is
            # resolved by the daemon in its own filesystem, so without this a
            # session running `docker compose up` in /data/repos/<project> gets
            # an empty directory mounted over its source — and docker creates
            # the missing path rather than failing, so nothing says why.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verksted-data
        - name: shared-data
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data
            readOnly: false
        - name: dind-storage
          emptyDir: {}
