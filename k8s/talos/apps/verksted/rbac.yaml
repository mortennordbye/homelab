# Cluster read access for the agent sessions in this pod. Think blast radius
# before widening: the token is inherited by every LLM-driven shell session.
# Reads are cluster-wide; the single write verb is `create` on Kargo Promotions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verksted
  namespace: verksted
---
# Builtin `view` excludes Secrets, which is what makes it safe to bind
# cluster-wide. The ClusterRole below adds only what `view` does not reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verksted-agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: verksted
    namespace: verksted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: verksted-agent
rules:
  # Cluster-scoped diagnosis.
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  # kubectl top.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # Argo CD and Argo Rollouts.
  - apiGroups: ["argoproj.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kargo: Warehouses, Freight, Stages, Promotions.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # The one write: re-promoting older Freight. The deploy gate stays the
  # promotion PR merge.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verksted-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: verksted-agent
subjects:
  - kind: ServiceAccount
    name: verksted
    namespace: verksted
