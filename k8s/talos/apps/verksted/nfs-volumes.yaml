# Static NFS claims: the restricted Pod Security standard forbids inline nfs volumes.
# Retain, so deleting a claim never touches the folder on the NAS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: verksted-shared-data
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: verksted
    name: shared-data
  nfs:
    server: nas.local.bigd.no
    path: /volume1/shared-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
  namespace: verksted
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: verksted-shared-data
  resources:
    requests:
      storage: 1Ti
