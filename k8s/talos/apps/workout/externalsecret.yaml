apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workout-secret
  namespace: workout
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: workout-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "fbae7327-2f9c-4881-91cb-b421013834f8"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: "5f016738-76c5-414b-9aa1-b42200a17f2e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: "996ed837-7adf-4e13-b929-b42200a1aeb0"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: "9c280f50-f4b6-44b9-b9c4-b42200a1ceea"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_NAME
      remoteRef:
        key: "37af512a-c74e-4693-a17e-b42200a1fb55"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
