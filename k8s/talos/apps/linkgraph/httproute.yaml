# Private gateway only: LAN and Tailscale. The app has no login, so it must never get a route on
# the public gateway. It serves contacts and private messages to anyone who can open the page.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkgraph
  namespace: linkgraph
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - linkgraph.local.bigd.no
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: linkgraph-service
          port: 8080
          weight: 1
