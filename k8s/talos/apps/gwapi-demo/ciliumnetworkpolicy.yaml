apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: gwapi-demo-policy
  namespace: gwapi-demo
spec:
  # Applies to both whoami versions (shared "whoami" prefix would not match,
  # so select each app label explicitly via matchExpressions).
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["whoami-v1", "whoami-v2"]
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - health
