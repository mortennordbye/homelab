apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-header
  namespace: gwapi-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "gwapi-header.bigd.no"
  rules:
    # Rule 1: requests carrying "x-canary: true" go to v2.
    # A header match is more specific than the catch-all below, so it wins.
    - matches:
        - headers:
            - name: x-canary
              type: Exact
              value: "true"
          path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-v2
          port: 8080
          weight: 1
    # Rule 2: everyone else stays on v1.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-v1
          port: 8080
          weight: 1
