apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-v2
  namespace: gwapi-demo
  labels:
    app: whoami-v2
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: whoami-v2
  template:
    metadata:
      labels:
        app: whoami-v2
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          imagePullPolicy: IfNotPresent
          env:
            - { name: WHOAMI_NAME, value: "v2" }
            - { name: WHOAMI_PORT_NUMBER, value: "8080" }
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 15
            failureThreshold: 3
