apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-weighted
  namespace: gwapi-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "gwapi-demo.bigd.no"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Weighted canary — 90% v1, 10% v2. To shift the rollout, change these two
      # numbers and push: ArgoCD applies it and selfHeal keeps it there. GitOps,
      # not imperative kubectl patches.
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-v1
          port: 8080
          weight: 90
        - group: ""
          kind: Service
          name: whoami-v2
          port: 8080
          weight: 10
