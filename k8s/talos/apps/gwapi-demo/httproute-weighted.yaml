apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-weighted
  namespace: gwapi-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "gwapi-demo.bigd.no"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Weighted canary. Committed stable state is 100/0 (all v1).
      # demo.sh patches these weights live to show traffic shifting.
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-v1
          port: 8080
          weight: 100
        - group: ""
          kind: Service
          name: whoami-v2
          port: 8080
          weight: 0
