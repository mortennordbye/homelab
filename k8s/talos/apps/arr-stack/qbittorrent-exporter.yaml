apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-exporter-creds
  namespace: arr-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: qbittorrent-exporter-creds
    creationPolicy: Owner
  data:
    - secretKey: QBITTORRENT_USER
      remoteRef:
        key: 7d9a94e9-a067-4302-bda0-b3c40101aa9d
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: QBITTORRENT_PASS
      remoteRef:
        key: b4b0041d-0e5a-4358-825b-b3c40101c3e3
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-exporter
  namespace: arr-stack
  labels:
    app: qbittorrent-exporter
spec:
  selector:
    app: qbittorrent-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
  namespace: arr-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-exporter
  template:
    metadata:
      labels:
        app: qbittorrent-exporter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hyper1
      containers:
        - name: exporter
          image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:v1.7.0
          env:
            - name: QBITTORRENT_HOST
              value: "qbittorrent.gluetun-vpn"
            - name: QBITTORRENT_PORT
              value: "8080"
            - name: EXPORTER_PORT
              value: "8000"
            - name: QBITTORRENT_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-exporter-creds
                  key: QBITTORRENT_USER
            - name: QBITTORRENT_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-exporter-creds
                  key: QBITTORRENT_PASS
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qbittorrent-exporter
  namespace: arr-stack
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: qbittorrent-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
