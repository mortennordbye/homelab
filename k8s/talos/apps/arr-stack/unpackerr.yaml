apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-api-keys
  namespace: arr-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: unpackerr-api-keys
    creationPolicy: Owner
  data:
    - secretKey: UN_SONARR_0_API_KEY
      remoteRef:
        key: 0350d8a3-05eb-4201-859a-b3c200a15fc4
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: UN_RADARR_0_API_KEY
      remoteRef:
        key: 453e06b8-66bc-4d5b-94ac-b3c200a12c85
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hyper1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: unpackerr
          image: ghcr.io/unpackerr/unpackerr:0.15.2
          env:
            - name: TZ
              value: "Europe/Oslo"
            - name: UN_SONARR_0_URL
              value: "http://sonarr:8989"
            - name: UN_SONARR_0_PATHS_0
              value: "/torrents"
            - name: UN_SONARR_0_PATHS_1
              value: "/downloads"
            - name: UN_RADARR_0_URL
              value: "http://radarr:7878"
            - name: UN_RADARR_0_PATHS_0
              value: "/torrents"
            - name: UN_RADARR_0_PATHS_1
              value: "/downloads"
          envFrom:
            - secretRef:
                name: unpackerr-api-keys
          volumeMounts:
            - name: torrents
              mountPath: /torrents
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: torrents
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/torrents
        - name: downloads
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/torrents/completed
