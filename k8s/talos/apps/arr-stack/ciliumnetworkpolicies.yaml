apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: bazarr-policy
  namespace: arr-stack
spec:
  endpointSelector:
    matchLabels:
      app: bazarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
    - fromEntities:
        - host
        - health
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: flaresolverr-policy
  namespace: arr-stack
spec:
  endpointSelector:
    matchLabels:
      app: flaresolverr
  ingress:
    # Reached by *arr apps inside this namespace and by Prowlarr in gluetun-vpn.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": arr-stack
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": gluetun-vpn
      toPorts:
        - ports:
            - port: "8191"
              protocol: TCP
    - fromEntities:
        - host
        - health
---
