apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-config
  namespace: arr-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: arr-stack
spec:
  selector:
    app: tdarr
  ports:
    - name: http
      port: 8265
      targetPort: 8265
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:2.90.01
          ports:
            - containerPort: 8265
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK_SET
              value: "002"
            - name: TZ
              value: "Europe/Oslo"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: ffmpegVersion
              value: "7"
            - name: nodeName
              value: "genesis-worker-01"
            - name: auth
              value: "false"
            - name: openBrowser
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /app/server
              subPath: server
            - name: config
              mountPath: /app/configs
              subPath: configs
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              gpu.intel.com/i915: "1"
            limits:
              cpu: "4"
              memory: 4Gi
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet:
              path: /api/v2/status
              port: 8265
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v2/status
              port: 8265
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config
        - name: data
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media
