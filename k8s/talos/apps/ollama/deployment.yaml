apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # No surge: the node has no memory for a second pod with the model loaded.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hyper3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:0.40.16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # The image's HOME is /root, which uid 1000 cannot enter.
            - name: HOME
              value: /home/ollama
          volumeMounts:
            - name: models
              mountPath: /home/ollama/.ollama
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          # A cold load from NFS takes minutes, longer than innestemme waits for an answer.
          # The model name must match innestemme's chat-model.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - until ollama list >/dev/null 2>&1; do sleep 1; done; ollama run gemma4:e2b-it-qat hi </dev/null >/dev/null 2>&1 || true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ollama ps | grep -q gemma4:e2b-it-qat
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
