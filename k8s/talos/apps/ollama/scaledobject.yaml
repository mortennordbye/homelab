apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama
  namespace: ollama
spec:
  scaleTargetRef:
    name: ollama
  # Always up: innestemme's open talk reaches the service directly, which wakes nothing, and a
  # cold start takes over a minute.
  minReplicaCount: 1
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: ollama
