<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bigd.no</title>
  <meta name="description" content="Something BIG D is happening.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #0b1f3a 0%, #16345e 60%, #1d4ed8 140%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    main { padding: 24px; }
    h1 {
      font-size: clamp(4rem, 16vw, 11rem);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
    }
    h1 span { color: #60a5fa; }
    p {
      margin-top: 28px;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #c7d4ec;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }
    #timer {
      margin-top: 48px;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }
    small { display: block; margin-top: 40px; font-size: .8rem; color: #8fa3c4; }
    .founder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 3px solid rgba(255,255,255,.3);
      margin-top: 36px;
    }
    .founder-name { margin-top: 10px; font-size: .85rem; color: #8fa3c4; }
  </style>
</head>
<body>
<main>
  <h1>big<span>d</span>.no</h1>
  <img class="founder" src="https://i.imgur.com/DdFZF5mh.jpg" alt="The founder, as rendered by his own AI budget">
  <p class="founder-name">The Founder</p>
  <p>The founder is proud to announce: something BIG&nbsp;D is happening in</p>
  <div id="timer">60</div>
  <small>Do not close this page. You have come too far to leave now.</small>
</main>
<script>
  var left = 60;
  var timer = document.getElementById("timer");
  var iv = setInterval(function () {
    left--;
    timer.textContent = left;
    if (left <= 0) {
      clearInterval(iv);
      window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ&autoplay=1";
    }
  }, 1000);
</script>
</body>
</html>
