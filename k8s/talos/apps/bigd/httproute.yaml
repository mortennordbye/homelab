apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bigd
  namespace: bigd
  annotations:
    # external-dns publishes bigd.no + www.bigd.no as CNAMEs to this DDNS A record.
    external-dns.kubernetes.io/target: ddns.bigd.no
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - bigd.no
    - www.bigd.no
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bigd-service
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
