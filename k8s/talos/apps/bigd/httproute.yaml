apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bigd
  namespace: bigd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - bigd.no
    - www.bigd.no
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bigd-service
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
