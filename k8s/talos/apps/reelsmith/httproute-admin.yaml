# The control panel, on the private gateway only. httproute.yaml does not
# serve /admin publicly, by design. authentik is the only lock: the app runs with
# GATEWAY_ADMIN_TRUST_PROXY_AUTH and checks nothing itself. The *.local.bigd.no
# listener already has a wildcard cert, and external-dns manages the zone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reelsmith-admin
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - "reelsmith.local.bigd.no"
  rules:
    # authentik's callback. It must stay reachable without authentication, and it
    # must reach authentik, not the app: the auth filter here would deadlock the
    # sign-in. The longer prefix wins over "/" regardless of rule order.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        # Cross-namespace: permitted by a ReferenceGrant in identity. The
        # embedded outpost is served by authentik-server itself.
        - group: ""
          kind: Service
          name: authentik-server
          namespace: identity
          port: 80
          weight: 1

    # Bare hostname redirects to the panel (the app mounts nothing on /).
    # Exact has priority over PathPrefix, so this rule wins over the catch-all
    # below. 302, not 301: browsers cache a permanent redirect too hard to undo.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin/
            statusCode: 302

    # The whole app behind authentik. Removing this filter opens the panel.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: reelsmith-authentik
      backendRefs:
        - group: ""
          kind: Service
          name: reelsmith-gateway
          port: 8000
          weight: 1
