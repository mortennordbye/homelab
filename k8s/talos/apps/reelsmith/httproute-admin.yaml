# The control panel, on the private gateway only — httproute.yaml deliberately
# does not serve /admin publicly. The panel also checks GATEWAY_ADMIN_TOKEN, so
# authentik here is a second lock, not the only one. The *.local.bigd.no
# listener already carries a wildcard cert and external-dns manages the zone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reelsmith-admin
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - "reelsmith.local.bigd.no"
  rules:
    # authentik's callback. Must stay reachable unauthenticated and must reach
    # authentik, not the app — the auth filter here would deadlock the sign-in
    # against itself. Longer prefix beats "/" regardless of rule order.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        # Cross-namespace: permitted by a ReferenceGrant in identity. The
        # embedded outpost is served by authentik-server itself.
        - group: ""
          kind: Service
          name: authentik-server
          namespace: identity
          port: 80
          weight: 1

    # Bare hostname redirects to the panel (the app mounts nothing on /).
    # Exact beats PathPrefix, so this wins over the catch-all below. 302, not
    # 301: browsers cache permanent redirects too hard to undo.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin/
            statusCode: 302

    # The whole app behind authentik; the panel still checks
    # GATEWAY_ADMIN_TOKEN behind it.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: reelsmith-authentik
      backendRefs:
        - group: ""
          kind: Service
          name: reelsmith-gateway
          port: 8000
          weight: 1
