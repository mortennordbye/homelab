# The gateway's SQLite file and the cover images it serves to Meta.
# SQLite runs in WAL mode. If locking ever fails, suspect WAL on NFS first.
# The fix is a journal-mode change in gateway/db.py, not a
# storage migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reelsmith-state
  namespace: reelsmith
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: syno-nfs-csi
  resources:
    requests:
      storage: 1Gi
