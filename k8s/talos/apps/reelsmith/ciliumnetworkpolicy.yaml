# Ingress from Traefik only, egress pinned to the publishing APIs: this pod is
# internet-reachable and holds tokens with publish and DM rights, so a
# compromised process must not be able to point them anywhere else.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reelsmith-gateway-policy
  namespace: reelsmith
spec:
  endpointSelector:
    matchLabels:
      app: reelsmith-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # kubelet probes and the health checker.
    - fromEntities:
        - host
        - health
    # Prometheus, for /metrics. Without this the scrape is dropped and the
    # only symptom is a target sitting at "down".
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS to CoreDNS. Required for toFQDNs below to resolve.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns:
              - matchPattern: "*"
    # Every host the gateway calls. TikTok returns its upload host per request,
    # hence the pattern.
    - toFQDNs:
        - matchName: "graph.instagram.com"
        - matchName: "graph.facebook.com"
        - matchName: "rupload.facebook.com"
        - matchName: "www.googleapis.com"
        - matchName: "oauth2.googleapis.com"
        - matchName: "youtubeanalytics.googleapis.com"
        - matchPattern: "*.tiktokapis.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
