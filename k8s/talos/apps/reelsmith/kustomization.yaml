apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
resources:
- namespace.yaml
- externalsecret.yaml
- configmap.yaml
- state-pvc.yaml
- deployment.yaml
- httproute.yaml
- httproute-admin.yaml
- middleware-authentik.yaml
- ciliumnetworkpolicy.yaml
- monitoring.yaml
# newTag is rewritten by Kargo's kustomize-set-image promotion; it overrides
# the inline tag in deployment.yaml.
images:
- name: ghcr.io/mortennordbye/reelsmith-gateway
  newTag: 0.0.85
