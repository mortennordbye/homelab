# Forward-auth for the control panel. Lives in this namespace because Traefik
# resolves an HTTPRoute ExtensionRef in the route's own namespace; the address
# itself is an ordinary cross-namespace HTTP call. Second lock alongside
# GATEWAY_ADMIN_TOKEN.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: reelsmith-authentik
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  forwardAuth:
    # The embedded outpost, served by authentik-server itself.
    address: http://authentik-server.identity.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    # authentik builds the post-login redirect from X-Forwarded-*. Safe: the
    # only path to this middleware is the private gateway, which overwrites
    # those headers itself.
    trustForwardHeader: true
    # Passed through for audit; the gateway does not use them for auth.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
