# Public gateway: Meta must reach /webhook and fetch /media and /covers with a
# publicly valid certificate. cert-manager and external-dns pick the hostname
# up from here.
#
# Allowlist, not catch-all: anything unlisted 404s at Traefik. /admin lives on
# the private gateway (httproute-admin.yaml) and /metrics is in-cluster only.
# Adding a route to the service means adding it here too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reelsmith
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "gate.nordbye.it"
  rules:
    - matches:
        # Meta: subscription handshake and message deliveries.
        - path:
            type: PathPrefix
            value: /webhook
        # Meta: fetches the MP4 and cover while creating a container.
        - path:
            type: PathPrefix
            value: /media
        - path:
            type: PathPrefix
            value: /covers
        # The Mac pipeline: uploads, post registration, queue. Bearer token.
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /healthz
        # Policy pages held on all four platforms' app records; a 404 here
        # breaks those registrations.
        #
        # Exact, not PathPrefix: a "/" prefix matches every path and would put
        # /admin and /metrics back on the public internet.
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /privacy
        - path:
            type: Exact
            value: /terms
        # TikTok OAuth redirect. The portal only accepts https redirect URIs,
        # so the consent trip cannot use a loopback listener; the page prints
        # the code for scripts/tiktok_authorise.py.
        - path:
            type: Exact
            value: /tiktok/callback
        # Facebook OAuth redirect for the Page consent trip.
        - path:
            type: Exact
            value: /facebook/callback
      backendRefs:
        - group: ""
          kind: Service
          name: reelsmith-gateway
          port: 8000
          weight: 1
