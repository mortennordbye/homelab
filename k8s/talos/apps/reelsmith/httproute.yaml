# Public gateway: Meta must reach /webhook and fetch /media and /covers with a
# publicly valid certificate. cert-manager and external-dns read the hostname
# from here.
#
# Allowlist, not catch-all: Traefik returns 404 for any unlisted path. /admin is on
# the private gateway (httproute-admin.yaml) and /metrics is in-cluster only.
# A new route on the service must be added here too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reelsmith
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "gate.nordbye.it"
  rules:
    - matches:
        # Meta: subscription handshake and message deliveries.
        - path:
            type: PathPrefix
            value: /webhook
        # Meta: fetches the MP4 and cover while creating a container.
        - path:
            type: PathPrefix
            value: /media
        - path:
            type: PathPrefix
            value: /covers
        # The Mac pipeline: uploads, post registration, queue. Bearer token.
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /healthz
        # Policy pages listed on all four platforms' app records. A 404 here
        # breaks those registrations.
        #
        # Exact, not PathPrefix: a "/" prefix matches every path and would put
        # /admin and /metrics back on the public internet.
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /privacy
        - path:
            type: Exact
            value: /terms
        # TikTok OAuth redirect. The portal only accepts https redirect URIs,
        # so the consent trip cannot use a loopback listener. The page prints
        # the code for scripts/tiktok_authorise.py.
        - path:
            type: Exact
            value: /tiktok/callback
        # Facebook OAuth redirect for the Page consent trip.
        - path:
            type: Exact
            value: /facebook/callback
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: reelsmith-cloudflare-only
      backendRefs:
        - group: ""
          kind: Service
          name: reelsmith-gateway
          port: 8000
          weight: 1
