# The values the gateway refuses to start without, plus the admin password.
# Replacing a Bitwarden value is enough to roll one: ESO refreshes hourly and
# Reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reelsmith-secret
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: reelsmith-secret
    creationPolicy: Owner
  data:
    # Meta app secret. Signs every webhook delivery.
    - secretKey: GATEWAY_APP_SECRET
      remoteRef:
        key: "e1fc86fe-0289-46cf-b3cb-b498013da019"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Echoed back during the Meta subscription handshake. Must match the value
    # entered in the dashboard exactly.
    - secretKey: GATEWAY_VERIFY_TOKEN
      remoteRef:
        key: "f28ab9d9-cb08-4afa-8df1-b498013dc6af"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Bearer token the Mac pipeline presents on /api/*.
    - secretKey: GATEWAY_API_TOKEN
      remoteRef:
        key: "aae017ad-34e3-4e50-9edd-b498013de2f2"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Password for the /admin control panel; separate from GATEWAY_API_TOKEN
    # so either rotates alone. The gateway refuses values under 24 characters.
    - secretKey: GATEWAY_ADMIN_TOKEN
      remoteRef:
        key: "eacd310a-8186-48c6-bf77-b499007a0f8b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
