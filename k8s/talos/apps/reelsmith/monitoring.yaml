# Scrape the gateway and alert on the ways it goes quiet without crashing:
# none of these show up as a restart or a 500, so the generic workload alerts
# in kube-prometheus-stack miss all of them.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reelsmith-gateway
  namespace: reelsmith
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app: reelsmith-gateway
  endpoints:
    # /metrics is off the public HTTPRoute allowlist; this in-cluster scrape
    # is its only reader.
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reelsmith-alerts
  namespace: reelsmith
  labels:
    # Matches the Prometheus ruleSelector; its ruleNamespaceSelector is empty,
    # so an app-local rule is picked up like one in monitoring/.
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  groups:
    - name: reelsmith.gateway
      rules:
        # The refresher tries daily from 15 days out. An expired token cannot
        # be refreshed, only re-authorised by hand in a browser.
        - alert: ReelsmithTokenExpiring
          expr: reelsmith_token_days_left < 10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith token for {{ $labels.ig_user_id }} expires in {{ $value | printf "%.1f" }} days'
            description: |
              The automatic refresh has had several days to renew this and has not.
              Check: kubectl -n reelsmith logs deploy/reelsmith-gateway | grep -i token

        - alert: ReelsmithTokenAboutToDie
          expr: reelsmith_token_days_left < 2
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: 'reelsmith token for {{ $labels.ig_user_id }} expires in under two days'
            description: |
              Past expiry it cannot be refreshed at all and needs re-authorising in a browser.
              Everything the account does stops: publishing, DMs and insights.

        # Heartbeats written after each successful pass (20s/60s loops); the
        # > 0 guard keeps a fresh pod's zero gauge from reading as decades of
        # staleness.
        - alert: ReelsmithPollerStalled
          expr: |
            (time() - reelsmith_poller_last_success_timestamp > 600)
              and (reelsmith_poller_last_success_timestamp > 0)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'reelsmith comment poller has not completed a sweep in {{ $value | printf "%.0f" }}s'
            description: |
              Comments are polled every 20s because real-time comment webhooks need App Review.
              While this is stalled the comment-to-DM mechanic is off and nobody is told.

        - alert: ReelsmithSchedulerStalled
          expr: |
            (time() - reelsmith_scheduler_last_success_timestamp > 600)
              and (reelsmith_scheduler_last_success_timestamp > 0)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'reelsmith scheduler has not ticked in {{ $value | printf "%.0f" }}s'
            description: |
              A stalled scheduler misses publish slots silently, and a missed slot is not retried later.

        # Everything is healthy and there is simply nothing to post — the one
        # failure no other alert can see.
        - alert: ReelsmithQueueStarved
          expr: increase(reelsmith_slots_starved_total[6h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith had {{ $value | printf "%.0f" }} slot(s) come due with nothing approved'
            description: |
              Render and enqueue a batch, or approve what is already queued, at reelsmith.local.bigd.no.

        # Warning, not critical: viewers see nothing while this is stale. What
        # it protects is the answered-comments record, which cannot be rebuilt.
        - alert: ReelsmithBackupStale
          expr: |
            (time() - reelsmith_backup_last_success_timestamp > 86400)
              and (reelsmith_backup_last_success_timestamp > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith has not backed up its state in {{ $value | printf "%.0f" }}s'
            description: |
              Usually a full state volume. The copies live beside the database and the newest 14 are kept.
              Check: kubectl -n reelsmith logs deploy/reelsmith-gateway | grep -i backup

        - alert: ReelsmithPublishFailing
          expr: increase(reelsmith_publish_failures_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith failed {{ $value | printf "%.0f" }} {{ $labels.platform }} publish attempt(s) in the last hour'
            description: |
              The platform rejected a publish or the upload did not complete. The queue entry stays for a retry.
              A platform with no publisher fails its own row rather than being handed to another
              platform's API, and reports itself here under its own name.
              Check: kubectl -n reelsmith logs deploy/reelsmith-gateway | grep -i publish

        # State, not event: increase() above self-resolves, but a row in
        # `failed` will not move without a person. A publish that failed after
        # container creation may already be live, so re-arming in the admin UI
        # can post the same Reel twice.
        - alert: ReelsmithPostStuck
          expr: reelsmith_queue_depth{state="failed"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith has {{ $value | printf "%.0f" }} queued post(s) stuck in failed on {{ $labels.account }}'
            description: |
              These have stopped retrying and stay put until someone decides what to do with them.
              Check the account for a duplicate before re-arming: a container may have become a Reel.
              Queue: https://reelsmith.local.bigd.no/admin/
              A "no video file" failure specifically means the retention sweep ate a queued
              file: _prune_media sweeps by mtime and db.live_media_names is the exemption
              that should have covered it.

        # A process dying between container creation and media_publish leaves
        # the row in `claimed`: no failure is counted and the row never reaches
        # `failed`, so neither alert above sees it. CLAIM_STALE_AFTER (1h) is
        # far beyond one upload, so any non-zero value is an abandoned claim.
        # Deliberately not self-healed: Meta may have accepted the post, and
        # only the account can say.
        - alert: ReelsmithClaimAbandoned
          expr: reelsmith_stale_claims > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'reelsmith has {{ $value | printf "%.0f" }} claim(s) nothing finished on {{ $labels.account }}'
            description: |
              A publish claimed this row and never came back. It will not retry and will not move
              without a person, and its media stays exempt from the retention sweep meanwhile.
              Check the account for the post before deciding: the container may already be a Reel.
              Queue: https://reelsmith.local.bigd.no/admin/
