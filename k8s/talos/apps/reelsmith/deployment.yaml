---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reelsmith-gateway
  namespace: reelsmith
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # One replica: single SQLite writer, singleton poller and scheduler — two
  # pods would race to reply and to publish. Scaling means Postgres plus
  # leader election first.
  replicas: 1
  strategy:
    # Recreate: RollingUpdate would briefly run two pods.
    type: Recreate
  selector:
    matchLabels:
      app: reelsmith-gateway
  template:
    metadata:
      labels:
        app: reelsmith-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Kargo rewrites the effective tag via the images: block in
          # kustomization.yaml.
          image: ghcr.io/mortennordbye/reelsmith-gateway:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # The process refuses to start without these.
            - name: GATEWAY_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: reelsmith-secret
                  key: GATEWAY_APP_SECRET
            - name: GATEWAY_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reelsmith-secret
                  key: GATEWAY_VERIFY_TOKEN
            - name: GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reelsmith-secret
                  key: GATEWAY_API_TOKEN
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reelsmith-secret
                  key: GATEWAY_ADMIN_TOKEN
            - name: GATEWAY_DB_PATH
              value: /state/gateway.sqlite3
            - name: GATEWAY_COVERS_DIR
              value: /state/covers
            # Meta fetches covers from this host: external name, not the
            # Service address.
            - name: GATEWAY_PUBLIC_BASE_URL
              value: "https://gate.nordbye.it"
          envFrom:
            - configMapRef:
                name: reelsmith-config
          volumeMounts:
            - name: state
              mountPath: /state
            # readOnlyRootFilesystem is on; Python still needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: reelsmith-state
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: reelsmith-gateway
  namespace: reelsmith
  # The ServiceMonitor selects by Service labels; without this one Prometheus
  # creates no target at all — quieter than a target that is down.
  labels:
    app: reelsmith-gateway
spec:
  selector:
    app: reelsmith-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
