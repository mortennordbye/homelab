# Posting schedule and feature flags, kept out of the deployment so a change
# here is a one-line edit that Reloader turns into a restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reelsmith-config
  namespace: reelsmith
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  # Master switch: with this off the gateway answers comments but never posts.
  GATEWAY_SCHEDULER_ENABLED: "true"

  # One slot per line: HH:MM [zone] [jitter=N] account=<id>. A line that does
  # not parse fails startup on purpose; removing an account's last line removes
  # its slots. account= must be named on every line — an unattributed line with
  # multiple accounts registered freezes the whole config sweep (see F0 in the
  # reelsmith repo's docs/multi-destination-audit.md). Jitter is derived from
  # slot+date, not rolled at runtime, so a restart cannot double-publish.
  # The Facebook id is the Page id from GET /me/accounts, not the number in the
  # Page's profile URL.
  # Two slots a day per platform since 2026-09-10, restoring cadence without
  # restoring the slot that was dropped for cause. Measured 2026-08-19 at n=58,
  # the three slots then running scored 06:00 UTC at 63.6% median skip with 27%
  # of posts over 500 views, 10:00 UTC at 65.5% and 22%, and 17:00 UTC at 76.3%
  # and 6%. The cut on 2026-08-27 kept only the first and dropped both others,
  # including the one that was nearly as good. Per-post views did not improve
  # afterwards: 132 median on three-post days against 126 on one-post days over
  # 93 posts, so the cut removed two thirds of the volume and bought nothing.
  #
  # 12:10 Oslo is the 10:00 UTC group above. The evening slot stays gone. Two
  # populated slots also restore `--cohorts slot`, which has been unable to
  # answer anything since 11 of 13 posts landed in a single slot.
  GATEWAY_SLOTS: |
    08:10 Europe/Oslo jitter=15 account=17841441696714445
    08:10 Europe/Oslo jitter=20 account=UCH8RDOkbzDna2mDAlq4GaFw
    08:10 Europe/Oslo jitter=15 account=-000y6NKYZ3EEbUGgXiyJ9nG66a_xqrF68Me
    08:10 Europe/Oslo jitter=15 account=1236596692875712
    12:10 Europe/Oslo jitter=15 account=17841441696714445
    12:10 Europe/Oslo jitter=20 account=UCH8RDOkbzDna2mDAlq4GaFw
    12:10 Europe/Oslo jitter=15 account=-000y6NKYZ3EEbUGgXiyJ9nG66a_xqrF68Me
    12:10 Europe/Oslo jitter=15 account=1236596692875712

  # Named zone, not an offset, so slots keep their local hour across DST.
  GATEWAY_DEFAULT_TIMEZONE: "Europe/Oslo"
  GATEWAY_DEFAULT_JITTER_MINUTES: "15"

  # Set explicitly so the behaviour is chosen rather than discovered; the
  # gateway warns if a returned status ever differs.
  GATEWAY_YOUTUBE_PRIVACY_STATUS: "public"

  # The /admin control panel. Requires GATEWAY_ADMIN_TOKEN and is only routed
  # on the private gateway (httproute-admin.yaml).
  GATEWAY_ADMIN_ENABLED: "true"

  # Gates the token refresher, the insights sweep and publishing — TikTok has
  # daily background loops of its own, unlike YouTube where nothing runs
  # unless a slot fires. A queued TikTok row hitting a slot with this off
  # fails rather than retries.
  GATEWAY_TIKTOK_ENABLED: "true"

  # Off until TikTok's audit passes: an unaudited client can only Direct Post
  # SELF_ONLY, which is worse than the inbox/drafts path in every respect.
  GATEWAY_TIKTOK_DIRECT_POST: "false"

  # Must be one of the options creator_info returns, or posts fail with
  # privacy_level_option_mismatch.
  GATEWAY_TIKTOK_PRIVACY_LEVEL: "SELF_ONLY"
