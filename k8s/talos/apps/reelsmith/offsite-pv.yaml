# Where reelsmith's gateway copies its state backups, off the state volume.
#
# reelsmith-state is a dynamically provisioned PVC with reclaim policy Delete,
# and the gateway's VACUUM INTO copies are beside the database on it, so they
# do not survive the volume. This is a different NAS share, statically bound.
#
# A PersistentVolume, not an inline nfs volume on the pod: the namespace
# enforces Pod Security restricted, which refuses inline nfs volumes (that is
# what took the gateway down on 2026-09-12, reverted in #948). PSA checks the
# pod's volume types, and it allows a PVC whatever backs it.
#
# The pod mounts this with subPath: gateway-backups, so it sees only that
# directory and not the render host's private files beside it on the share.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reelsmith-offsite-backups
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  # Retain: a deleted claim must never remove the backups. That is
  # the whole reason this volume exists.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: reelsmith
    name: reelsmith-offsite-backups
  nfs:
    server: nas.local.bigd.no
    path: /volume1/shared-data/media/reelsmith
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reelsmith-offsite-backups
  namespace: reelsmith
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: reelsmith-offsite-backups
  resources:
    requests:
      storage: 5Gi
