apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-tools
  namespace: omni-tools
  annotations:
    # Static SPA, no auth, so the edge can front it and cache it.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - omni-tools.bigd.no
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: omni-tools-cloudflare-only
      backendRefs:
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
