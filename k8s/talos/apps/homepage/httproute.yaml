apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Proxied for edge TLS and DDoS cover. Basic auth passes through
    # unchanged; keep this hostname out of any cache rule.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - "hub.bigd.no"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: homepage-basicauth
      backendRefs:
        # Route through the KEDA HTTP interceptor so homepage wakes from zero.
        # basicauth (above) runs at Traefik first, so only authenticated
        # requests reach the interceptor and wake the pod.
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
          weight: 1
