  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - resources:
        cpu: true
        memory: true
        disk: /

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

  kubernetes:
    mode: cluster

  settings:
    title: Eden
    showTitle: true
    hideVersion: true
    favicon: https://em-content.zobj.net/source/apple/391/herb_1f33f.png
    theme: dark
    color: slate
    headerStyle: boxed
    useEqualHeights: true
    iconStyle: theme
    statusStyle: dot
    target: _blank
    disableIndexing: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
      provider: duckduckgo
    background:
