            description: Hypervisor 1
            widget:
              type: prometheusmetric
              url: https://prometheus.local.bigd.no
              refreshInterval: 30000
              metrics:
                - label: CPU
                  query: pve_cpu_usage_ratio{id="node/hyper1"}
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: pve_memory_usage_bytes{id="node/hyper1"} / pve_memory_size_bytes{id="node/hyper1"}
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: Uptime
                  query: pve_uptime_seconds{id="node/hyper1"}
