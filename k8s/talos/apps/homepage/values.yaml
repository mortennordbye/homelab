            href: https://grafana.local.bigd.no
            siteMonitor: https://grafana.local.bigd.no
            description: Dashboards
            widget:
              type: prometheusmetric
              url: https://prometheus.local.bigd.no
              refreshInterval: 60000
              metrics:
                - label: Firing alerts
                  query: count(ALERTS{alertstate="firing", severity=~"warning|critical"}) or vector(0)
                - label: Next cert expiry
                  query: min(certmanager_certificate_expiration_timestamp_seconds) - time()
                  format:
                    type: duration
        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.local.bigd.no
            siteMonitor: https://tautulli.local.bigd.no
            description: Plex monitoring
        - Hubble:
            icon: cilium.png
            href: https://hubble.local.bigd.no
            siteMonitor: https://hubble.local.bigd.no
            description: Cilium network observability
            widget:
              type: prometheusmetric
              url: https://prometheus.local.bigd.no
              refreshInterval: 60000
              metrics:
                - label: Flows/s
                  query: sum(rate(hubble_flows_processed_total[5m]))
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Policy drops/min
                  query: sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[5m])) * 60
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 1

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - resources:
        cpu: true
        memory: true
        disk: /

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

  kubernetes:
    mode: cluster

  settings:
    title: Eden
    showTitle: true
    hideVersion: true
    favicon: https://em-content.zobj.net/source/apple/391/herb_1f33f.png
    theme: dark
    color: slate
    headerStyle: boxed
    useEqualHeights: true
    iconStyle: theme
    statusStyle: dot
    target: _blank
    disableIndexing: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
      provider: duckduckgo
    background:
      image: https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdnb.artstation.com%2Fp%2Fassets%2Fimages%2Fimages%2F044%2F912%2F457%2Flarge%2Fshan-jiang-wechatimg559s.jpg%3F1641470678&f=1&nofb=1&ipt=a6d14061d7aaee0187984ab30f3cf13f1ba0fc2dd3f53159f71102db8d44aa78
      blur: sm
      saturate: 100
      brightness: 75
      opacity: 80
      cardBlur: md
    layout:
      - Public Sites:
          style: row
          columns: 4
          icon: mdi-web
      - Media Management:
          style: row
          columns: 4
          icon: mdi-multimedia
      - Infrastructure:
          style: list
          icon: mdi-server
      - Network:
          style: list
          icon: mdi-network
      - Monitoring:
          style: list
          icon: mdi-chart-line
      - Torrent Sites:
          style: list
          icon: mdi-download
