apiVersion: apps/v1
kind: Deployment
metadata:
  name: gastam
  namespace: gastam
  labels:
    app: gastam
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gastam
  template:
    metadata:
      labels:
        app: gastam
    spec:
      containers:
        - name: gastam
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: gastam-site
