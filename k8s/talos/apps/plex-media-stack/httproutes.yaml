apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tautulli
  namespace: plex-media-stack
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - tautulli.local.bigd.no
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: tautulli
          port: 8181
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: plex-media-stack
  annotations:
    # Only safe while Jellyseerr's cacheImages stays off. With it on, TMDB posters
    # stream through the origin and fall under Cloudflare's media clause.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - seerr.bigd.no
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: plex-media-stack-cloudflare-only
      backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: 5055
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
