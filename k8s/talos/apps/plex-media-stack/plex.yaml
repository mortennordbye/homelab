apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: plex-media-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-local
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex-media-stack
  annotations:
    lbipam.cilium.io/ips: "10.3.10.103"
spec:
  type: LoadBalancer
  selector:
    app: plex
  ports:
    - name: plex
      protocol: TCP
      port: 32400
      targetPort: 32400
    - name: plex-roku
      protocol: TCP
      port: 8324
      targetPort: 8324
    - name: plex-dlna
      protocol: TCP
      port: 32469
      targetPort: 32469
    - name: plex-upnp
      protocol: UDP
      port: 1900
      targetPort: 1900
    - name: plex-gdm-1
      protocol: UDP
      port: 32410
      targetPort: 32410
    - name: plex-gdm-2
      protocol: UDP
      port: 32412
      targetPort: 32412
    - name: plex-gdm-3
      protocol: UDP
      port: 32413
      targetPort: 32413
    - name: plex-gdm-4
      protocol: UDP
      port: 32414
      targetPort: 32414
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-init
  namespace: plex-media-stack
data:
  # linuxserver runs /custom-cont-init.d/* as root before Plex starts. It
  # ignores ADVERTISE_IP, so this is what makes LAN clients offer the VIP
  # instead of the unreachable pod IP.
  set-custom-connections: |
    #!/bin/sh
    prefs="/config/Library/Application Support/Plex Media Server/Preferences.xml"
    url="https://10.3.10.103:32400"

    # First boot: Plex has not written its preferences yet; the next start applies.
    [ -f "$prefs" ] || exit 0

    owner=$(stat -c %u:%g "$prefs")
    if grep -q 'customConnections="' "$prefs"; then
      sed -i "s#customConnections=\"[^\"]*\"#customConnections=\"${url}\"#" "$prefs"
    else
      sed -i "s#<Preferences #<Preferences customConnections=\"${url}\" #" "$prefs"
    fi
    chown "$owner" "$prefs"
    echo "customConnections set to ${url}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex-media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      # Pinned to the node with the Intel iGPU passed through, for QuickSync transcoding.
      # The plex-config PV carries its own nodeAffinity for zone hyper1, which the scheduler
      # enforces separately, so that constraint does not need repeating here.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hardware.nordbye.it/gpu
                    operator: In
                    values:
                      - intel-quicksync
      containers:
        - name: plex
          image: ghcr.io/linuxserver/plex:1.43.2
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
            - name: VERSION
              value: "docker"
          ports:
            - containerPort: 32400
              name: plex
              protocol: TCP
            - containerPort: 8324
              name: plex-roku
              protocol: TCP
            - containerPort: 32469
              name: plex-dlna
              protocol: TCP
            - containerPort: 1900
              name: plex-upnp
              protocol: UDP
            - containerPort: 32410
              name: plex-gdm-1
              protocol: UDP
            - containerPort: 32412
              name: plex-gdm-2
              protocol: UDP
            - containerPort: 32413
              name: plex-gdm-3
              protocol: UDP
            - containerPort: 32414
              name: plex-gdm-4
              protocol: UDP
          # The device plugin injects /dev/dri, so no hostPath is needed and the
          # namespace stays at baseline. Only a node running the plugin advertises
          # this resource, so the request is also what places Plex on the iGPU node.
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-series
              mountPath: /tv
            - name: media-movies
              mountPath: /movies
            - name: media-courses
              mountPath: /courses
            - name: media-youtube
              mountPath: /youtube
            - name: transcode
              mountPath: /transcode
            # subPath: a whole ConfigMap mount makes the directory 0777, which
            # linuxserver flags as a security risk on every start.
            - name: init
              mountPath: /custom-cont-init.d/set-custom-connections
              subPath: set-custom-connections
              readOnly: true
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: media-series
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/series
            readOnly: true
        - name: media-movies
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/movies
            readOnly: true
        - name: media-courses
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/courses
            readOnly: true
        - name: media-youtube
          nfs:
            server: nas.local.bigd.no
            path: /volume1/shared-data/media/youtube
            readOnly: true
        - name: transcode
          emptyDir:
            sizeLimit: 35Gi
        # Executable and root-owned, or linuxserver skips the script.
        - name: init
          configMap:
            name: plex-init
            defaultMode: 0755
