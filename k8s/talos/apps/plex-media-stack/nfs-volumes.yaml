# Static NFS claims: the restricted Pod Security standard forbids inline nfs volumes.
# Retain, so deleting a claim never touches the folder on the NAS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-stack-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: plex-media-stack
    name: media
  nfs:
    server: nas.local.bigd.no
    path: /volume1/shared-data/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: plex-media-stack
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: plex-media-stack-media
  resources:
    requests:
      storage: 1Ti
