apiVersion: v1
kind: Namespace
metadata:
  name: plex-media-stack
  labels:
    # Pinned rather than inherited: seerr answers from the internet, so this
    # namespace must not follow the cluster default if that ever loosens.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    volsync.backube/privileged-movers: "true"
