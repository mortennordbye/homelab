apiVersion: v1
kind: Namespace
metadata:
  name: plex-media-stack
  labels:
    # Talos enforces PodSecurity "baseline" cluster-wide, exempting only kube-system, and baseline
    # forbids hostPath volumes outright. Plex mounts /dev/dri from the host for QuickSync
    # transcoding on genesis-worker-01, so this namespace has to sit above baseline.
    #
    # This is broader than ideal: it lifts the restriction for seerr and tautulli too, neither of
    # which needs it. The narrower fix is Intel's GPU device plugin, which advertises
    # gpu.intel.com/i915 as a schedulable resource and removes the need for hostPath entirely,
    # letting this go back to baseline. Tracked in BACKLOG.md.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
