apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blog-inflight
  namespace: blog
spec:
  # Concurrency cap for slow readers, which a per-second rate limit does not
  # catch. sourceCriterion must stay explicit — inFlightReq defaults to keying
  # on requestHost, which would cap the whole blog at 30 concurrent rather than
  # 30 per client.
  inFlightReq:
    amount: 30
    sourceCriterion:
      ipStrategy:
        depth: 1
