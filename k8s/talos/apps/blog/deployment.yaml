name: blog
image: ghcr.io/mortennordbye/homelab/blog:1df276a
imagePullPolicy: Always
ports:
  - name: http
    containerPort: 80
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
