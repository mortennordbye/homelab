apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blog-ratelimit
  namespace: blog
spec:
  # Token bucket keyed on the client IP Cloudflare observed (depth: 1 = the
  # rightmost X-Forwarded-For entry; keying the remote address would bucket a
  # whole POP together). Lower than portfolio's because a Hugo page pulls far
  # less; each Traefik replica holds its own bucket, so the effective ceiling
  # is up to 3x these numbers.
  rateLimit:
    average: 25
    period: 1s
    burst: 100
    sourceCriterion:
      ipStrategy:
        depth: 1
