apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: blog
  namespace: blog
spec:
  scaleTargetRef:
    name: blog
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 300
  triggers:
    - type: cron
      metadata:
        timezone: Europe/Oslo
        start: "0 7 * * *"
        end: "0 23 * * *"
        desiredReplicas: "3"
