apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
resources:
- deployment.yaml
- poddisruptionbudget.yaml
- service.yaml
- httproute.yaml
- cloudflare-only-middleware.yaml
- compress-middleware.yaml
- ratelimit-middleware.yaml
- inflight-middleware.yaml
- namespace.yaml
- ciliumnetworkpolicy.yaml
- scaledobject.yaml
# Kargo owns the image tag (kargo-projects Warehouse/Stage) and rewrites
# newTag in the kustomize-set-image promotion step. It overrides the inline tag in
# deployment.yaml.
images:
- name: ghcr.io/mortennordbye/homelab/blog
  newTag: 0.0.391
