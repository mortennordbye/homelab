apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: blog
spec:
  selector:
    app.kubernetes.io/name: blog
  ports:
    - name: http
      port: 80
      # The container listens on 8080 (unprivileged nginx). Service port stays
      # 80 so the HTTPRoute references nothing new.
      targetPort: 8080
