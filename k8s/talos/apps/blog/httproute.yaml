apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: blog
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - blog.nordbye.it
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: blog
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
