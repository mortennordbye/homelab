apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: blog
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - blog.nordbye.it
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Order matters: Traefik applies filters as listed, so a rejected
        # request is turned away before anything is compressed.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: blog-ratelimit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: blog-inflight
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: blog-compress
      backendRefs:
        - group: ""
          kind: Service
          name: blog
          port: 80
          weight: 1
