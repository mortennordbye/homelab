apiVersion: apps/v1
kind: Deployment
metadata:
  name: batmotor-storehaug
  namespace: batmotor-storehaug
  labels:
    app: batmotor-storehaug
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: batmotor-storehaug
  template:
    metadata:
      labels:
        app: batmotor-storehaug
    spec:
      containers:
        - name: batmotor-storehaug
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: html
          configMap:
            name: batmotor-storehaug-html
