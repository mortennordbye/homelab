apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-secret
  namespace: outline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: outline-secret
    creationPolicy: Owner
  data:
    # Encrypts stored integration tokens. A new value makes them unreadable.
    - secretKey: SECRET_KEY
      remoteRef:
        key: "fa30b6e9-1da1-43a3-9349-b4ff0141e2d2"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: UTILS_SECRET
      remoteRef:
        key: "ecd22a9c-7646-456c-99bf-b4ff0141e31e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Same Bitwarden items as OUTLINE_OIDC_* in the identity namespace.
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: "fce83cf4-59d6-4242-b5c8-b4ff0141e37b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: "f2a431df-7ea0-4642-831f-b4ff0141e959"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
