# ENCRYPTION_KEY encrypts secrets at rest; changing it after first start makes
# existing encrypted data unreadable, so it lives in Bitwarden from day one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secret
  namespace: trek
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: trek-secret
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: "9c266643-4f45-4aca-8586-b4b8006e6d3b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
