# ENCRYPTION_KEY encrypts secrets at rest; changing it after first start makes
# existing encrypted data unreadable, so it lives in Bitwarden from day one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secret
  namespace: trek
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: trek-secret
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: "9c266643-4f45-4aca-8586-b4b8006e6d3b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Admin bootstrap; TREK only reads these on a boot where no users exist.
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: "0e1423c8-2011-4064-8f13-b4b800718e7e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: "d0b53f57-cbf5-4ac5-af34-b4b800718efc"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
