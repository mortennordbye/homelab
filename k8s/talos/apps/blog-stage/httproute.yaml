apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-stage
  namespace: stage-blog
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - blog-stage.local.bigd.no
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: blog-stage
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
