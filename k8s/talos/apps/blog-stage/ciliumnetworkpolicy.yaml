apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: blog-stage-policy
  namespace: stage-blog
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: blog-stage
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            # Enforced at the pod, so this is the container port, not the
            # Service port. Unprivileged nginx listens on 8080.
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": keda
            "k8s:app.kubernetes.io/component": interceptor
            "k8s:app.kubernetes.io/part-of": keda-add-ons-http
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - health
