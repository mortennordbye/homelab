apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-stage
  namespace: stage-blog
  labels:
    app.kubernetes.io/name: blog-stage
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-stage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-stage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        # nginx-unprivileged runs as the built-in `nginx` user (uid 101).
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: blog
          image: ghcr.io/mortennordbye/homelab/blog:a5feaed
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            # Only writable path nginx-unprivileged needs: it puts client_body,
            # proxy and fastcgi temp dirs under /tmp rather than /var/cache/nginx.
            # Verified by running the image read-only with just this one mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
