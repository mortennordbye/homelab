apiVersion: v1
kind: Service
metadata:
  name: blog-stage
  namespace: stage-blog
spec:
  selector:
    app.kubernetes.io/name: blog-stage
  ports:
    - name: http
      port: 80
      # The container listens on 8080 (unprivileged nginx). Service port stays
      # 80 so the HTTPRoute and interceptor reference nothing new.
      targetPort: 8080
