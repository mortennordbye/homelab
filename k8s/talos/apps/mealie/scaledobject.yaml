apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mealie
  namespace: mealie
spec:
  scaleTargetRef:
    name: mealie
  minReplicaCount: 1
  maxReplicaCount: 1
  # Mealie is pinned to 1 replica and deliberately never scales to zero.
  # Its frontend clears the auth cookie and redirects to /login on any failed
  # request (mealie-recipes/mealie#6311), so every cold start risked signing
  # users out mid-session. 256Mi is cheap next to that.
  # The triggers below are inert while min == max == 1; they are kept so the
  # wake-from-zero wiring can be restored if upstream fixes the logout bug.
  triggers:
    - type: cron
      metadata:
        timezone: Europe/Oslo
        start: "0 7 * * *"
        end: "0 23 * * *"
        desiredReplicas: "1"
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: mealie
