apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: mealie
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - mealie.local.bigd.no
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mealie-service
          port: 9000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
