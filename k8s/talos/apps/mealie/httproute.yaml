apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: mealie
  annotations:
    # Proxied for edge TLS and DDoS cover. Accounts and sessions, so keep
    # this hostname out of any cache rule.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-public
      namespace: traefik
  hostnames:
    - mealie.bigd.no
  rules:
    - backendRefs:
        # Route through the KEDA HTTP interceptor so mealie wakes from zero.
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
