apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-stage-compress
  namespace: stage-portfolio
spec:
  # The distroless Node runtime serves text assets uncompressed. Traefik
  # negotiates br/gzip/zstd from Accept-Encoding and compresses at the edge.
  # includedContentTypes limits work to compressible text so already-compressed
  # images and woff2 fonts aren't re-compressed for no gain.
  compress:
    # Traefik selects by this order, not the client's q-values. Browsers send
    # "gzip, deflate, br, zstd"; without this it defaults to gzip. Brotli is the
    # smallest for our HTML/JS and universally supported, so it leads.
    encodings:
      - br
      - zstd
      - gzip
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/xml
      - text/javascript
      - text/x-component
      - application/javascript
      - application/json
      - application/xml
      - application/manifest+json
      - image/svg+xml
