apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-stage-compress
  namespace: stage-portfolio
spec:
  # The distroless Node runtime serves text assets uncompressed. Traefik
  # negotiates br/gzip/zstd from Accept-Encoding and compresses at the edge.
  # includedContentTypes limits the work to compressible text, so Traefik does
  # not compress images and woff2 fonts a second time.
  compress:
    # Traefik selects by this order, not by the client's q-values. Browsers send
    # "gzip, deflate, br, zstd"; without this list Traefik defaults to gzip. Brotli
    # is the smallest for our HTML/JS and all browsers support it, so it is first.
    encodings:
      - br
      - zstd
      - gzip
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/xml
      - text/javascript
      - text/x-component
      - application/javascript
      - application/json
      - application/xml
      - application/manifest+json
      - image/svg+xml
