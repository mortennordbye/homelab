apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-stage
  namespace: stage-portfolio
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stage-portfolio
  template:
    metadata:
      labels:
        app: stage-portfolio
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        # Distroless nodejs runs as the built-in `nonroot` user (uid 65532).
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup chowns the writable emptyDirs to gid 65532 so the Node
        # process can write the .next cache and /tmp under readOnlyRootFilesystem.
        fsGroup: 65532
      containers:
        - name: portfolio
          image: ghcr.io/mortennordbye/homelab/portfolio:def4da2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            # Next's ISR/fetch cache — the only path the server writes at runtime.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                [{ name: Host, value: portfolio-stage.local.bigd.no }]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                [{ name: Host, value: portfolio-stage.local.bigd.no }]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
