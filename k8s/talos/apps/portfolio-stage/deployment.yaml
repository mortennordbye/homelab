apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-stage
  namespace: stage-portfolio
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stage-portfolio
  template:
    metadata:
      labels:
        app: stage-portfolio
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # fsGroup chowns the nginx-cache emptyDir to gid 101 so the
        # unprivileged nginx user can write its pid + temp paths under
        # /var/cache/nginx (the only writable path under readOnlyRootFilesystem).
        fsGroup: 101
      containers:
        - name: portfolio
          image: ghcr.io/mortennordbye/homelab/portfolio:def4da2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                [{ name: Host, value: portfolio-stage.local.bigd.no }]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                [{ name: Host, value: portfolio-stage.local.bigd.no }]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir:
            medium: Memory
