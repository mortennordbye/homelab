apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
resources:
- namespace.yaml
- volsync.yaml
- data-pvc.yaml
- deployment.yaml
- httproute.yaml
- interceptorroute.yaml
- service.yaml
- ciliumnetworkpolicy.yaml
- scaledobject.yaml
# Kargo rewrites newTag in the kustomize-set-image promotion step. It overrides the
# inline tag in deployment.yaml. The headroom-cd Warehouse/promotion sets it to 0.0.N.
images:
- name: ghcr.io/mortennordbye/headroom
  newTag: 0.0.1010
