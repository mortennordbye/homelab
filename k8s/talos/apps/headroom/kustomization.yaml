apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

resources:
  - namespace.yaml
  - data-pvc.yaml
  - deployment.yaml
  - httproute.yaml
  - service.yaml
  - ciliumnetworkpolicy.yaml
  - scaledobject.yaml

# CI (headroom build.yml -> .github/workflows/bump-image.yml) rewrites newTag
# to the freshly-built commit SHA via `kustomize edit set image` and opens a PR.
images:
  - name: ghcr.io/mortennordbye/headroom
    newTag: sha-2629ed3
