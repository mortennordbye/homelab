apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      # The image starts as root to chown /data, then drops to uid 1000; on this
      # NFS PVC the chown doesn't stick and it falls back to root. Do NOT add
      # runAsUser — a non-root start removes the fallback and crashes SQLite
      # on open (SQLITE_CANTOPEN).
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: headroom
          # Pinned SHA, rewritten by CI (bump-image.yml). Never :latest.
          image: ghcr.io/mortennordbye/headroom:sha-32a1389
          imagePullPolicy: IfNotPresent
          env:
            # Host-header allowlist (DNS-rebinding guard); defaults to loopback
            # only, so the served hostname must be listed or the app 403s.
            - name: ALLOWED_HOSTS
              value: "headroom.local.bigd.no,localhost,127.0.0.1"
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headroom-data-pvc
