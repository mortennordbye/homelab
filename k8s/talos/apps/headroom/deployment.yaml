apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      # The headroom image starts as root, fixes /data ownership, then drops to
      # uid 1000 (node) — but only when that uid can actually write the volume.
      # On this Synology NFS PVC the in-container chown doesn't stick, so it
      # falls back to running as root (which the export permits). fsGroup asks
      # the CSI to make the volume group-writable by gid 1000 so it can run
      # non-root where the driver supports it; NFS drivers that ignore fsGroup
      # simply use the root fallback. Do NOT add runAsUser here — starting the
      # pod non-root removes the entrypoint's ability to escalate for the
      # fallback and reintroduces the SQLITE_CANTOPEN startup crash.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: headroom
          # Pinned SHA, rewritten by CI (bump-image.yml). Never :latest.
          image: ghcr.io/mortennordbye/headroom:sha-53638de
          imagePullPolicy: IfNotPresent
          env:
            # The app enforces a Host-header allowlist (DNS-rebinding guard) that
            # defaults to loopback only, so it 403s ("host not allowed") behind
            # the gateway. List the external hostname(s) it's served on. Loopback
            # is kept for any in-cluster/localhost checks.
            - name: ALLOWED_HOSTS
              value: "headroom.local.bigd.no,localhost,127.0.0.1"
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headroom-data-pvc
