apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      # SQLite opens /data/database.sqlite; the files on the NFS PVC are owned by
      # 1000, so runAsUser and the volume's owner must stay the same uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headroom
          # Kargo sets the tag through kustomization.yaml `images:`; this inline value is only a kubectl-apply fallback.
          image: ghcr.io/mortennordbye/headroom:sha-32a1389
          imagePullPolicy: IfNotPresent
          env:
            # Host-header allowlist (DNS-rebinding guard); defaults to loopback
            # only, so the served hostname must be listed or the app 403s.
            - name: ALLOWED_HOSTS
              value: "headroom.local.bigd.no,localhost,127.0.0.1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headroom-data-pvc
