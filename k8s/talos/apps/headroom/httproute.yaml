apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headroom
  namespace: headroom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-private
      namespace: traefik
  hostnames:
    - headroom.local.bigd.no
  rules:
    - backendRefs:
        # Route through the KEDA HTTP interceptor so a request can wake headroom
        # from zero at night. The InterceptorRoute matches on the host and
        # forwards to headroom-service.
        - group: ""
          kind: Service
          name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
