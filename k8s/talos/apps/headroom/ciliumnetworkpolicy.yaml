apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: headroom-policy
  namespace: headroom
spec:
  endpointSelector:
    matchLabels:
      app: headroom
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/instance": traefik-traefik
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    # Requests now flow Traefik -> KEDA HTTP interceptor -> headroom, so the
    # interceptor needs to reach the pod (also the path that wakes it from zero).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": keda
            "k8s:app.kubernetes.io/component": interceptor
            "k8s:app.kubernetes.io/part-of": keda-add-ons-http
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    - fromEntities:
        - host
        - health
