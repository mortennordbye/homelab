apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: scratch-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    storageClass: syno-nfs-csi
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: logeverylift_db
      owner: logeverylift
      import:
        type: microservice
        databases:
          - logeverylift_db
        source:
          externalCluster: legacy
  externalClusters:
    - name: legacy
      connectionParameters:
        host: postgres.logeverylift.svc
        user: postgres
        dbname: logeverylift_db
      password:
        name: legacy-postgres
        key: POSTGRES_PASSWORD
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        serverName: scratch-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: scratch-db
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: scratch-db
