apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: scratch-restore
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    storageClass: syno-nfs-csi
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  bootstrap:
    recovery:
      source: scratch-db
      recoveryTarget:
        targetTime: "2026-10-31T14:54:23.452038Z"
  externalClusters:
    - name: scratch-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage
          serverName: scratch-db
