# Password of the legacy logeverylift Postgres, read once by the import.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: legacy-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "fbae7327-2f9c-4881-91cb-b421013834f8"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        # Garage rejects signatures for any region but its own s3_region.
        REGION: garage
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: "5e61c8e6-3642-4bbc-8a6a-b4f400f0eb33"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: "48d4180c-091c-48ec-8971-b4f400f0ecb3"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
