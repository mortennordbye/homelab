apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
resources:
- namespace.yaml
- externalsecret.yaml
- cnpg-cluster.yaml
- db-backup.yaml
- db-restore-test.yaml
- app.yaml
- httproute.yaml
- cloudflare-only-middleware.yaml
- ciliumnetworkpolicy.yaml
# Kargo rewrites newTag in the kustomize-set-image promotion step. It overrides the
# inline tag in app.yaml. The logeverylift-cd Warehouse/promotion sets it to 0.0.N.
images:
- name: ghcr.io/mortennordbye/logeverylift
  newTag: 0.0.599
