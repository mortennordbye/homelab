---
# The Postgres 16 volume. Kept declared, and deliberately not mounted by
# anything, so reverting this file is a complete rollback to 16 with the
# original data intact. Remove it once 18 has been running happily for a
# while — see docs/postgres-18-migration.md, step 8.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: logeverylift
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: syno-nfs-csi
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc-18
  namespace: logeverylift
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: syno-nfs-csi
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: logeverylift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # A fresh Synology NFS volume is root-only for non-root uids, so the
      # postgres entrypoint cannot mkdir $PGDATA. One non-recursive chown of the
      # mount root fixes it; same image as the main container so there is no
      # second tag to track. See docs/postgres-18-migration.md.
      initContainers:
        - name: fix-nfs-ownership
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - chown 70:70 /var/lib/postgresql && chmod 700 /var/lib/postgresql
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: logeverylift_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # Mounted at the parent, not /var/lib/postgresql/data: Postgres 18
            # keeps the cluster in a version-named subdirectory, and mounting
            # the old path makes the 18 image refuse to start.
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "logeverylift_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc-18

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: logeverylift
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
