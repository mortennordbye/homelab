---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logeverylift-app
  namespace: logeverylift
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logeverylift-app
  template:
    metadata:
      labels:
        app: logeverylift-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logeverylift-app
          # Kargo sets the tag through kustomization.yaml `images:`; this inline value is only a kubectl-apply fallback.
          image: ghcr.io/mortennordbye/logeverylift:sha-43378df
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: BETTER_AUTH_URL
              value: "https://logeverylift.com"
            # Weekly copy of OpenStreetMap's gyms for "Gyms near me".
            - name: GYM_IMPORT_COUNTRIES
              value: "NO"
            # Traces to Alloy (docs/platform/observability/README.md#stack).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring:4318"
            # Generated by CloudNativePG: the owner role on logeverylift-db-rw.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logeverylift-db-app
                  key: uri
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: BETTER_AUTH_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: ADMIN_PASSWORD
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: ADMIN_NAME
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: OPENROUTER_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: GOOGLE_API_KEY
            - name: NEXT_PRIVATE_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: logeverylift-secret
                  key: NEXT_PRIVATE_SERVER_ACTIONS_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # No CPU limit: CFS throttling stalls request handling in 100ms steps.
            limits:
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: logeverylift-app
  namespace: logeverylift
spec:
  selector:
    app: logeverylift-app
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
