# Shares the workout app's Bitwarden items during migration. Swap the UUIDs for
# new items if logeverylift should have isolated secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logeverylift-secret
  namespace: logeverylift
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: logeverylift-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "fbae7327-2f9c-4881-91cb-b421013834f8"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: "5f016738-76c5-414b-9aa1-b42200a17f2e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: "996ed837-7adf-4e13-b929-b42200a1aeb0"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: "9c280f50-f4b6-44b9-b9c4-b42200a1ceea"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ADMIN_NAME
      remoteRef:
        key: "37af512a-c74e-4693-a17e-b42200a1fb55"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: "674d439e-814d-4e06-bea0-b42e014f84be"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: "dae733f4-2b60-48fc-bbe6-b42f00f000a7"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: NEXT_PRIVATE_SERVER_ACTIONS_ENCRYPTION_KEY
      remoteRef:
        key: "414f5947-b258-450a-a478-b437011ae1d0"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: logeverylift
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        # Garage rejects signatures for any region but its own s3_region.
        REGION: garage
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: "5e61c8e6-3642-4bbc-8a6a-b4f400f0eb33"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: "48d4180c-091c-48ec-8971-b4f400f0ecb3"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
