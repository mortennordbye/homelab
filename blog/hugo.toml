baseURL: "https://blog.nordbye.it/"
languageCode: en-us
title: My Homelab Docs
theme: hextra

# Required for Hextra to work properly
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 2
    - identifier: about
      name: About
      pageRef: /about
      weight: 3

params:
  description: "Tech notes and Kubernetes adventures"

  # Search Configuration
  search:
    enable: true
    type: flexsearch

  # UI Customization
  navbar:
    displayTitle: true
    displayLogo: true

  footer:
    displayCopyright: true

  # Blog settings
  blog:
    list:
      displayTags: true
