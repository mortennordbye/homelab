<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c131c"/>
      <stop offset="0.55" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <!-- darkening vignette (black only, no colour wash) -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="2400" height="1600" fill="url(#bg)"/>

  <!-- faint blueprint grid -->
  <g stroke="#ffffff" stroke-opacity="0.028" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="1600"/><line x1="240" y1="0" x2="240" y2="1600"/>
    <line x1="360" y1="0" x2="360" y2="1600"/><line x1="480" y1="0" x2="480" y2="1600"/>
    <line x1="600" y1="0" x2="600" y2="1600"/><line x1="720" y1="0" x2="720" y2="1600"/>
    <line x1="840" y1="0" x2="840" y2="1600"/><line x1="960" y1="0" x2="960" y2="1600"/>
    <line x1="1080" y1="0" x2="1080" y2="1600"/><line x1="1200" y1="0" x2="1200" y2="1600"/>
    <line x1="1320" y1="0" x2="1320" y2="1600"/><line x1="1440" y1="0" x2="1440" y2="1600"/>
    <line x1="1560" y1="0" x2="1560" y2="1600"/><line x1="1680" y1="0" x2="1680" y2="1600"/>
    <line x1="1800" y1="0" x2="1800" y2="1600"/><line x1="1920" y1="0" x2="1920" y2="1600"/>
    <line x1="2040" y1="0" x2="2040" y2="1600"/><line x1="2160" y1="0" x2="2160" y2="1600"/>
    <line x1="2280" y1="0" x2="2280" y2="1600"/>
    <line x1="0" y1="120" x2="2400" y2="120"/><line x1="0" y1="240" x2="2400" y2="240"/>
    <line x1="0" y1="360" x2="2400" y2="360"/><line x1="0" y1="480" x2="2400" y2="480"/>
    <line x1="0" y1="600" x2="2400" y2="600"/><line x1="0" y1="720" x2="2400" y2="720"/>
    <line x1="0" y1="840" x2="2400" y2="840"/><line x1="0" y1="960" x2="2400" y2="960"/>
    <line x1="0" y1="1080" x2="2400" y2="1080"/><line x1="0" y1="1200" x2="2400" y2="1200"/>
    <line x1="0" y1="1320" x2="2400" y2="1320"/><line x1="0" y1="1440" x2="2400" y2="1440"/>
  </g>

  <rect width="2400" height="1600" fill="url(#vignette)"/>
</svg>
