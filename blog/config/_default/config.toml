baseURL = "https://blog.nordbye.it/"
locale = "en"
defaultContentLanguage = "en"
title = "Morten Victor Nordbye"
theme = "northlight"

enableRobotsTXT = true
summaryLength = 30

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

# `series` is deliberately absent. The theme supports a series taxonomy and
# renders series navigation when one is registered, but no post here uses it —
# register it again the day one does.
[taxonomies]
tag = "tags"

# `changefreq` and `priority` are deliberately unset. Google ignores both, and
# every URL here claiming a daily change was a claim the crawler can check and
# find false: none of these posts change after publication.
[sitemap]
filename = "sitemap.xml"

# -- Related content --
# Required for params.article.showRelated. Hugo's default indices cover
# `keywords`, which this theme does not use, so related posts come back empty
# without this.
[related]
includeNewer = true
threshold = 80
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "date"
weight = 10
