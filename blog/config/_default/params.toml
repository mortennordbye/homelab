description = "Kubernetes, cloud infrastructure and homelab engineering from a Talos cluster I actually run. Practical guides on observability, networking and GitOps."

# periwinkle | sage | clay | plum | slate | rose
# slate is the theme's blue, retuned to the portfolio's arctic blue in
# assets/css/custom.css so the two sites read as one brand. Dropping that file
# leaves the site blue, just muted — which is why slate is the base rather than
# the periwinkle default.
colorScheme = "slate"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["blog"]

disableImageOptimization = false
defaultBackgroundImage = "images/background.png"

smartTOCHideUnfocusedChildren = true

[author]
name = "Morten Victor Nordbye"
image = "images/profile.png"
headline = "Cloud engineer. Homelab enthusiast."
bio = "I write about Kubernetes, infrastructure, and making things work."
links = [
    { linkedin = "https://www.linkedin.com/in/morten-nordbye-325bb71bb" },
    { github = "https://github.com/mortennordbye" },
    { link = "https://nordbye.it" },
]

[header]
layout = "basic"

[home]
# The `background` layout pins its scrim and text to light-on-dark in both colour
# modes, because the image behind them does not invert when the palette does. With
# a near-black backdrop that reads as a solid black band on a light page, so this
# site takes the ordinary intro instead. `backgroundImage` is gone with it — only
# the background layout reads it.
layout = "stack"
recentCount = 5

[article]
showDate = true
showDateUpdated = false
showAuthor = true
showHero = true
heroStyle = "basic"
layoutBackgroundBlur = true
showBreadcrumbs = true
showEdit = false
showTableOfContents = true
showTaxonomies = true
showAuthorsBadges = false
showWordCount = true
showComments = true
showRelated = true
relatedLimit = 3
sharingLinks = ["linkedin", "reddit"]

[list]
groupByYear = true
cardView = true

[taxonomy]
showTermCount = true
cardView = false

[footer]
# The theme cannot default this to its own repository — that URL carries its
# author's name, and no file inside the theme is allowed to. Unset, the theme name
# in the attribution line renders as plain text.
themeURL = "https://github.com/mortennordbye/northlight"
showMenu = true
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = true
showScrollToTop = true

# Cloudflare Web Analytics. This token was hardcoded in a local
# extend-head.html override; the theme reads it from config, so the override is
# gone and the token lives with the rest of the configuration.
[analytics.cloudflare]
token = "47962423c7a84c78a8a932edaf8844cf"

# The theme fixes data-strict, data-emit-metadata, data-input-position and
# data-theme itself — the last so the widget follows this site's appearance
# toggle rather than only the OS — so only these five keys are read.
[comments.giscus]
repo = "mortennordbye/homelab"
repoId = "R_kgDOOEXL5g"
category = "Announcements"
categoryId = "DIC_kwDOOEXL5s4C06qE"
mapping = "pathname"
reactionsEnabled = true
