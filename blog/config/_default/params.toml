description = "Kubernetes, cloud infrastructure and homelab engineering from a Talos cluster I actually run. Practical guides on observability, networking and GitOps."
env = "production"

colorScheme = "github"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["blog"]

disableImageOptimization = false
defaultBackgroundImage = "images/background.png"

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = true

[author]
name = "Morten Victor Nordbye"
image = "images/profile.png"
headline = "Cloud engineer. Homelab enthusiast."
bio = "I write about Kubernetes, infrastructure, and making things work."
links = [
    { linkedin = "https://www.linkedin.com/in/morten-nordbye-325bb71bb" },
    { github = "https://github.com/mortennordbye" },
    { link = "https://nordbye.it" },
]

[header]
layout = "basic"

[homepage]
layout = "background"
homepageImage = "images/background.png"
showRecent = true
showRecentItems = 5
showMoreLink = true
showMoreLinkDest = "/blog"
cardView = false
cardViewScreenWidth = false
layoutBackgroundBlur = false

[article]
showDate = true
showViews = false
showLikes = false
showDateUpdated = false
showAuthor = true
showHero = true
heroStyle = "basic"
layoutBackgroundBlur = true
showBreadcrumbs = true
showDraftLabel = true
showEdit = false
showSummary = true
showTableOfContents = true
showTaxonomies = true
showAuthorsBadges = false
showWordCount = true
showComments = true
showRelatedContent = true
relatedContentLimit = 3
sharingLinks = ["linkedin", "reddit"]

[list]
showHero = true
heroStyle = "background"
layoutBackgroundBlur = true
showBreadcrumbs = false
showSummary = false
showViews = false
showLikes = false
showTableOfContents = false
showCards = true
groupByYear = true
cardView = true
cardViewScreenWidth = false
constrainItemsWidth = false

[sitemap]
