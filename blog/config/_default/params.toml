description = "Kubernetes, cloud infrastructure and homelab engineering from a Talos cluster I actually run. Practical guides on observability, networking and GitOps."

# periwinkle | sage | clay | plum | slate | rose
# slate, retuned to the portfolio's arctic blue in assets/css/custom.css;
# slate as base means losing that file degrades to muted blue, not off-brand.
colorScheme = "slate"
defaultAppearance = "dark"
autoSwitchAppearance = true

# Theme default is off; on so the accent reaches headings, chips and rules,
# not just links.
accentEmphasis = true

enableSearch = true
enableCodeCopy = true

# Theme default is off; on because dashboard screenshots need zoom to be readable.
enableLightbox = true

mainSections = ["blog"]

disableImageOptimization = false
defaultBackgroundImage = "images/background.png"

smartTOCHideUnfocusedChildren = true

[author]
name = "Morten Victor Nordbye"
image = "images/profile.png"
headline = "Cloud engineer. Homelab enthusiast."
bio = "I write about Kubernetes, infrastructure, and making things work."
links = [
    { linkedin = "https://www.linkedin.com/in/morten-nordbye-325bb71bb" },
    { github = "https://github.com/mortennordbye" },
    { link = "https://nordbye.it" },
]

[header]
layout = "basic"

[home]
# Not `background`: that layout pins light-on-dark text over the image, which
# reads as a black band on a light page. Only it reads `backgroundImage`.
layout = "stack"
recentCount = 5

[article]
showDate = true
showDateUpdated = false
showAuthor = true
showHero = true
heroStyle = "basic"
layoutBackgroundBlur = true
showBreadcrumbs = true
showEdit = false
showTableOfContents = true
showTaxonomies = true
showAuthorsBadges = false
showWordCount = true
showComments = true
showRelated = true
relatedLimit = 3
sharingLinks = ["linkedin", "reddit"]

[list]
groupByYear = true
cardView = true

[taxonomy]
showTermCount = true
cardView = false

[footer]
# Unset, the theme name in the attribution line renders as plain text.
themeURL = "https://github.com/mortennordbye/northlight"
showMenu = true
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = true
showScrollToTop = true

# Cloudflare Web Analytics.
[analytics.cloudflare]
token = "47962423c7a84c78a8a932edaf8844cf"

# Only these five keys are read; the theme fixes the other data-* attributes
# itself (data-theme follows the site's appearance toggle).
[comments.giscus]
repo = "mortennordbye/homelab"
repoId = "R_kgDOOEXL5g"
category = "Announcements"
categoryId = "DIC_kwDOOEXL5s4C06qE"
mapping = "pathname"
reactionsEnabled = true
