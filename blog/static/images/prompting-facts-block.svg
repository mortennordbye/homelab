<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d18e83"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7cc088"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#61b86f" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1000" height="330" fill="url(#bg)"/>
  <rect width="1000" height="330" fill="url(#grid)"/>

  <!-- Summarised history -->
  <rect x="30" y="30" width="450" height="270" rx="12" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  <text x="54" y="62" fill="#e7e7e7" font-size="17" font-weight="600">Summarised history</text>
  <text x="54" y="84" fill="#a5a5a5" font-size="12.5">a long chat compresses the details</text>

  <rect x="54" y="104" width="402" height="54" rx="8" fill="#141414" stroke="#262626"/>
  <text x="68" y="136" fill="#e7e7e7" font-size="13">You: budget is 40 000 NOK, go live 14 November</text>

  <path d="M255 158V194" stroke="#d18e83" stroke-width="2" marker-end="url(#ar-bad)"/>
  <text x="268" y="181" fill="#a5a5a5" font-size="12">summarised</text>

  <rect x="54" y="198" width="402" height="74" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="54" y="205" width="4" height="60" rx="2" fill="#d18e83"/>
  <text x="68" y="228" fill="#e7e7e7" font-size="14">Discussed the budget and a deadline</text>
  <text x="68" y="254" fill="#d18e83" font-size="12.5">the numbers are gone</text>

  <!-- Pinned facts -->
  <rect filter="url(#glow)" x="520" y="30" width="450" height="270" rx="12" fill="#0d0d0d" stroke="#61b86f" stroke-width="2"/>
  <text x="544" y="62" fill="#e7e7e7" font-size="17" font-weight="600">Pinned facts</text>
  <text x="544" y="84" fill="#a5a5a5" font-size="12.5">kept outside the history, written by you</text>

  <rect filter="url(#glow)" x="544" y="104" width="402" height="108" rx="8" fill="#141414" stroke="#61b86f"/>
  <text x="560" y="129" fill="#61b86f" font-size="13" font-family="ui-monospace, Menlo, monospace">&lt;facts&gt;</text>
  <text x="560" y="153" fill="#a5a5a5" font-size="12.5" font-family="ui-monospace, Menlo, monospace">Budget: 40 000 NOK excl. VAT</text>
  <text x="560" y="175" fill="#a5a5a5" font-size="12.5" font-family="ui-monospace, Menlo, monospace">Deadline: go live 14 November</text>
  <text x="560" y="197" fill="#a5a5a5" font-size="12.5" font-family="ui-monospace, Menlo, monospace">Decided: no new vendor this year</text>

  <path d="M745 212V240" stroke="#7cc088" stroke-width="2" marker-end="url(#ar-ok)"/>

  <rect x="544" y="244" width="402" height="40" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="544" y="251" width="4" height="26" rx="2" fill="#7cc088"/>
  <text x="745" y="269" text-anchor="middle" fill="#7cc088" font-size="13.5">pasted at the top of every new prompt</text>
</svg>
