<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d18e83"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7cc088"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#61b86f" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>

  <!-- Question -->
  <rect x="230" y="28" width="540" height="64" rx="10" fill="#141414" stroke="#262626" stroke-width="1.5"/>
  <text x="500" y="56" text-anchor="middle" fill="#e7e7e7" font-size="14.5">What does the contract say about the notice period?</text>
  <text x="500" y="78" text-anchor="middle" fill="#7a7a7a" font-size="12">the contract says nothing about it</text>

  <path d="M380 92L255 146" stroke="#d18e83" stroke-width="2" marker-end="url(#ar-bad)"/>
  <path d="M620 92L745 146" stroke="#7cc088" stroke-width="2" marker-end="url(#ar-ok)"/>

  <!-- Without -->
  <rect x="30" y="150" width="450" height="140" rx="12" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  <text x="54" y="180" fill="#e7e7e7" font-size="16" font-weight="600">No way to say "not stated"</text>
  <rect x="54" y="196" width="402" height="44" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="54" y="203" width="4" height="30" rx="2" fill="#d18e83"/>
  <text x="68" y="223" fill="#e7e7e7" font-size="13.5">The notice period is three months.</text>
  <text x="54" y="268" fill="#d18e83" font-size="12.5">sounds like an answer, is not in the contract</text>

  <!-- With -->
  <rect filter="url(#glow)" x="520" y="150" width="450" height="140" rx="12" fill="#0d0d0d" stroke="#61b86f" stroke-width="2"/>
  <text x="544" y="180" fill="#e7e7e7" font-size="16" font-weight="600">With the exact refusal line</text>
  <rect x="544" y="196" width="402" height="56" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="544" y="203" width="4" height="42" rx="2" fill="#7cc088"/>
  <text x="558" y="219" fill="#e7e7e7" font-size="13">I do not have enough information in the</text>
  <text x="558" y="239" fill="#e7e7e7" font-size="13">provided documents to answer this.</text>
  <text x="544" y="276" fill="#7cc088" font-size="12.5">word for word, easy to spot</text>
</svg>
