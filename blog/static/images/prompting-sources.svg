<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
    <marker id="ar-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a7a7a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#61b86f"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#61b86f" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1000" height="330" fill="url(#bg)"/>
  <rect width="1000" height="330" fill="url(#grid)"/>

  <!-- Confidence -->
  <rect x="30" y="30" width="450" height="270" rx="12" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  <text x="54" y="62" fill="#e7e7e7" font-size="17" font-weight="600">"How sure are you?"</text>
  <text x="54" y="84" fill="#a5a5a5" font-size="12.5">one right answer, one wrong answer</text>

  <rect x="54" y="106" width="230" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="68" y="133" fill="#e7e7e7" font-size="13.5">Answer 1 (right)</text>
  <path d="M284 128H330" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ar-mute)"/>
  <rect x="334" y="106" width="122" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="395" y="133" text-anchor="middle" fill="#e7e7e7" font-size="15" font-weight="600">9 / 10</text>

  <rect x="54" y="166" width="230" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="68" y="193" fill="#e7e7e7" font-size="13.5">Answer 2 (wrong)</text>
  <path d="M284 188H330" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ar-mute)"/>
  <rect x="334" y="166" width="122" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="395" y="193" text-anchor="middle" fill="#e7e7e7" font-size="15" font-weight="600">9 / 10</text>

  <rect x="54" y="232" width="402" height="44" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="54" y="239" width="4" height="30" rx="2" fill="#d18e83"/>
  <text x="255" y="259" text-anchor="middle" fill="#d18e83" font-size="13">same score, no way to tell them apart</text>

  <!-- Quote the line -->
  <rect filter="url(#glow)" x="520" y="30" width="450" height="270" rx="12" fill="#0d0d0d" stroke="#61b86f" stroke-width="2"/>
  <text x="544" y="62" fill="#e7e7e7" font-size="17" font-weight="600">"Quote the line for each claim"</text>
  <text x="544" y="84" fill="#a5a5a5" font-size="12.5">the same two answers</text>

  <rect x="544" y="106" width="170" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="558" y="133" fill="#e7e7e7" font-size="13.5">Answer 1</text>
  <path d="M714 128H752" stroke="#61b86f" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="756" y="106" width="190" height="44" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="756" y="113" width="4" height="30" rx="2" fill="#7cc088"/>
  <text x="851" y="133" text-anchor="middle" fill="#7cc088" font-size="13">line found in source</text>

  <rect x="544" y="166" width="170" height="44" rx="8" fill="#141414" stroke="#262626"/>
  <text x="558" y="193" fill="#e7e7e7" font-size="13.5">Answer 2</text>
  <path d="M714 188H752" stroke="#61b86f" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="756" y="166" width="190" height="44" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="756" y="173" width="4" height="30" rx="2" fill="#d18e83"/>
  <text x="851" y="193" text-anchor="middle" fill="#d18e83" font-size="13">no such line</text>

  <rect x="544" y="232" width="402" height="44" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="544" y="239" width="4" height="30" rx="2" fill="#7cc088"/>
  <text x="745" y="259" text-anchor="middle" fill="#7cc088" font-size="13">the wrong one is caught in seconds</text>
</svg>
