<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#61b86f"/>
    </marker>
    <marker id="ar-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f8f6a"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7cc088"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#61b86f" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>

  <!-- Write once -->
  <rect filter="url(#glow)" x="30" y="30" width="450" height="280" rx="12" fill="#0d0d0d" stroke="#61b86f" stroke-width="2"/>
  <text x="54" y="62" fill="#e7e7e7" font-size="17" font-weight="600">Write the rules down once</text>
  <text x="54" y="84" fill="#a5a5a5" font-size="12.5">standing rules load every time, saved prompts on demand</text>

  <rect x="54" y="104" width="190" height="72" rx="8" fill="#141414" stroke="#61b86f"/>
  <text x="149" y="132" text-anchor="middle" fill="#e7e7e7" font-size="14" font-weight="600">Standing rules</text>
  <text x="149" y="153" text-anchor="middle" fill="#a5a5a5" font-size="11.5">custom instructions,</text>
  <text x="149" y="168" text-anchor="middle" fill="#a5a5a5" font-size="11.5">Project, CLAUDE.md</text>

  <rect x="54" y="214" width="190" height="72" rx="8" fill="#141414" stroke="#5f8f6a" stroke-dasharray="5 4"/>
  <text x="149" y="244" text-anchor="middle" fill="#e7e7e7" font-size="14" font-weight="600">Saved prompts</text>
  <text x="149" y="265" text-anchor="middle" fill="#a5a5a5" font-size="11.5">one per task</text>

  <rect x="320" y="104" width="136" height="40" rx="8" fill="#141414" stroke="#262626"/>
  <text x="388" y="129" text-anchor="middle" fill="#e7e7e7" font-size="13">chat</text>
  <rect x="320" y="160" width="136" height="40" rx="8" fill="#141414" stroke="#262626"/>
  <text x="388" y="185" text-anchor="middle" fill="#e7e7e7" font-size="13">chat</text>
  <rect x="320" y="216" width="136" height="40" rx="8" fill="#141414" stroke="#262626"/>
  <text x="388" y="241" text-anchor="middle" fill="#e7e7e7" font-size="13">chat</text>

  <g stroke="#61b86f" stroke-width="2">
    <path d="M244 130L316 124" marker-end="url(#ar)"/>
    <path d="M244 140L316 178" marker-end="url(#ar)"/>
    <path d="M244 150L316 230" marker-end="url(#ar)"/>
  </g>
  <path d="M244 250L316 242" stroke="#5f8f6a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-soft)"/>

  <!-- Test first -->
  <rect x="520" y="30" width="450" height="280" rx="12" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  <text x="544" y="62" fill="#e7e7e7" font-size="17" font-weight="600">Test on a few first</text>
  <text x="544" y="84" fill="#a5a5a5" font-size="12.5">fix the prompt while mistakes are cheap</text>

  <g transform="translate(0,52)">
  <rect x="544" y="110" width="120" height="48" rx="8" fill="#141414" stroke="#262626"/>
  <text x="604" y="139" text-anchor="middle" fill="#e7e7e7" font-size="14">3 items</text>
  <path d="M664 134H700" stroke="#61b86f" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="704" y="110" width="120" height="48" rx="8" fill="#141414" stroke="#262626"/>
  <text x="764" y="139" text-anchor="middle" fill="#e7e7e7" font-size="14">check</text>

  <path d="M764 158V196H604V162" fill="none" stroke="#5f8f6a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-soft)"/>
  <text x="684" y="216" text-anchor="middle" fill="#8ec798" font-size="12">wrong? fix the prompt, run again</text>

  <path d="M824 134H862" stroke="#7cc088" stroke-width="2" marker-end="url(#ar-ok)"/>
  <rect x="866" y="110" width="80" height="48" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="866" y="117" width="4" height="34" rx="2" fill="#7cc088"/>
  <text x="906" y="139" text-anchor="middle" fill="#7cc088" font-size="14" font-weight="600">300</text>
  <text x="845" y="182" text-anchor="middle" fill="#7cc088" font-size="12">good</text>
  </g>
</svg>
