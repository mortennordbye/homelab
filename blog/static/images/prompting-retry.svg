<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
    <marker id="ar-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a7a7a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#61b86f"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#61b86f" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1000" height="350" fill="url(#bg)"/>
  <rect width="1000" height="350" fill="url(#grid)"/>

  <!-- Try again -->
  <rect x="30" y="30" width="450" height="290" rx="12" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  <text x="54" y="62" fill="#e7e7e7" font-size="17" font-weight="600">"Try again"</text>
  <text x="54" y="84" fill="#a5a5a5" font-size="12.5">nothing new goes in, so nothing new comes out</text>

  <rect x="54" y="104" width="402" height="44" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="54" y="111" width="4" height="30" rx="2" fill="#d18e83"/>
  <text x="68" y="131" fill="#e7e7e7" font-size="13.5">Model: B is cheaper, 1 400 is less than 12 000</text>

  <path d="M255 148V176" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ar-mute)"/>
  <rect x="160" y="180" width="190" height="36" rx="8" fill="#141414" stroke="#262626"/>
  <text x="255" y="203" text-anchor="middle" fill="#a5a5a5" font-size="13">You: try again</text>
  <path d="M255 216V244" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ar-mute)"/>

  <rect x="54" y="248" width="402" height="54" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="54" y="255" width="4" height="40" rx="2" fill="#d18e83"/>
  <text x="68" y="271" fill="#e7e7e7" font-size="13.5">Model: on reflection, B is the cheaper option</text>
  <text x="68" y="291" fill="#d18e83" font-size="12">same mistake, new words</text>

  <!-- Specific error -->
  <rect filter="url(#glow)" x="520" y="30" width="450" height="290" rx="12" fill="#0d0d0d" stroke="#61b86f" stroke-width="2"/>
  <text x="544" y="62" fill="#e7e7e7" font-size="17" font-weight="600">The specific error</text>
  <text x="544" y="84" fill="#a5a5a5" font-size="12.5">the correction is new information</text>

  <rect x="544" y="104" width="402" height="44" rx="8" fill="#141414" stroke="#d18e83"/>
  <rect x="544" y="111" width="4" height="30" rx="2" fill="#d18e83"/>
  <text x="558" y="131" fill="#e7e7e7" font-size="13.5">Model: B is cheaper, 1 400 is less than 12 000</text>

  <path d="M745 148V166" stroke="#61b86f" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="544" y="170" width="402" height="56" rx="8" fill="#141414" stroke="#5f8f6a"/>
  <text x="558" y="193" fill="#8ec798" font-size="12.5">You: A is per year with VAT, B is per month without.</text>
  <text x="558" y="213" fill="#8ec798" font-size="12.5">Recalculate yearly with VAT, quote the lines.</text>
  <path d="M745 226V244" stroke="#61b86f" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="544" y="248" width="402" height="54" rx="8" fill="#141414" stroke="#7cc088"/>
  <rect x="544" y="255" width="4" height="40" rx="2" fill="#7cc088"/>
  <text x="558" y="271" fill="#e7e7e7" font-size="13">Model: A is 12 000. B is at least 21 000,</text>
  <text x="558" y="291" fill="#7cc088" font-size="12">plus a setup fee that is not in the offer</text>
</svg>
