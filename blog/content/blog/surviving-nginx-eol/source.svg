<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61b86f"/>
      <stop offset="1" stop-color="#8ec798"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- aperture motif: concentric arcs sweeping in from off-canvas, top right.
       Replaces the old faint grid, which was the same graph-paper device the
       portfolio hero used and reads as generated. Kept clear of the header
       block (left) and the diagram area (lower two thirds). -->
  <g fill="none" stroke="#61b86f" stroke-opacity="0.11" stroke-width="2">
    <circle cx="1268" cy="96" r="150"/>
    <circle cx="1268" cy="96" r="232"/>
    <circle cx="1268" cy="96" r="314"/>
  </g>
  <!-- url, top right -->
  <text x="1130" y="58" text-anchor="end" font-size="22" fill="#7a7a7a" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- compact header -->
  <rect x="80" y="74" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="104" y="104" font-size="20" font-weight="700" fill="#61b86f" letter-spacing="3">KUBERNETES &#183; INGRESS &#183; MIGRATION</text>
  <text x="98" y="152" font-size="46" font-weight="700" fill="#e7e7e7">Surviving the</text>
  <text x="98" y="200" font-size="46" font-weight="700" fill="#e7e7e7">NGINX Ingress EOL</text>

  <!-- motif: traffic cutover nginx (drained) -> traefik (live), large -->
  <g transform="translate(0,300)">
    <text x="150" y="150" font-size="26" font-weight="600" fill="#7a7a7a">traffic</text>
    <g stroke="#3a3a3a" stroke-width="3" fill="none">
      <path d="M280,142 L380,112"/><path d="M280,142 L380,142"/><path d="M280,142 L380,172"/>
    </g>
    <circle cx="380" cy="142" r="12" fill="#141414" stroke="#a5a5a5" stroke-width="3"/>

    <!-- 0% path to nginx (drained) -->
    <path d="M392,132 C500,90 560,70 640,70" stroke="#d18e83" stroke-width="3" fill="none" stroke-dasharray="7 9" stroke-opacity="0.7"/>
    <g opacity="0.6">
      <rect x="640" y="42" width="300" height="76" rx="14" fill="#141414" stroke="#d18e83" stroke-width="2.5"/>
      <rect x="658" y="58" width="44" height="44" rx="10" fill="#eef1ee"/>
      <image x="664" y="64" width="32" height="32" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
      <text x="718" y="92" font-size="28" font-weight="600" fill="#7a7a7a">nginx</text>
      <text x="918" y="92" text-anchor="end" font-size="26" font-weight="700" fill="#d18e83">0%</text>
    </g>

    <!-- 100% path to traefik (live) -->
    <path d="M392,152 C500,196 560,214 640,214" stroke="#61b86f" stroke-width="4" fill="none"/>
    <rect x="640" y="176" width="300" height="76" rx="14" fill="#141414" stroke="#61b86f" stroke-width="3"/>
    <rect x="658" y="192" width="44" height="44" rx="10" fill="#eef1ee"/>
    <image x="662" y="200" width="36" height="28" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="718" y="226" font-size="28" font-weight="600" fill="#e7e7e7">traefik</text>
    <text x="918" y="226" text-anchor="end" font-size="26" font-weight="700" fill="#61b86f">100%</text>

    <!-- live cluster -->
    <path d="M940,214 L985,214" stroke="#61b86f" stroke-width="4" fill="none"/>
    <circle cx="1008" cy="214" r="15" fill="#61b86f"/>
    <text x="1036" y="222" font-size="22" font-weight="600" fill="#a5a5a5">Gateway API</text>
  </g>
</svg>
