<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61b86f"/>
      <stop offset="1" stop-color="#8ec798"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- aperture motif: concentric arcs sweeping in from off-canvas, top right. -->
  <g fill="none" stroke="#61b86f" stroke-opacity="0.11" stroke-width="2">
    <circle cx="1268" cy="96" r="150"/>
    <circle cx="1268" cy="96" r="232"/>
    <circle cx="1268" cy="96" r="314"/>
  </g>

  <!-- url, top right -->
  <text x="1130" y="58" text-anchor="end" font-size="22" fill="#7a7a7a" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- compact header -->
  <rect x="80" y="74" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="104" y="104" font-size="20" font-weight="700" fill="#61b86f" letter-spacing="3">SELF HOSTED &#183; PERSONAL FINANCE &#183; NORWEGIAN TAX</text>
  <text x="98" y="152" font-size="46" font-weight="700" fill="#e7e7e7">Pr&#248;ysen, not</text>
  <text x="98" y="200" font-size="46" font-weight="700" fill="#e7e7e7">trinnskatt.</text>

  <!-- motif: three inputs converge on Headroom, which sits on your own machine -->
  <g>
    <!-- input labels. Set beside their own tile rather than above it: stacked tiles on a
         104px pitch leave a label above ambiguous about which box it belongs to. -->
    <g font-size="22" font-weight="600" fill="#a5a5a5" text-anchor="end">
      <text x="184" y="352">salary</text>
      <text x="184" y="456">home</text>
      <text x="184" y="560">pension</text>
    </g>

    <!-- input tiles: no vendor logo exists for these, so styled dark tiles with glyphs -->
    <g>
      <rect x="200" y="306" width="76" height="76" rx="16" fill="#141414" stroke="#262626" stroke-width="2"/>
      <!-- rising bars -->
      <g fill="#5f8f6a">
        <rect x="218" y="354" width="12" height="12" rx="3"/>
        <rect x="236" y="342" width="12" height="24" rx="3"/>
        <rect x="254" y="326" width="12" height="40" rx="3"/>
      </g>

      <rect x="200" y="410" width="76" height="76" rx="16" fill="#141414" stroke="#262626" stroke-width="2"/>
      <!-- house -->
      <path d="M238 428 L268 452 H260 V472 H216 V452 H208 Z" fill="#5f8f6a"/>

      <rect x="200" y="514" width="76" height="76" rx="16" fill="#141414" stroke="#262626" stroke-width="2"/>
      <!-- stacked coins -->
      <g fill="none" stroke="#5f8f6a" stroke-width="3">
        <ellipse cx="238" cy="540" rx="24" ry="9"/>
        <ellipse cx="238" cy="556" rx="24" ry="9"/>
        <ellipse cx="238" cy="572" rx="24" ry="9"/>
      </g>
    </g>

    <!-- connectors converging on the app tile -->
    <g fill="none" stroke="#3a3a3a" stroke-width="3">
      <path d="M276 344 C 350 344, 370 448, 430 448"/>
      <path d="M276 448 H 430"/>
      <path d="M276 552 C 350 552, 370 448, 430 448"/>
    </g>

    <!-- Headroom tile: the app's own mark, ceiling line with an arrow beneath -->
    <rect x="430" y="386" width="124" height="124" rx="22" fill="#eef1ee"/>
    <g transform="translate(430,386) scale(3.875)">
      <rect x="6" y="6" width="20" height="3" rx="1.5" fill="#C9A24A"/>
      <path d="M16 10.5 L23 18.5 H18.5 V26 H13.5 V18.5 H9 Z" fill="#C9A24A"/>
    </g>
    <text x="492" y="544" font-size="24" font-weight="600" fill="#a5a5a5" text-anchor="middle">headroom</text>

    <!-- connector into the boundary -->
    <g fill="none" stroke="#61b86f" stroke-width="4">
      <path d="M554 448 H 700"/>
    </g>

    <!-- boundary: your own machine. Nothing crosses it going out. -->
    <rect x="700" y="304" width="420" height="290" rx="24" fill="none" stroke="#262626" stroke-width="2"/>
    <text x="910" y="346" font-size="24" font-weight="600" fill="#7a7a7a" text-anchor="middle">your own machine</text>

    <rect x="760" y="384" width="120" height="120" rx="20" fill="#eef1ee"/>
    <image x="778" y="402" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="820" y="544" font-size="24" font-weight="600" fill="#a5a5a5" text-anchor="middle">docker</text>

    <rect x="940" y="384" width="120" height="120" rx="20" fill="#eef1ee"/>
    <image x="958" y="402" width="84" height="84" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="1000" y="544" font-size="24" font-weight="600" fill="#a5a5a5" text-anchor="middle">sqlite</text>
  </g>
</svg>
