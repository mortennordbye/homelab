<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- url, top right -->
  <text x="1120" y="78" text-anchor="end" font-size="24" fill="#8898aa" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- left accent bar -->
  <rect x="80" y="150" width="6" height="212" rx="3" fill="url(#bar)"/>

  <!-- kicker -->
  <text x="110" y="172" font-size="22" font-weight="700" fill="#5db7ff" letter-spacing="3.5">KUBERNETES &#183; TUTORIAL &#183; QUICK START</text>

  <!-- title -->
  <text x="105" y="252" font-size="68" font-weight="700" fill="#e8eef5">Getting Started</text>
  <text x="105" y="326" font-size="68" font-weight="700" fill="#e8eef5">with Kubernetes</text>

  <!-- subtitle -->
  <text x="110" y="372" font-size="30" fill="#b0bccb">A quick start guide for your first cluster</text>

  <!-- motif: control plane schedules pods onto worker nodes -->
  <g transform="translate(150,412)">
    <!-- control plane: kubernetes logo tile -->
    <rect x="0" y="16" width="96" height="96" rx="16" fill="#eef2f7"/>
    <image x="13" y="29" width="70" height="70" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="48" y="140" text-anchor="middle" font-size="20" font-weight="600" fill="#b0bccb">control plane</text>

    <!-- scheduling arrows -->
    <g stroke="#5db7ff" stroke-width="2.5" fill="none" stroke-opacity="0.6">
      <path d="M96,64 C 240,64 320,150 470,150"/>
      <path d="M96,64 C 300,64 420,150 760,150"/>
    </g>

    <!-- worker node 1 -->
    <rect x="470" y="118" width="220" height="92" rx="10" fill="#111923" stroke="#2a3849" stroke-width="2"/>
    <text x="488" y="145" font-size="18" font-weight="600" fill="#8898aa">node 1</text>
    <rect x="488" y="160" width="32" height="32" rx="6" fill="#5db7ff"/>
    <rect x="528" y="160" width="32" height="32" rx="6" fill="#3a4a5e"/>
    <rect x="568" y="160" width="32" height="32" rx="6" fill="#3a4a5e"/>

    <!-- worker node 2 -->
    <rect x="760" y="118" width="220" height="92" rx="10" fill="#111923" stroke="#2a3849" stroke-width="2"/>
    <text x="778" y="145" font-size="18" font-weight="600" fill="#8898aa">node 2</text>
    <rect x="778" y="160" width="32" height="32" rx="6" fill="#3a4a5e"/>
    <rect x="818" y="160" width="32" height="32" rx="6" fill="#5db7ff"/>
    <rect x="858" y="160" width="32" height="32" rx="6" fill="#3a4a5e"/>
  </g>
</svg>
