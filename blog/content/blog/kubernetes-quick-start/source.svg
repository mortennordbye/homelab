<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61b86f"/>
      <stop offset="1" stop-color="#8ec798"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- aperture motif: concentric arcs sweeping in from off-canvas, top right.
       Replaces the old faint grid, which was the same graph-paper device the
       portfolio hero used and reads as generated. Kept clear of the header
       block (left) and the diagram area (lower two thirds). -->
  <g fill="none" stroke="#61b86f" stroke-opacity="0.11" stroke-width="2">
    <circle cx="1268" cy="96" r="150"/>
    <circle cx="1268" cy="96" r="232"/>
    <circle cx="1268" cy="96" r="314"/>
  </g>
  <!-- url, top right -->
  <text x="1130" y="58" text-anchor="end" font-size="22" fill="#7a7a7a" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- compact header -->
  <rect x="80" y="74" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="104" y="104" font-size="20" font-weight="700" fill="#61b86f" letter-spacing="3">KUBERNETES &#183; TUTORIAL &#183; QUICK START</text>
  <text x="98" y="152" font-size="46" font-weight="700" fill="#e7e7e7">Getting Started</text>
  <text x="98" y="200" font-size="46" font-weight="700" fill="#e7e7e7">with Kubernetes</text>

  <!-- motif: control plane schedules pods onto worker nodes (large) -->
  <g transform="translate(0,300)">
    <!-- control plane: kubernetes logo tile -->
    <rect x="150" y="70" width="130" height="130" rx="22" fill="#eef1ee"/>
    <image x="172" y="92" width="86" height="86" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="215" y="232" text-anchor="middle" font-size="24" font-weight="600" fill="#a5a5a5">control plane</text>

    <!-- scheduling arrows -->
    <g stroke="#61b86f" stroke-width="3.5" fill="none" stroke-opacity="0.6">
      <path d="M280,120 C 400,120 440,140 470,140"/>
      <path d="M280,150 C 480,150 600,150 830,150"/>
    </g>

    <!-- worker node 1 -->
    <rect x="470" y="74" width="290" height="150" rx="18" fill="#141414" stroke="#262626" stroke-width="2.5"/>
    <text x="496" y="116" font-size="22" font-weight="600" fill="#7a7a7a">node 1</text>
    <rect x="496" y="136" width="64" height="64" rx="10" fill="#61b86f"/>
    <rect x="572" y="136" width="64" height="64" rx="10" fill="#3a3a3a"/>
    <rect x="648" y="136" width="64" height="64" rx="10" fill="#3a3a3a"/>

    <!-- worker node 2 -->
    <rect x="830" y="74" width="290" height="150" rx="18" fill="#141414" stroke="#262626" stroke-width="2.5"/>
    <text x="856" y="116" font-size="22" font-weight="600" fill="#7a7a7a">node 2</text>
    <rect x="856" y="136" width="64" height="64" rx="10" fill="#3a3a3a"/>
    <rect x="932" y="136" width="64" height="64" rx="10" fill="#61b86f"/>
    <rect x="1008" y="136" width="64" height="64" rx="10" fill="#3a3a3a"/>
  </g>
</svg>
