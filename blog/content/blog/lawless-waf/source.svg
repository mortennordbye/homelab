<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5db7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- url, top right -->
  <text x="1130" y="58" text-anchor="end" font-size="22" fill="#8898aa" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- compact header -->
  <rect x="80" y="74" width="6" height="116" rx="3" fill="url(#bar)"/>
  <text x="104" y="104" font-size="20" font-weight="700" fill="#5db7ff" letter-spacing="3">AZURE WAF &#183; FALSE POSITIVES &#183; COST</text>
  <text x="98" y="152" font-size="46" font-weight="700" fill="#e8eef5">Tuning Azure WAF</text>
  <text x="98" y="200" font-size="46" font-weight="700" fill="#e8eef5">Without the Bill</text>

  <!-- motif: WAF shield -> Blob Storage archive -> DuckDB (local, free) -> Terraform exclusion -->

  <!-- flow arrows -->
  <g stroke="#5db7ff" stroke-width="4" fill="none">
    <line x1="196" y1="366" x2="286" y2="366" marker-end="url(#arrow)"/>
    <line x1="428" y1="366" x2="562" y2="366" marker-end="url(#arrow)"/>
    <line x1="704" y1="366" x2="838" y2="366" marker-end="url(#arrow)"/>
  </g>

  <!-- WAF origin, drawn shield -->
  <g transform="translate(150,366)">
    <path d="M0,-46 L34,-32 L34,6 C34,30 18,44 0,52 C-18,44 -34,30 -34,6 L-34,-32 Z"
          fill="#111923" stroke="#ef6f7a" stroke-width="4"/>
    <path d="M-14,2 L-4,14 L16,-12" fill="none" stroke="#ef6f7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="150" y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">WAF</text>

  <!-- Blob Storage tile -->
  <rect x="294" y="300" width="132" height="132" rx="16" fill="#eef2f7"/>
  <image x="314" y="320" width="92" height="92" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/>
  <text x="360" y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">Blob Storage</text>

  <!-- DuckDB tile -->
  <rect x="570" y="300" width="132" height="132" rx="16" fill="#eef2f7"/>
  <image x="590" y="320" width="92" height="92" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/>
  <text x="636" y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">DuckDB</text>

  <!-- Terraform tile -->
  <rect x="846" y="300" width="132" height="132" rx="16" fill="#eef2f7"/>
  <image x="866" y="320" width="92" height="92" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/>
  <text x="912" y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#b0bccb">Terraform</text>

  <!-- cost chip over DuckDB: the local query is free -->
  <rect x="541" y="246" width="190" height="42" rx="21" fill="#0e1a14" stroke="#6ad6a8" stroke-width="2"/>
  <text x="636" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#6ad6a8">$0 per query</text>

  <!-- caption under the flow -->
  <text x="636" y="540" text-anchor="middle" font-size="26" fill="#8898aa">Query the archive you already keep.</text>
</svg>
