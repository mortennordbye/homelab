<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1015"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db7ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- url, top right -->
  <text x="1120" y="78" text-anchor="end" font-size="24" fill="#8898aa" letter-spacing="0.5">blog.nordbye.it</text>

  <!-- left accent bar -->
  <rect x="80" y="150" width="6" height="212" rx="3" fill="url(#bar)"/>

  <!-- kicker -->
  <text x="110" y="172" font-size="22" font-weight="700" fill="#5db7ff" letter-spacing="3.5">KUBERNETES &#183; INGRESS &#183; MIGRATION</text>

  <!-- title -->
  <text x="105" y="252" font-size="68" font-weight="700" fill="#e8eef5">Surviving the</text>
  <text x="105" y="326" font-size="68" font-weight="700" fill="#e8eef5">NGINX Ingress EOL</text>

  <!-- subtitle -->
  <text x="110" y="372" font-size="30" fill="#b0bccb">A zero downtime migration to Traefik</text>

  <!-- motif: traffic cutover from nginx (drained) to traefik (live) -->
  <g transform="translate(150,452)">
    <text x="0" y="70" font-size="22" font-weight="600" fill="#8898aa">traffic</text>
    <g stroke="#3a4a5e" stroke-width="2" fill="none">
      <path d="M120,62 L210,42"/><path d="M120,62 L210,62"/><path d="M120,62 L210,82"/>
    </g>

    <circle cx="210" cy="62" r="9" fill="#111923" stroke="#b0bccb" stroke-width="2.5"/>

    <!-- 0% path to nginx (drained) -->
    <path d="M219,55 C320,30 380,20 470,20" stroke="#ef6f7a" stroke-width="2.5" fill="none" stroke-dasharray="6 8" stroke-opacity="0.7"/>
    <g opacity="0.6">
      <rect x="470" y="-6" width="262" height="56" rx="10" fill="#111923" stroke="#ef6f7a" stroke-width="2"/>
      <rect x="482" y="6" width="40" height="40" rx="8" fill="#eef2f7"/>
      <image x="487" y="11" width="30" height="30" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
      <text x="536" y="33" font-size="24" font-weight="600" fill="#8898aa">nginx</text>
      <text x="714" y="33" text-anchor="end" font-size="22" font-weight="700" fill="#ef6f7a">0%</text>
    </g>

    <!-- 100% path to traefik (live) -->
    <path d="M219,70 C320,96 380,108 470,108" stroke="#5db7ff" stroke-width="3.5" fill="none"/>
    <rect x="470" y="80" width="262" height="56" rx="10" fill="#111923" stroke="#5db7ff" stroke-width="2.5"/>
    <rect x="482" y="92" width="40" height="40" rx="8" fill="#eef2f7"/>
    <image x="486" y="99" width="32" height="26" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="536" y="119" font-size="24" font-weight="600" fill="#e8eef5">traefik</text>
    <text x="714" y="119" text-anchor="end" font-size="22" font-weight="700" fill="#5db7ff">100%</text>

    <!-- live cluster -->
    <path d="M732,108 L772,108" stroke="#5db7ff" stroke-width="3.5" fill="none"/>
    <circle cx="790" cy="108" r="13" fill="#5db7ff"/>
    <text x="816" y="116" font-size="22" font-weight="600" fill="#b0bccb">Gateway API</text>
  </g>
</svg>
