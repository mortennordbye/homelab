name: CI Portfolio

# PR gate only. Pushes to main are gated by the ci job in
# build-portfolio.yaml before the stage image is built.
on:
  pull_request:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/ci-portfolio.yaml"

# PR gate: a new push supersedes the old run, so cancelling is free.
concurrency:
  group: ci-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Typecheck
        working-directory: portfolio
        run: npm run typecheck

      # The production build catches broken MDX content, bad imports, route
      # errors and API-route type failures that lint/typecheck miss. The deploy
      # workflow rebuilds inside Docker; this run is the pre-merge gate.
      - name: Build
        working-directory: portfolio
        run: npm run build
