name: CI Portfolio

# PR gate only. Pushes to main are gated by the ci job in
# build-portfolio.yaml before the stage image is built.
on:
  pull_request:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/ci-portfolio.yaml"

permissions:
  contents: read

# PR gate: a new push supersedes the old run, so cancelling is free.
concurrency:
  group: ci-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Typecheck
        working-directory: portfolio
        run: npm run typecheck

      # The production build catches broken MDX content, bad imports, route
      # errors and API-route type failures that lint/typecheck miss. The deploy
      # workflow rebuilds inside Docker; this run is the pre-merge gate.
      - name: Build
        working-directory: portfolio
        run: npm run build

  smoke:
    needs: lint-typecheck-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Reads the layer cache build-portfolio.yaml writes on main; a PR never writes it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./portfolio
          load: true
          cache-from: type=gha
          tags: portfolio:smoke

      - name: Smoke tests
        working-directory: portfolio
        run: make smoke-run IMAGE=portfolio:smoke
