name: Docs site

# Builds docs/ with ProperDocs and publishes it to GitHub Pages at docs.nordbye.it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "properdocs.yml"
      - "overrides/**"
      - "scripts/docs_site_hooks.py"
      - "scripts/docs-requirements.txt"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "properdocs.yml"
      - "overrides/**"
      - "scripts/docs_site_hooks.py"
      - "scripts/docs-requirements.txt"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: 3.14.8 # renovate: python-version=python

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ProperDocs and plugins
        run: pip install --require-hashes -r scripts/docs-requirements.txt

      # Strict: a broken link between pages fails the build.
      - name: Build
        run: properdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
