name: Docs site

# Builds docs/ with Starlight (docs-site/) and publishes it to GitHub Pages at docs.nordbye.it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yaml"
      # check-repo-links reads the docs links in these files.
      - "k8s/**"
      - "grafana/**"
      - "README.md"
  # A push made with GITHUB_TOKEN starts no workflow. Without this trigger, a .d2-only
  # change deploys before render-assets commits the SVG, and the site keeps the old picture.
  workflow_run:
    workflows: ["Render Assets"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # sync-docs reads each page's last commit date for "last updated" and the sitemap.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci

      # The link checker fails the build on a broken link between pages.
      - name: Build
        working-directory: docs-site
        run: npm run build

      # Alerts, dashboards and READMEs link to exact pages and #anchors.
      - name: Check repo links
        working-directory: docs-site
        run: node scripts/check-repo-links.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
