name: Render Logo

# Re-crops docs/logo/source.jpg to the shipped PNG whenever the source changes, and
# commits the result back — so the logo in the README never drifts from its source.

on:
  push:
    branches: [main]
    paths:
      - "docs/logo/source.jpg"
      - ".github/workflows/render-logo.yaml"
  workflow_dispatch:

# Commits the rendered logo back to main; queue rather than cancel so a run is
# never killed between rendering and pushing.
concurrency:
  group: render-logo
  cancel-in-progress: false

jobs:
  render:
    if: github.repository_owner == 'mortennordbye'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the re-rendered logo
    steps:
      - uses: actions/checkout@v7

      - name: Crop the logo to a 512 round mark
        # Square crop around the fruit, then a circular mask: the full frame is
        # unreadable at the 128px the README renders it at, and the round
        # silhouette is what makes it read as a mark rather than a photo.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngquant
          convert docs/logo/source.jpg -crop 460x460+280+300 +repage -resize 512x512 \
            \( +clone -alpha transparent -fill white -draw "circle 256,256 256,4" \) \
            -compose copyopacity -composite png32:/tmp/logo-raw.png
          pngquant --quality 70-95 --force --output docs/logo/logo.png /tmp/logo-raw.png

      - name: Commit re-rendered logo if changed
        run: |
          if [ -n "$(git status --porcelain docs/logo)" ]; then
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add docs/logo/logo.png
            git commit -m "chore(logo): re-render logo from source"
            git push origin HEAD:main
          else
            echo "Logo already up to date — nothing to commit."
          fi
