name: CI Terraform

# Format and validate every Terraform root. The workflow has no credentials:
# init runs with -backend=false, so no cloud auth, no state access and
# nothing for a fork PR to steal. Plans and applies stay local. The Proxmox
# and UniFi APIs are LAN-only, and a state backend in CI would expose every
# root's state to a leaked workflow credential.
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yaml"

permissions:
  contents: read

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Format check
        run: terraform fmt -check -recursive -diff terraform/

      # The step discovers roots instead of listing them, so a new root is
      # covered from its first commit. validate catches bad references and
      # provider schema mismatches, most of what a local run finds before plan.
      - name: Validate all roots
        run: |
          set -euo pipefail
          roots=$(find terraform -name '*.tf' -exec dirname {} \; | sort -u)
          for root in $roots; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false > /dev/null
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
