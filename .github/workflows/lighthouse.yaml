name: Lighthouse

# Audits the live public sites with Lighthouse on real GitHub runners (not the
# qemu-emulated local runs, which throttle CPU and inflate perf metrics).
# Median of 3 runs per URL. Assertions gate the trustworthy categories (SEO,
# accessibility, best-practices) and treat performance as a warning, since it
# varies run-to-run and the 3D globe keeps it borderline. Reports upload to
# Lighthouse CI's temporary public storage — the run log links each one.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://nordbye.it/
          - https://blog.nordbye.it/
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Write scores to job summary
        if: always()
        env:
          RESULTS_PATH: ${{ steps.lighthouse.outputs.resultsPath }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
        run: |
          python3 - <<'PY'
          import json, os, glob, statistics
          from collections import defaultdict

          results = os.environ.get("RESULTS_PATH", "")
          links = json.loads(os.environ.get("LINKS") or "{}")

          # LHCI writes one lhr-*.json per run (numberOfRuns); there is no
          # manifest.json in the results dir. Group runs by URL and take the
          # median of each category.
          scores = defaultdict(lambda: defaultdict(list))
          for f in glob.glob(os.path.join(results, "lhr-*.json")):
              try:
                  d = json.load(open(f))
              except (OSError, ValueError):
                  continue
              url = d.get("finalDisplayedUrl") or d.get("finalUrl") or d.get("requestedUrl")
              for k, cat in d.get("categories", {}).items():
                  if isinstance(cat.get("score"), (int, float)):
                      scores[url][k].append(cat["score"])

          def med(url, k):
              vals = scores[url].get(k)
              return str(round(statistics.median(vals) * 100)) if vals else "-"

          out = ["## Lighthouse",
                 "",
                 "| URL | Perf | A11y | Best-Practices | SEO | Report |",
                 "|---|---|---|---|---|---|"]
          for url in scores:
              report = links.get(url) or ""
              rep = f"[open]({report})" if report else "-"
              out.append(
                  f"| {url} | {med(url, 'performance')} | {med(url, 'accessibility')} "
                  f"| {med(url, 'best-practices')} | {med(url, 'seo')} | {rep} |"
              )
          if not scores:
              out.append("_No Lighthouse results were produced._")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          PY
