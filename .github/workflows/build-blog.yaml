name: Build and Deploy Blog

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - prod
        default: stage
  push:
    branches:
      - main # Pushing here updates STAGE only
    paths:
      - "blog/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/blog

jobs:
  ci:
    # Gates stage deploys on push to main. Manual prod dispatch skips this.
    # The Hugo render itself is validated by the Docker build below, and
    # the image is only pushed if that succeeds.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Rule config lives in blog/.markdownlint.yaml
      - name: Lint markdown content
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "blog/content/**/*.md"

  build-and-deploy:
    needs: ci
    # success = push with green ci; skipped = manual prod dispatch
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update manifests
      packages: write # Needed to push images

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # Critical for the Hugo theme submodule
          fetch-depth: 0

      - name: Determine Environment
        id: context
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # workflow_dispatch input takes precedence, otherwise default to stage
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="stage"
          fi

          echo "ENV=${ENV}" >> $GITHUB_OUTPUT

          if [[ "${ENV}" == "prod" ]]; then
            echo "MANIFEST=k8s/talos/apps/blog/deployment.yaml" >> $GITHUB_OUTPUT
          else
            echo "MANIFEST=k8s/talos/apps/blog-stage/deployment.yaml" >> $GITHUB_OUTPUT
          fi

          echo "Deploying to environment: ${ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./blog
          push: true
          # Immutable SHA tag + mutable env tag (stage / prod)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.ENV }}

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

      - name: Update Kubernetes Manifest
        run: |
          MANIFEST="${{ steps.context.outputs.MANIFEST }}"
          TAG="${{ steps.context.outputs.TAG }}"
          ENV="${{ steps.context.outputs.ENV }}"
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

          echo "Updating manifest: ${MANIFEST}"
          echo "New image: ${NEW_IMAGE}"

          if [[ ! -f "${MANIFEST}" ]]; then
            echo "ERROR: Manifest file not found: ${MANIFEST}"
            exit 1
          fi

          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${NEW_IMAGE}|g" $MANIFEST

          echo "Changes made:"
          git diff $MANIFEST

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if [[ -n $(git status -s) ]]; then
            git add $MANIFEST
            git commit -m "chore(blog): deploy ${TAG} to ${ENV}"
            # main may have advanced while the image built (e.g. the portfolio
            # deploy pushing its manifest commit); rebase so the push is
            # fast-forward instead of getting rejected.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Manifest already up to date."
          fi
