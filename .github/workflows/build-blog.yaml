name: Build and Deploy Blog

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "blog/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/blog
  MANIFEST_PATH: k8s/talos/apps/blog/deployment.yaml

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the new tag
      packages: write # Required to push the image

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for themes
          fetch-depth: 0

      - name: Generate Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./blog
          push: true
          # Pushes both 'latest' and the specific SHA
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Update Deployment Manifest
        run: |
          # Define new image tag
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}"

          # Use sed to replace ONLY the blog image line
          # Preserves indentation, comments, and file structure
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: $NEW_IMAGE|g" ${{ env.MANIFEST_PATH }}

          # Verify change in logs
          grep "image:" ${{ env.MANIFEST_PATH }}

          # Configure Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Commit and Push if changes exist
          if [[ -n $(git status -s) ]]; then
            git add ${{ env.MANIFEST_PATH }}
            git commit -m "chore(blog): update image tag to ${{ steps.vars.outputs.sha_short }}"
            git push
          else
            echo "No changes detected."
          fi
