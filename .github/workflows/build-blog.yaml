name: Build Blog image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "blog/**"

permissions:
  contents: read

# Serialise image builds. Never cancel in progress, which could tear a
# half-finished build. Kargo (not this workflow) owns the manifest write and
# promotion; the same image is promoted stage -> prod, so there is no
# per-environment build.
concurrency:
  group: build-blog
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/blog

jobs:
  ci:
    # Gates builds on push to main. Manual dispatch skips this. The Hugo render
    # itself is validated by the Docker build below, and the image is only
    # pushed if that succeeds.
    if: github.event_name == 'push' && github.repository_owner == 'mortennordbye'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Rule config lives in blog/.markdownlint.yaml
      - name: Lint markdown content
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "blog/content/**/*.md"

  build-and-deploy:
    needs: ci
    # success = push with green ci; skipped = manual dispatch
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && github.repository_owner == 'mortennordbye' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push images

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive # Critical for the Hugo theme submodule
          fetch-depth: 0

      - name: Determine tag
        id: context
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./blog
          push: true
          # Git short-SHA for traceability, plus a 0.0.<run_number> semver tag
          # the Kargo Warehouse selects. No moving stage/prod tag: Kargo
          # promotes the same image across environments in git.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.${{ github.run_number }}

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
