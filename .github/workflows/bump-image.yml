# Reusable image-tag bump: an app repo's CI calls this after pushing a new
# image, and it rewrites the image tag in that app's deployment manifest, then
# opens a PR here. Merging the PR is what deploys (ArgoCD syncs from Git).
# Reused across app repos (headroom, logeverylift, ...) by passing
# app_dir/image/new_tag (and manifest, when it isn't deployment.yaml).
name: Bump image tag

on:
  workflow_call:
    inputs:
      app_dir:
        description: Path to the app's dir, e.g. k8s/talos/apps/headroom
        required: true
        type: string
      image:
        description: Image name without tag, e.g. ghcr.io/mortennordbye/headroom
        required: true
        type: string
      new_tag:
        description: New immutable tag, e.g. sha-abc1234
        required: true
        type: string
      manifest:
        description: Manifest file within app_dir holding the image line
        required: false
        default: deployment.yaml
        type: string
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (scoped to this repo)
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: homelab

      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          # In a reusable (workflow_call) run, github.repository is the CALLER
          # (the app repo), so checkout would grab that without this. Pin to
          # homelab, which is where the manifests live.
          repository: ${{ github.repository_owner }}/homelab
          token: ${{ steps.token.outputs.token }}

      - name: Bump image tag in manifest
        run: |
          MANIFEST="${{ inputs.app_dir }}/${{ inputs.manifest }}"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest not found: $MANIFEST"
            exit 1
          fi
          # '|' delimiter so the slashes in the image name don't need escaping.
          sed -i "s|image: ${{ inputs.image }}:.*|image: ${{ inputs.image }}:${{ inputs.new_tag }}|g" "$MANIFEST"
          echo "Diff:"
          git diff -- "$MANIFEST"
          if git diff --quiet -- "$MANIFEST"; then
            echo "::error::no image line matched '${{ inputs.image }}:' in $MANIFEST"
            exit 1
          fi

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.token.outputs.token }}
          branch: deploy/${{ inputs.app_dir }}-${{ inputs.new_tag }}
          title: "deploy: ${{ inputs.image }}:${{ inputs.new_tag }}"
          commit-message: "deploy: ${{ inputs.image }}:${{ inputs.new_tag }}"
          body: |
            Automated image bump from CI.

            - App: `${{ inputs.app_dir }}`
            - Manifest: `${{ inputs.manifest }}`
            - Image: `${{ inputs.image }}:${{ inputs.new_tag }}`

            Merging deploys via ArgoCD.
          delete-branch: true
