# Reusable image-tag bump: an app repo's CI calls this after pushing a new
# image, and it opens a PR here bumping that app's Kustomize newTag. Merging
# the PR is what deploys (ArgoCD syncs from Git). Reused across app repos
# (headroom, logeverylift, ...) by passing app_dir/image/new_tag.
name: Bump image tag

on:
  workflow_call:
    inputs:
      app_dir:
        description: Path to the app's kustomize dir, e.g. k8s/talos/apps/headroom
        required: true
        type: string
      image:
        description: Image name without tag, e.g. ghcr.io/mortennordbye/headroom
        required: true
        type: string
      new_tag:
        description: New immutable tag, e.g. sha-abc1234
        required: true
        type: string
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (scoped to this repo)
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: homelab

      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag
        working-directory: ${{ inputs.app_dir }}
        run: kustomize edit set image ${{ inputs.image }}=${{ inputs.image }}:${{ inputs.new_tag }}

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.token.outputs.token }}
          branch: deploy/${{ inputs.app_dir }}-${{ inputs.new_tag }}
          title: "deploy: ${{ inputs.image }}:${{ inputs.new_tag }}"
          commit-message: "deploy: ${{ inputs.image }}:${{ inputs.new_tag }}"
          body: |
            Automated image bump from CI.

            - App: `${{ inputs.app_dir }}`
            - Image: `${{ inputs.image }}:${{ inputs.new_tag }}`

            Merging deploys via ArgoCD.
          delete-branch: true
