name: Render Diagrams

# Re-renders every docs/diagrams/*.d2 to SVG + PNG whenever a source changes,
# and commits the result back — so the committed images never drift from source.

on:
  push:
    branches: [main]
    paths:
      - "docs/diagrams/*.d2"
      - ".github/workflows/render-diagram.yaml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the re-rendered diagram
    steps:
      - uses: actions/checkout@v6

      - name: Render every D2 diagram to SVG
        run: |
          for f in docs/diagrams/*.d2; do
            name=$(basename "$f" .d2)
            docker run --rm -v "${PWD}/docs/diagrams:/work" \
              terrastruct/d2:v0.7.1 \
              --elk-nodeNodeBetweenLayers=35 \
              --elk-padding="[top=25,left=25,bottom=25,right=25]" \
              --pad 40 "/work/$name.d2" "/work/$name.svg"
          done
          sudo chown -R "$(id -u):$(id -g)" docs/diagrams

      - name: Commit re-rendered diagrams if changed
        run: |
          if [ -n "$(git status --porcelain docs/diagrams)" ]; then
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add docs/diagrams/*.svg
            git commit -m "chore(diagram): re-render diagrams from d2"
            git push origin HEAD:main
          else
            echo "Diagrams already up to date — nothing to commit."
          fi
