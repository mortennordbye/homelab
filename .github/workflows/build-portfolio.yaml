name: Build and Deploy Portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Pushing here updates STAGE
      - prod  # Pushing here updates PROD
    paths:
      - "portfolio/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update manifests
      packages: write # Needed to push images

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # We just need the history, no submodules

      - name: Determine Environment
        id: context
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "MANIFEST=k8s/talos/apps/portfolio/deployment.yaml" >> $GITHUB_OUTPUT
          else
            echo "ENV=stage" >> $GITHUB_OUTPUT
            echo "MANIFEST=k8s/talos/apps/portfolio-stage/deployment.yaml" >> $GITHUB_OUTPUT
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          push: true
          # Tags: Unique SHA (immutable) + Branch Name (mutable)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.ENV }}

      - name: Update Kubernetes Manifest
        run: |
          MANIFEST="${{ steps.context.outputs.MANIFEST }}"
          TAG="${{ steps.context.outputs.TAG }}"
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

          # Update the manifest
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: $NEW_IMAGE|g" $MANIFEST

          # Commit and Push
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if [[ -n $(git status -s) ]]; then
            git add $MANIFEST
            git commit -m "chore(portfolio): deploy $TAG to ${{ steps.context.outputs.ENV }}"
            git push
          else
            echo "Manifest already up to date."
          fi
