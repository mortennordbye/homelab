name: Build Portfolio image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/build-portfolio.yaml"

# Serialise image builds. Never cancel in progress, which could tear a
# half-finished build. Kargo (not this workflow) owns the manifest write and
# promotion; the same image is promoted stage -> prod, so there is no
# per-environment build.
concurrency:
  group: build-portfolio
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/portfolio

jobs:
  ci:
    # Gates builds on push to main. Manual dispatch skips this. The next build
    # is not repeated here: it runs inside the Docker build, and the image is
    # only pushed if that succeeds.
    if: github.event_name == 'push' && github.repository_owner == 'mortennordbye'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Typecheck
        working-directory: portfolio
        run: npm run typecheck

  build-and-deploy:
    needs: ci
    # success = push with green ci; skipped = manual dispatch
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && github.repository_owner == 'mortennordbye' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag
        id: context
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The site renders this manifest (desk monitor). The build context is
      # ./portfolio, so copy it in fresh here rather than trusting the copy in
      # git — what ships is always the manifest actually deployed.
      - name: Sync deployment manifest into the build context
        run: cp k8s/talos/apps/portfolio/deployment.yaml portfolio/src/content/k8s/deployment.yaml

      - uses: docker/build-push-action@v7
        with:
          context: ./portfolio
          push: true
          # GHA-backed layer cache; mode=max stores every intermediate layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ steps.context.outputs.TAG }}
          # Git short-SHA for traceability, plus a 0.0.<run_number> semver tag
          # the Kargo Warehouse selects. No moving stage/prod tag: Kargo
          # promotes the same image across environments in git.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.${{ github.run_number }}

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
