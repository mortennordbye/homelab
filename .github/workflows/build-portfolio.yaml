name: Build Portfolio image

# PRs run checks, build the image and smoke test it. Pushes to main run the same
# checks, then build and push the image. Manual dispatch skips the checks.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/build-portfolio.yaml"
  push:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/build-portfolio.yaml"

permissions:
  contents: read

# PRs cancel a superseded run. Main queues and never cancels, which could tear a
# half-finished push. Kargo (not this workflow) owns the manifest write and
# promotion; the same image is promoted stage -> prod, so there is no
# per-environment build.
concurrency:
  group: build-portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/portfolio
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Typecheck
        working-directory: portfolio
        run: npm run typecheck

  # The production build (broken MDX, bad imports, route errors) runs inside the
  # Docker build, so it is not repeated as an npm step.
  image:
    needs: checks
    # success = green checks; skipped = manual dispatch
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (github.event_name == 'pull_request' || github.repository_owner == 'mortennordbye') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine tag
        id: context
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The site renders this manifest (desk monitor). The build context is
      # ./portfolio, so copy it in fresh here rather than trusting the copy in
      # git — what ships is always the manifest actually deployed.
      - name: Sync deployment manifest into the build context
        run: cp k8s/talos/apps/portfolio/deployment.yaml portfolio/src/content/k8s/deployment.yaml

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./portfolio
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          # GHA-backed layer cache; mode=max stores every intermediate layer.
          # Only main writes it; PRs read it.
          cache-from: type=gha
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max' || '' }}
          build-args: |
            BUILD_SHA=${{ steps.context.outputs.TAG }}
          # Git short-SHA for traceability, plus a 0.0.<run_number> semver tag
          # the Kargo Warehouse selects. No moving stage/prod tag: Kargo
          # promotes the same image across environments in git.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.${{ github.run_number }}

      - name: Smoke tests
        if: env.PUSH != 'true'
        working-directory: portfolio
        run: make smoke-run IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}

      - name: Logout from Docker Hub
        if: always() && env.PUSH == 'true'
        run: docker logout
