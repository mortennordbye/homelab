name: Build and Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - prod
        default: stage
  push:
    branches:
      - main # Pushing here updates STAGE only
    paths:
      - "portfolio/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update manifests
      packages: write # Needed to push images

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # We just need the history, no submodules

      - name: Determine Environment
        id: context
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Determine environment: workflow_dispatch input takes precedence, otherwise stage
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="stage"
          fi

          echo "ENV=${ENV}" >> $GITHUB_OUTPUT

          if [[ "${ENV}" == "prod" ]]; then
            echo "MANIFEST=k8s/talos/apps/portfolio/deployment.yaml" >> $GITHUB_OUTPUT
          else
            echo "MANIFEST=k8s/talos/apps/portfolio-stage/deployment.yaml" >> $GITHUB_OUTPUT
          fi

          echo "Deploying to environment: ${ENV}"
          echo "Using manifest: ${MANIFEST}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          push: true
          # Tags: Unique SHA (immutable) + Branch Name (mutable)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.ENV }}

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

      - name: Update Kubernetes Manifest
        run: |
          MANIFEST="${{ steps.context.outputs.MANIFEST }}"
          TAG="${{ steps.context.outputs.TAG }}"
          ENV="${{ steps.context.outputs.ENV }}"
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

          echo "Updating manifest: ${MANIFEST}"
          echo "New image: ${NEW_IMAGE}"

          # Verify manifest exists
          if [[ ! -f "${MANIFEST}" ]]; then
            echo "ERROR: Manifest file not found: ${MANIFEST}"
            exit 1
          fi

          # Update the manifest
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${NEW_IMAGE}|g" $MANIFEST

          # Show the changes
          echo "Changes made:"
          git diff $MANIFEST

          # Commit and Push
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if [[ -n $(git status -s) ]]; then
            git add $MANIFEST
            git commit -m "chore(portfolio): deploy ${TAG} to ${ENV}"
            git push origin HEAD:main
          else
            echo "Manifest already up to date."
          fi
